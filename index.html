<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>OSMANİYE AFAD</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; transition: 0.5s; }
        .ust-panel { background: #1e293b; padding: 20px 10px; border-bottom: 5px solid #f97316; }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 20px; color: #94a3b8; font-size: 0.9rem; font-weight: bold; }
        #ana-baslik { font-size: 1.8rem; color: #f97316; font-weight: 900; letter-spacing: 1px; margin: 10px 0; }
        .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.75rem; font-weight: bold; margin-top: 10px; color: #64748b; }
        #statusDot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 15px; overflow-y: auto; }
        .kutu { background: #1e293b; padding: 30px 20px; border-radius: 15px; border-left: 10px solid #f97316; width: 95%; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.6); box-sizing: border-box; }
        #vakaMetin { font-size: 1.6rem; font-weight: bold; line-height: 1.4; margin-top: 10px; color: #f8fafc; }
        .kritik-mod { background: #450a0a !important; animation: acil-flash 1.2s infinite; }
        @keyframes acil-flash { 0% {background: #0f172a;} 50% {background: #7f1d1d;} 100% {background: #0f172a;} }
        .btn-grup { display: none; flex-direction: column; gap: 12px; width: 95%; margin-top: 10px; }
        .btn { padding: 20px; border-radius: 15px; border: none; font-weight: 900; color: white; cursor: pointer; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .btn-mavi { background: #0284c7; }
        .btn-sari { background: #eab308; color: black; }
        .btn-mor { background: #4f46e5; }
        .btn-yesil { background: #22c55e; }
        .gecmis-panel { width: 95%; text-align: left; margin-top: 20px; margin-bottom: 50px; }
        .gecmis-baslik { font-size: 0.8rem; color: #64748b; font-weight: 900; margin-bottom: 12px; letter-spacing: 1.5px; border-bottom: 1px solid #334155; padding-bottom: 5px; text-transform: uppercase; }
        .gecmis-item { background: rgba(30, 41, 59, 0.5); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid #475569; animation: slideIn 0.3s; }
        .gecmis-ust-bilgi { display: flex; justify-content: space-between; font-size: 0.7rem; color: #f97316; font-weight: 800; margin-bottom: 5px; }
        .gecmis-vaka-metni { font-size: 1rem; color: #cbd5e1; font-weight: 500; line-height: 1.3; }
        @keyframes slideIn { from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);} }
        .yapimci { padding: 20px 0; font-size: 0.7rem; color: #334155; font-weight: bold; letter-spacing: 2px; }
        #overlay { position: fixed; inset: 0; background: #0f172a; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-baslat { padding: 20px 50px; background: #f97316; color: white; border: none; border-radius: 60px; font-size: 1.4rem; font-weight: 900; }
    </style>
</head>
<body id="anaGövde">
    <div id="overlay">
        <h1 style="letter-spacing: 3px; font-size: 2.5rem; margin-bottom: 30px;">OSMANİYE AFAD</h1>
        <button class="btn-baslat" onclick="sistemiBaslat()">SİSTEMİ BAŞLAT</button>
        <div style="margin-top: 40px; color: #334155; font-size: 0.8rem;">YAZILIM: SEZER ÇALT</div>
    </div>
    <div class="ust-panel">
        <div class="zaman-satiri"><div id="tarih-ust">--/--/---- -------</div><div id="saat-ust">00:00:00</div></div>
        <div id="ana-baslik">OSMANİYE AFAD UÇ BİRİM</div>
        <div class="status-bar"><div id="statusDot"></div><span id="statusText">SİSTEM ÇEVRİMİÇİ</span></div>
    </div>
    <div class="vaka-alani">
        <div class="kutu" id="vakaKutusu">
            <div id="vakaDurumEtiket" style="color:#f97316; font-size:0.8rem; font-weight:900;">● SİSTEM AKTİF </div>
            <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
        </div>
        <div id="islemButonlari" class="btn-grup">
            <button class="btn btn-mavi" onclick="durumGuncelle('YOLDAYIZ', '#0284c7')">✚ EKİP YOLDAYIZ</button>
            <button class="btn btn-sari" onclick="durumGuncelle('OLAY YERİNE VARILDI', '#eab308')">📍 VARILDI</button>
            <button class="btn btn-mor" onclick="durumGuncelle('DÖNÜŞE GEÇİLDİ', '#4f46e5')">🔄 DÖNÜŞE GEÇİLDİ</button>
            <button class="btn btn-yesil" onclick="durumGuncelle('GÖREV TAMAMLANDI', '#22c55e', true)">✓ TAMAMLANDI</button>
        </div>
        <div class="gecmis-panel">
            <div class="gecmis-baslik">SON 5 VAKA KAYDI </div>
            <div id="gecmisListe"></div>
        </div>
        <div class="yapimci">YAZILIM: SEZER ÇALT</div>
    </div>
    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ses = document.getElementById('vakaSes');
        const anaGövde = document.getElementById('anaGövde');
        let alarmZamanlayici;
        let vakaGecmisi = [];

        window.sistemiBaslat = () => {
            document.getElementById('overlay').style.display = 'none';
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
        };
        setInterval(() => {
            const simdi = new Date();
            document.getElementById('saat-ust').innerText = simdi.toLocaleTimeString('tr-TR');
            document.getElementById('tarih-ust').innerText = simdi.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'long' });
        }, 1000);
        window.durumGuncelle = (mesaj, renk, bitis = false) => {
            set(ref(db, 'ekipDurum'), { durum: mesaj, renk: renk, zaman: new Date().toLocaleTimeString('tr-TR') });
            if(bitis) {
                document.getElementById('islemButonlari').style.display = 'none';
                anaGövde.classList.remove('kritik-mod');
                clearTimeout(alarmZamanlayici); ses.pause();
                document.getElementById('vakaDurumEtiket').innerText = "● GÖREV TAMAMLANDI";
            }
        };
        let sonGelenMesaj = "";
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                const yeniMetin = data.metin.trim();
                const gercekVakaMi = !yeniMetin.includes("BEKLENİYOR") && yeniMetin !== "";
                if (gercekVakaMi && yeniMetin !== sonGelenMesaj) {
                    ses.currentTime = 0; ses.loop = true; ses.play().catch(() => {});
                    clearTimeout(alarmZamanlayici);
                    alarmZamanlayici = setTimeout(() => { ses.loop = false; ses.pause(); }, 6000);
                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    document.getElementById('islemButonlari').style.display = 'flex';
                    document.getElementById('vakaDurumEtiket').innerText = "● AKTİF VAKA";
                    if(data.oncelik === 'kritik') anaGövde.classList.add('kritik-mod');
                    else anaGövde.classList.remove('kritik-mod');
                    const simdi = new Date();
                    const tarihBilgisi = simdi.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' });
                    const gunBilgisi = simdi.toLocaleDateString('tr-TR', { weekday: 'long' });
                    const saatBilgisi = simdi.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                    vakaGecmisi.unshift({ metin: yeniMetin, zaman: saatBilgisi, tarih: tarihBilgisi, gun: gunBilgisi });
                    if(vakaGecmisi.length > 5) vakaGecmisi.pop();
                    const listeHtml = vakaGecmisi.map(v => `<div class="gecmis-item"><div class="gecmis-ust-bilgi"><span>📅 ${v.tarih} ${v.gun}</span><span>🕒 ${v.zaman}</span></div><div class="gecmis-vaka-metni">${v.metin}</div></div>`).join('');
                    document.getElementById('gecmisListe').innerHTML = listeHtml;
                    if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
                } else if (!gercekVakaMi) {
                    document.getElementById('vakaMetin').innerText = "KOMUTA MERKEZİNDEN BİLGİ BEKLENİYOR...";
                    document.getElementById('islemButonlari').style.display = 'none';
                    anaGövde.classList.remove('kritik-mod');
                    clearTimeout(alarmZamanlayici); ses.pause();
                    document.getElementById('vakaDurumEtiket').innerText = "● SİSTEM AKTİF / GÖREV BEKLENİYOR";
                }
                sonGelenMesaj = yeniMetin;
            }
        });
    </script>
</body>
</html>
