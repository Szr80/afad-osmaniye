<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f97316">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkFGQUQgU2FoYSIsCiAgInNob3J0X25hbWUiOiAiQUZBRCIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGYxNzJhIiwKICAidGhlbWVfY29sb3IiOiAiI2Y5NzMxNiIsCiAgImljb25zIjogW3sgInNyYyI6ICJodHRwczovL2Nkbi1pY29ucy1wbmcuZnJlZXBpYy5jb20vNTEyLzkxOTUvOTE5NTkxMC5wbmciLCAic2l6ZXMiOiAiNTEyeDUxMiIsICJ0eXBlIjogImltYWdlL3BuZyIgfV0KfQ==">

    <title>OSMANİYE AFAD | SAHA</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 5px solid #f97316; padding-top: calc(10px + env(safe-area-inset-top)); }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 10px; color: #94a3b8; font-size: 0.75rem; font-weight: 900; }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; margin: 5px 0; }
        #personelEtiket { font-size: 0.8rem; color: #f1f5f9; font-weight: bold; text-transform: uppercase; }
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        .ana-vaka-kutusu { background: #1e293b; padding: 25px; border-radius: 20px; border-left: 12px solid #f97316; text-align: left; }
        #vakaMetin { font-size: 1.3rem; font-weight: 900; line-height: 1.4; color: #ffffff; }
        .durum-butonlar { display: none; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-durum { padding: 12px; border-radius: 10px; border: none; font-weight: 900; font-size: 0.75rem; color: white; text-transform: uppercase; }
        .yoldayim { background: #3b82f6; } .olayeri { background: #eab308; } .tamamla { background: #22c55e; grid-column: span 2; }
        .btn-acil { background: #dc2626; border: 5px solid #450a0a; color: white; padding: 20px; border-radius: 18px; font-weight: 900; width: 100%; margin-top: auto; }
        .alt-panel { background: #1e293b; padding: 15px; border-top: 3px solid #334155; display: flex; align-items: center; justify-content: space-between; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .btn-mandal { width: 85px; height: 85px; border-radius: 50%; background: #f97316; border: 8px solid #450a0a; color: white; font-size: 2.3rem; display: flex; align-items: center; justify-content: center; touch-action: none; }
        #sesBildirim { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #22c55e; padding: 15px 30px; border-radius: 50px; display: none; z-index: 10000; }
    </style>
</head>
<body>
    <div id="sesBildirim">✅ SES İLETİLDİ</div>
    
    <div id="loginOverlay" style="position:fixed; inset:0; background:#0f172a; z-index:20000; display:flex; align-items:center; justify-content:center;">
        <div style="background:#1e293b; padding:35px; border-radius:25px; border:3px solid #f97316; width:85%;">
            <h2 style="color:#f97316;">AFAD GİRİŞ</h2>
            <input type="text" id="userName" placeholder="AD SOYAD" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; text-align:center;">
            <button onclick="sistemiAc()" style="width:100%; padding:15px; background:#f97316; color:white; border-radius:10px; font-weight:900;">BAĞLAN</button>
        </div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri"><div id="tarih-ust"></div><div id="saat-ust"></div></div>
        <div id="ana-baslik">OSMANİYE AFAD</div>
        <div id="personelEtiket">PERSONEL: ...</div>
    </div>

    <div class="vaka-alani">
        <div class="ana-vaka-kutusu">
            <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
            <div class="durum-butonlar" id="vakaButonlar">
                <button class="btn-durum yoldayim" onclick="durumGuncelle('YOLDAYIM')">Yoldayım</button>
                <button class="btn-durum olayeri" onclick="durumGuncelle('OLAY YERİNDE')">Olay Yeri</button>
                <button class="btn-durum tamamla" onclick="gorevTamamla()">TAMAMLA</button>
            </div>
        </div>
        <button class="btn-acil" id="acilDestekBtn">🆘 ACİL DESTEK (3 SN)</button>
    </div>

    <div class="alt-panel">
        <div onclick="window.cikisYap()" style="color:#ef4444; font-weight:bold; cursor:pointer;">🚪 ÇIKIŞ</div>
        <div class="btn-mandal" id="mandalBtn">🎤</div>
        <div style="width:50px;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ARKA PLAN BİLDİRİM İZNİ
        async function bildirimIzniAl() {
            if ("Notification" in window) {
                const permission = await Notification.requestPermission();
                if (permission === "granted") console.log("Bildirim izni alındı.");
            }
        }

        // SERVICE WORKER KAYDI
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdwdXNoJywgZSA9PiB7IGNvbnN0IG9wdHMgPSB7IGJvZHk6ICdZRU5JIFZBS0EgR0VMREkhJywgaWNvbjogaHR0cHM6Ly9jZG4taWNvbnMtcG5nLmZyZWVwaWMuY29tLzUxMi85MTk1LzkxOTU5MTAucG5nLCB2aWJyYXRlOiBbMjAwLCAxMDAsIDIwMF0gfTsgZS53YWl0VW50aWwoc2VsZi5yZWdpc3RyYXRpb24uc2hvd05vdGlmaWNhdGlvbihfT1NNQU7EsFlFIEFGQURfLCBvcHRzKSk7IH0pOw==');
        }

        let currentUser = localStorage.getItem('afadUser') || "";

        window.sistemiAc = () => {
            const name = document.getElementById('userName').value.trim();
            if(name.length > 2) { 
                localStorage.setItem('afadUser', name); 
                bildirimIzniAl();
                location.reload(); 
            }
        };

        window.cikisYap = () => {
            if(confirm("Çıkış yapılsın mı?")) {
                set(ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_")), null).then(() => {
                    localStorage.clear();
                    location.reload();
                });
            }
        };

        if(currentUser) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('personelEtiket').innerText = "PERSONEL: " + currentUser.toUpperCase();
            
            const userRef = ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_"));
            onDisconnect(userRef).remove(); // Bağlantı kopunca admin panelinden sil

            // ARKA PLAN DİNLEME VE BİLDİRİM
            onValue(ref(db, 'ortakKanal'), (s) => {
                const d = s.val();
                if(d?.metin && !d.metin.includes("BEKLENİYOR")) {
                    document.getElementById('vakaMetin').innerText = d.metin;
                    document.getElementById('vakaButonlar').style.display = 'grid';
                    
                    // Ekran kapalıyken bildirim gönder
                    if (document.hidden && Notification.permission === "granted") {
                        new Notification("🚨 YENİ GÖREV!", { body: d.metin, icon: "https://cdn-icons-png.freepik.com/512/9195/9195910.png" });
                    }
                    if(navigator.vibrate) navigator.vibrate([500,200,500,200,500]);
                }
            });

            // MANDAL SİSTEMİ
            const mBtn = document.getElementById('mandalBtn');
            let mediaRecorder, audioChunks = [], stream;
            mBtn.addEventListener('touchstart', async (e) => {
                e.preventDefault();
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);
                    mediaRecorder.onstop = () => {
                        const reader = new FileReader();
                        reader.readAsDataURL(new Blob(audioChunks));
                        reader.onloadend = () => {
                            push(ref(db, 'telsizMesajlari'), { ses: reader.result, ekip: currentUser, zaman: new Date().toLocaleTimeString() });
                            document.getElementById('sesBildirim').style.display = 'block';
                            setTimeout(() => document.getElementById('sesBildirim').style.display = 'none', 1500);
                        };
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    mBtn.style.background = "#ea580c";
                } catch (err) { alert("Mikrofon izni gerekli!"); }
            });
            mBtn.addEventListener('touchend', () => { if(mediaRecorder?.state !== "inactive") mediaRecorder.stop(); mBtn.style.background = "#f97316"; });
        }

        window.durumGuncelle = (dur) => update(ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_")), { durum: dur });
        window.gorevTamamla = () => {
            document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
            document.getElementById('vakaButonlar').style.display = 'none';
            durumGuncelle("HAZIR");
        };

        setInterval(() => {
            document.getElementById('tarih-ust').innerText = new Date().toLocaleDateString('tr-TR');
            document.getElementById('saat-ust').innerText = new Date().toLocaleTimeString('tr-TR');
        }, 1000);
    </script>
</body>
</html>
