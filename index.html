<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>OSMANİYE AFAD</title>
    <style>
        /* CSS AYNI KALIYOR */
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        .ust-panel { background: #1e293b; padding: 12px; border-bottom: 4px solid #f97316; }
        #saat { font-size: 2.8rem; color: #f97316; font-weight: bold; }
        .kutu { background: #1e293b; padding: 20px; border-radius: 12px; border-left: 8px solid #f97316; width: 92%; text-align: left; box-shadow: 0 8px 25px rgba(0,0,0,0.5); margin: 15px auto; }
        #vakaMetin { font-size: 1.4rem; font-weight: bold; }
        .btn-onay { display: none; padding: 15px; background: #22c55e; color: white; border: none; border-radius: 10px; font-size: 1.3rem; width: 92%; margin: 5px auto; font-weight: bold; }
        .gecmis-item { background: #1e293b; padding: 10px; border-radius: 8px; margin: 6px auto; width: 92%; font-size: 0.8rem; border-left: 4px solid #475569; text-align: left; }
        .yapimci { position: fixed; bottom: 5px; width: 100%; font-size: 0.6rem; color: #334155; letter-spacing: 1.5px; font-weight: bold; }
        #overlay { position: fixed; inset: 0; background: #0f172a; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-baslat { padding: 18px 40px; background: #f97316; color: white; border: none; border-radius: 50px; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body id="bodyTag">

    <div id="overlay">
        <h1>OSMANİYE AFAD</h1>
        <button class="btn-baslat" id="baslatBtn">SİSTEMİ BAŞLAT</button>
        <div style="margin-top: 25px; color: #334155; font-size: 0.65rem;">YAZILIM: SEZER ÇALT</div>
    </div>

    <div class="ust-panel">
        <div id="tarih-ust">--/--/----</div>
        <div id="saat">00:00:00</div>
    </div>

    <div class="vaka-alani" style="flex-grow:1; overflow-y:auto;">
        <div class="kutu">
            <div id="vakaMetin">KOMUTA BEKLENİYOR...</div>
        </div>
        <button id="onayBtn" class="btn-onay">VAKA ALINDI ✓</button>
        <div id="gecmisListe"></div>
    </div>

    <div class="yapimci">Yazılım: Sezer ÇALT</div>
    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // SERVICE WORKER KAYDI (BİLDİRİM İÇİN)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('Arka plan motoru hazır.');
            });
        }

        // BİLDİRİM İZNİ
        if (Notification.permission !== 'granted') {
            Notification.requestPermission();
        }

        const ses = document.getElementById('vakaSes');
        const onayBtn = document.getElementById('onayBtn');
        let sonGelenMesaj = "";
        let ilkAtlama = true;

        document.getElementById('baslatBtn').onclick = () => {
            document.getElementById('overlay').style.display = 'none';
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
        };

        setInterval(() => { 
            const simdi = new Date();
            document.getElementById('saat').innerText = simdi.toLocaleTimeString('tr-TR');
            document.getElementById('tarih-ust').innerText = simdi.toLocaleDateString('tr-TR');
        }, 1000);

        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                const yeniMetin = data.metin.trim();
                const gercekVakaMi = !yeniMetin.includes("BEKLENİYOR") && yeniMetin !== "";

                if (!ilkAtlama && yeniMetin !== sonGelenMesaj && gercekVakaMi) {
                    
                    // ÜST BİLDİRİM GÖNDER
                    if (Notification.permission === 'granted') {
                        navigator.serviceWorker.ready.then(registration => {
                            registration.showNotification('YENİ AFAD VAKASI!', {
                                body: yeniMetin,
                                icon: 'https://cdn-icons-png.flaticon.com/512/564/564619.png',
                                requireInteraction: true
                            });
                        });
                    }

                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    ses.loop = true;
                    ses.play().catch(e => console.log(e));
                    onayBtn.style.display = 'block';
                    if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
                } else {
                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    if(!gercekVakaMi) onayBtn.style.display = 'none';
                }
                sonGelenMesaj = yeniMetin;
                ilkAtlama = false;
            }
        });

        onayBtn.onclick = () => {
            ses.loop = false;
            ses.pause();
            set(ref(db, 'vakaDurum'), { durum: "OK", zaman: new Date().toLocaleTimeString() });
            onayBtn.style.display = 'none';
        };
    </script>
</body>
</html>
