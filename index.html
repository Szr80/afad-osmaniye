<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <title>Osmaniye AFAD</title>
    
    <script>
        const myManifest = {
            "name": "Osmaniye AFAD",
            "short_name": "AFAD",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#f97316",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/564/564619.png","sizes": "512x512","type": "image/png","purpose": "any maskable"}]
        };
        const blob = new Blob([JSON.stringify(myManifest)], {type: 'application/json'});
        const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(blob); document.head.appendChild(link);
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; transition: background 0.4s ease; }
        
        /* ACİL DURUMDA EKRANI KIRMIZI YAPAR */
        body.acil-mod { background: #7f1d1d !important; }
        body.acil-mod .ust-panel, body.acil-mod .ana-vaka-kutusu, body.acil-mod .alt-panel { background: #450a0a !important; border-color: #ef4444 !important; }

        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 5px solid #f97316; padding-top: calc(15px + env(safe-area-inset-top)); }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 10px; color: #94a3b8; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; margin: 5px 0; }
        
        .konum-ikon-alani { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
        .canak { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; position: relative; }
        .canak::after { content: ''; position: absolute; inset: -4px; border: 2px solid #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .sistem-aktif { color: #22c55e; font-size: 0.65rem; font-weight: 900; }

        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        .ana-vaka-kutusu { background: #1e293b; padding: 25px; border-radius: 20px; border-left: 12px solid #f97316; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .vaka-var { border-left-color: #ef4444; background: #450a0a; animation: vakaFlash 1s infinite; }
        
        .gecmis-baslik { font-size: 0.8rem; font-weight: 900; color: #94a3b8; text-align: left; margin-bottom: 5px; }
        .gecmis-vaka { background: rgba(30, 41, 59, 0.6); padding: 10px; border-radius: 10px; border-left: 4px solid #f97316; text-align: left; font-size: 0.8rem; margin-bottom: 5px; }
        .gecmis-zaman { color: #f97316; font-size: 0.65rem; font-weight: bold; display: block; }

        .btn-acil { background: #dc2626; border: 5px solid #450a0a; color: white; padding: 20px; border-radius: 18px; font-weight: 900; width: 100%; margin-top: auto; box-shadow: 0 6px 0 #7f1d1d; transition: 0.2s; }
        .btn-acil:disabled { opacity: 0.8; box-shadow: none; transform: translateY(4px); }

        .alt-panel { background: #1e293b; padding: 15px; border-top: 3px solid #334155; display: flex; align-items: center; justify-content: space-between; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
        .btn-mandal { width: 80px; height: 80px; border-radius: 50%; background: #f97316; border: 8px solid #450a0a; color: white; font-size: 2rem; display: flex; align-items: center; justify-content: center; touch-action: none; margin-top: -35px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .btn-mandal.active { background: #dc2626; transform: scale(0.95); }

        #onayBox { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 15px 30px; border-radius: 50px; font-weight: 900; transition: 0.5s; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.4); white-space: nowrap; }
        #onayBox.aktif { top: 20px; }
    </style>
</head>
<body>
    <div id="onayBox">✅ MERKEZ UYARIYI GÖRDÜ</div>

    <div id="loginOverlay" style="position:fixed; inset:0; background:#0f172a; z-index:20000; display:flex; align-items:center; justify-content:center;">
        <div style="background:#1e293b; padding:35px; border-radius:25px; border:3px solid #f97316; width:85%; max-width:350px;">
            <input type="text" id="userName" placeholder="PERSONEL ADI" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:none; text-align:center; font-weight:bold; background:#0f172a; color:white;">
            <button onclick="sistemiAc()" style="width:100%; padding:15px; background:#f97316; color:white; border:none; border-radius:10px; font-weight:900;">SİSTEME BAĞLAN</button>
        </div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri"><div id="tarih-ust">...</div><div id="saat-ust">...</div></div>
        <div id="ana-baslik">Osmaniye AFAD</div>
        <div class="konum-ikon-alani">
            <div class="canak"></div>
            <span id="pAd">Giriş Yapılmadı</span> | <span class="sistem-aktif">SİSTEM ÇEVRİMİÇİ | CANLI KONUM GÖNDERİLİYOR</span>
        </div>
    </div>

    <div class="vaka-alani">
        <div class="ana-vaka-kutusu" id="vakaKutu">
            <div id="vakaMetin" style="font-weight:900; font-size:1.1rem;">GÖREV BEKLENİYOR...</div>
            <button id="tamamlaBtn" onclick="gorevTamamla()" style="display:none; width:100%; margin-top:15px; padding:10px; background:#22c55e; color:white; border:none; border-radius:8px; font-weight:900;">GÖREVİ TAMAMLA</button>
        </div>
        
        <div class="gecmis-baslik">GÖREV GEÇMİŞİ</div>
        <div id="vakaGecmisAlani"></div>
        
        <button class="btn-acil" id="acilDestekBtn">🆘 ACİL DESTEK (3 SN)</button>
    </div>

    <div class="alt-panel">
        <div onclick="window.cikisYap()" style="color:#ef4444; font-weight:900; cursor:pointer; font-size:0.75rem;">🚪 ÇIKIŞ</div>
        <div class="btn-mandal" id="mandalBtn">🎤</div>
        <div style="width:50px;"></div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentUser = localStorage.getItem('afadUser') || "";
        let vakaGecmis = JSON.parse(localStorage.getItem('vakaGecmis')) || [];
        const vakaSes = document.getElementById('vakaSes');

        window.sistemiAc = () => {
            const name = document.getElementById('userName').value.trim();
            if(name) { localStorage.setItem('afadUser', name); location.reload(); }
        };

        if(currentUser) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('pAd').innerText = currentUser.toUpperCase();
            const userKey = currentUser.replace(/\s/g, "_");
            const userRef = ref(db, 'aktifKullanicilar/' + userKey);

            onDisconnect(userRef).remove();

            // VAKA DİNLEME
            onValue(ref(db, 'ortakKanal'), (s) => {
                const d = s.val();
                if(d?.metin && !d.metin.includes("BEKLENİYOR")) {
                    document.getElementById('vakaMetin').innerText = d.metin;
                    document.getElementById('vakaKutu').classList.add('vaka-var');
                    document.getElementById('tamamlaBtn').style.display = 'block';
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    vakaSes.play().catch(()=>{});
                }
            });

            // TELSİZ MANDALI
            const mandal = document.getElementById('mandalBtn');
            let mediaRecorder, audioChunks = [];
            mandal.ontouchstart = async (e) => {
                e.preventDefault(); mandal.classList.add('active'); if(navigator.vibrate) navigator.vibrate(50);
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader(); reader.readAsDataURL(blob);
                    reader.onloadend = () => { push(ref(db, 'telsizMesajlari'), { ekip: currentUser, ses: reader.result, zaman: new Date().toLocaleTimeString('tr-TR') }); };
                    audioChunks = [];
                };
                mediaRecorder.start();
            };
            mandal.ontouchend = () => { mandal.classList.remove('active'); if(mediaRecorder) mediaRecorder.stop(); };

            // ACİL DESTEK - 3 DEFA 3 SANİYE TİTREŞİM VE KIRMIZI EKRAN
            let sosTimer;
            const sosBtn = document.getElementById('acilDestekBtn');
            const startSos = (e) => {
                e.preventDefault();
                // 3 saniye sürecek 3 defalık ritmik titreşim
                if(navigator.vibrate) navigator.vibrate([1000, 200, 1000, 200, 1000]);
                sosBtn.innerText = "SİNYAL GÖNDERİLİYOR...";
                sosTimer = setTimeout(() => {
                    update(userRef, { acilDurum: true, durum: "🆘 ACİL YARDIM!", onay: false, isim: currentUser });
                    document.body.classList.add('acil-mod');
                    sosBtn.disabled = true;
                    sosBtn.innerText = "YARDIM ÇAĞRISI ATILDI!";
                }, 3000);
            };
            const stopSos = () => { if(!sosBtn.disabled){ clearTimeout(sosTimer); if(navigator.vibrate) navigator.vibrate(0); sosBtn.innerText = "🆘 ACİL DESTEK (3 SN)"; } };
            sosBtn.addEventListener('touchstart', startSos);
            sosBtn.addEventListener('touchend', stopSos);

            // MERKEZ ONAYI DİNLEME (KIRMIZIYI KALDIRIR)
            onValue(userRef, (s) => {
                const d = s.val();
                if(d?.onay === true) {
                    const box = document.getElementById('onayBox');
                    box.classList.add('aktif');
                    document.body.classList.remove('acil-mod');
                    sosBtn.disabled = false;
                    sosBtn.innerText = "🆘 ACİL DESTEK (3 SN)";
                    setTimeout(() => { 
                        box.classList.remove('aktif'); 
                        update(userRef, { onay: null, acilDurum: false, durum: "AKTİF" });
                    }, 4000);
                }
            });

            // CANLI GPS
            navigator.geolocation.watchPosition((p) => {
                update(userRef, { lat: p.coords.latitude, lng: p.coords.longitude, timestamp: Date.now(), isim: currentUser });
            }, null, { enableHighAccuracy: true });
        }

        window.gorevTamamla = () => {
            const txt = document.getElementById('vakaMetin').innerText;
            const simdi = new Date();
            vakaGecmis.unshift({ metin: txt, tarih: simdi.toLocaleDateString('tr-TR'), saat: simdi.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}) });
            vakaGecmis = vakaGecmis.slice(0, 5);
            localStorage.setItem('vakaGecmis', JSON.stringify(vakaGecmis));
            gecmisListele();
            document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
            document.getElementById('vakaKutu').classList.remove('vaka-var');
            document.getElementById('tamamlaBtn').style.display = 'none';
        };

        function gecmisListele() {
            const alan = document.getElementById('vakaGecmisAlani');
            alan.innerHTML = "";
            vakaGecmis.forEach(v => {
                alan.innerHTML += `<div class="gecmis-vaka"><span class="gecmis-zaman">${v.tarih} | ${v.saat}</span>${v.metin}</div>`;
            });
        }
        gecmisListele();

        window.cikisYap = () => { localStorage.clear(); location.reload(); };

        setInterval(() => {
            const simdi = new Date();
            const gunler = ["PAZAR", "PAZARTESİ", "SALI", "ÇARŞAMBA", "PERŞEMBE", "CUMA", "CUMARTESİ"];
            document.getElementById('tarih-ust').innerText = simdi.toLocaleDateString('tr-TR') + " " + gunler[simdi.getDay()];
            document.getElementById('saat-ust').innerText = simdi.toLocaleTimeString('tr-TR');
        }, 1000);
    </script>
</body>
</html>
