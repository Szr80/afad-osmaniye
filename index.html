<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bas Konuş Arayüzü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ana Mobil Ekran Konteynırı */
        .app-screen {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #1e1e1e;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
        }

        /* 1. ÜST BAR: Çıkış Butonu */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            z-index: 10;
        }

        .user-tag {
            color: #aaa;
            font-size: 0.9rem;
        }

        .exit-btn {
            background: #333;
            color: #ff4d4d;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .exit-btn:hover {
            background: #ff4d4d;
            color: white;
        }

        /* 2. ANA İÇERİK (Boş alan) */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
            text-align: center;
            padding: 20px;
        }

        /* 3. ALT KONTROL PANELİ */
        .bottom-controls {
            padding: 20px;
            background: linear-gradient(to top, #121212 80%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Durum Göstergesi (Mikrofonun üstünde, bağımsız) */
        .status-container {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4caf50; /* Online rengi */
            border-radius: 50%;
            box-shadow: 0 0 8px #4caf50;
        }

        .status-text {
            color: #eee;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Bas Konuş Butonu */
        .ptt-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #007bff;
            border: 6px solid #222;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.4);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
        }

        .ptt-button:active {
            transform: scale(0.92);
            background: #0056b3;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.6);
        }

        /* SOS Alanı (En altta sabit) */
        .sos-container {
            width: 100%;
        }

        .sos-btn {
            width: 100%;
            background: #d32f2f;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #8b0000;
        }

        .sos-btn:active {
            box-shadow: 0 0 0;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <header class="header">
            <div class="user-tag">Operatör #08</div>
            <button class="exit-btn">ÇIKIŞ</button>
        </header>

        <main class="main-content">
            <p>Sistem Aktif...<br>İletişim için butona basılı tutun.</p>
        </main>

        <footer class="bottom-controls">
            
            <div class="status-container">
                <span class="status-dot"></span>
                <span class="status-text">KANAL AKTİF</span>
            </div>

            <button class="ptt-button">
                <span>BAS</span>
                <span>KONUŞ</span>
            </button>

            <div class="sos-container">
                <button class="sos-btn">SOS YARDIM</button>
            </div>
            
        </footer>
    </div>

</body>
</html>
