<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Osmaniye AFAD</title>
    <style>
        /* Senin mevcut CSS kodların - Dokunulmadı */
    </style>
</head>
<body>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Ayarların (Buraya kendi bilgilerini yapıştır)
        const firebaseConfig = { /* SENİN BİLGİLERİN */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- SİSTEM ZIRHLARI (DOKUNMA) ---

        // 1. Arka Plan Servis Kaydı (Hata buradaydı, düzeltildi)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('AFAD Motoru Hazır');
                }).catch(err => console.log('SW Hatası:', err));
            });
        }

        // 2. Ekranın Kapanmasını Engelle (Wake Lock)
        let wakeLock = null;
        async function uyanikKal() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        // 3. Kesintisiz Konum Takibi
        function konumBaslat(user) {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    update(ref(db, 'aktifKullanicilar/' + user.replace(/\s/g, "_")), {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        sonGuncelleme: serverTimestamp()
                    });
                }, null, { enableHighAccuracy: true, maximumAge: 0 });
            }
        }

        // Giriş Yapınca her şeyi aktifleştir
        window.sistemiAc = () => {
            const user = document.getElementById('adSoyad').value.trim();
            if(!user) return;
            localStorage.setItem('afadUser', user);
            
            Notification.requestPermission();
            uyanikKal();
            konumBaslat(user);
            
            // Senin mevcut ekran geçiş kodların...
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        };

        // Firebase Dinleyici (Vaka Geldiğinde)
        onValue(ref(db, 'vaka'), (s) => {
            const data = s.val();
            if(data && data.durum === "VAR") {
                // Bildirim Gönder
                if (Notification.permission === "granted") {
                    new Notification("🚨 YENİ VAKA", { body: data.metin, requireInteraction: true });
                }
                // Senin vaka sesini çalma kodların...
            }
        });
    </script>
</body>
</html>
