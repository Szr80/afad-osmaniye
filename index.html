<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AFAD VAKA">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/tr/e/ee/Afet_ve_Acil_Durum_Y%C3%B6netimi_Ba%C5%9Fanl%C4%B1%C4%9F%C4%B1_logosu.png">
    
    <title>AFAD VAKA UÇ BİRİM</title>
    <style>
        body { 
            background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; 
            text-align: center; height: 100vh; display: flex; flex-direction: column; 
            margin: 0; overflow: hidden; 
        }
        .ust-panel { background: #1e293b; padding: 20px; border-bottom: 4px solid #f97316; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        #saat { font-size: 3.8rem; color: #f97316; font-weight: bold; line-height: 1; }
        .vaka-alani { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 25px; }
        .vaka-karti { 
            background: #1e293b; width: 100%; max-width: 500px; padding: 35px; 
            border-radius: 25px; border-left: 12px solid #f97316; text-align: left;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .etiket { font-size: 0.8rem; color: #f97316; font-weight: 900; letter-spacing: 2px; margin-bottom: 15px; }
        #vakaMetin { font-size: 1.9rem; font-weight: bold; line-height: 1.3; color: #ffffff; }
        
        /* Giriş Kilidi */
        #kilit { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #0f172a; z-index: 10000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
        }
        .baslat-btn { 
            padding: 22px 50px; background: #f97316; color: white; border: none; 
            border-radius: 60px; font-size: 1.5rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.4);
        }
    </style>
</head>
<body onclick="sistemiBaslat()">

    <div id="kilit">
        <img src="https://upload.wikimedia.org/wikipedia/tr/e/ee/Afet_ve_Acil_Durum_Y%C3%B6netimi_Ba%C5%9Fanl%C4%B1%C4%9F%C4%B1_logosu.png" width="140">
        <h1 style="margin: 25px 0;">AFAD VAKA SİSTEMİ</h1>
        <button class="baslat-btn">SİSTEMİ BAŞLAT</button>
        <p style="color: #64748b; margin-top: 20px;">Uygulama Modu ve Ses İçin Dokunun</p>
    </div>

    <div class="ust-panel">
        <div id="saat">00:00:00</div>
        <div style="color: #38bdf8; font-weight: bold; margin-top: 5px;">OSMANİYE AFAD UÇ BİRİM</div>
    </div>

    <div class="vaka-alani">
        <div class="vaka-karti">
            <div class="etiket">● MERKEZDEN GELEN VAKA</div>
            <div id="vakaMetin">KOMUTA BEKLENİYOR...</div>
        </div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ses = document.getElementById('vakaSes');

        // Service Worker Kaydı (Uygulama olarak eklenmesi için ŞART)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                console.log("Servis Kayıtlı.");
            });
        }

        setInterval(() => { document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR'); }, 1000);

        window.sistemiBaslat = () => {
            document.getElementById('kilit').style.display = 'none';
            if ("Notification" in window) { Notification.requestPermission(); }
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
        };

        let ilk = true;
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                document.getElementById('vakaMetin').innerText = data.metin;
                if (!ilk && data.metin !== "KOMUTA BEKLENİYOR...") {
                    ses.play().catch(() => {});
                    if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
                }
                ilk = false;
            }
        });
    </script>
</body>
</html>
