<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AFAD Saha">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.freepik.com/512/9195/9195910.png">
    
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk9TTUFOSVlFIEFGQUQgU0FIQSIsCiAgInNob3J0X25hbWUiOiAiQUZBRCIsCiAgInN0YXJ0X3VybCI6ICIuL2luZGV4Lmh0bWwiLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwZjE3MmEiLAogICJ0aGVtZV9jb2xvciI6ICIjZjk3MzE2IiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiaHR0cHM6Ly9jZG4taWNvbnMtcG5nLmZyZWVwaWMuY29tLzUxMi85MTk1LzkxOTU5MTAucG5nIiwKICAgICAgInNpemVzIjogIjUxMng1MTIiLAogICAgICAidHlwZSI6ICJpbWFnZS9wbmciCiAgICB9CiAgXQp9">

    <title>OSMANİYE AFAD | SAHA</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 5px solid #f97316; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 10px; color: #94a3b8; font-size: 0.75rem; font-weight: 900; }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; margin: 5px 0; letter-spacing: 1px; }
        .durum-satiri { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 5px; }
        #personelEtiket { font-size: 0.8rem; color: #f1f5f9; font-weight: bold; text-transform: uppercase; }
        .sistem-aktif { color: #22c55e; font-size: 0.75rem; font-weight: 900; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        .ana-vaka-kutusu { background: #1e293b; padding: 25px; border-radius: 20px; border-left: 12px solid #f97316; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #vakaMetin { font-size: 1.3rem; font-weight: 900; line-height: 1.4; color: #ffffff; }
        .durum-butonlar { display: none; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-durum { padding: 12px; border-radius: 10px; border: none; font-weight: 900; font-size: 0.75rem; color: white; cursor: pointer; text-transform: uppercase; }
        .yoldayim { background: #3b82f6; border-bottom: 4px solid #1e40af; }
        .olayeri { background: #eab308; border-bottom: 4px solid #a16207; }
        .tamamla { background: #22c55e; border-bottom: 4px solid #166534; grid-column: span 2; margin-top: 5px; font-size: 0.9rem; }
        .gecmis-baslik { color: #64748b; font-size: 0.7rem; font-weight: 900; text-align: left; margin-left: 5px; text-transform: uppercase; margin-top: 10px; }
        #vakaGecmis { display: flex; flex-direction: column; gap: 8px; }
        .gecmis-vaka { background: rgba(30, 41, 59, 0.6); padding: 10px; border-radius: 10px; border-left: 4px solid #475569; text-align: left; font-size: 0.85rem; color: #cbd5e1; }
        .btn-acil { background: #dc2626; border: 5px solid #450a0a; color: white; padding: 20px; border-radius: 18px; font-weight: 900; width: 100%; margin-top: auto; box-shadow: 0 6px 0 #7f1d1d; }
        .alt-panel { background: #1e293b; padding: 15px; border-top: 3px solid #334155; display: flex; align-items: center; justify-content: space-between; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .btn-mandal { width: 85px; height: 85px; border-radius: 50%; background: #f97316; border: 8px solid #450a0a; color: white; font-size: 2.3rem; display: flex; align-items: center; justify-content: center; touch-action: none; }
        #sesBildirim { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(34, 197, 94, 0.95); color: white; padding: 15px 30px; border-radius: 50px; font-weight: 900; display: none; z-index: 10000; border: 2px solid #fff; }
        .destek-mod { background: #7f1d1d !important; animation: s-flash 0.5s infinite; }
        @keyframes s-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>
    <div id="sesBildirim">✅ SES İLETİLDİ</div>
    
    <div id="loginOverlay" style="position:fixed; inset:0; background:#0f172a; z-index:20000; display:flex; align-items:center; justify-content:center;">
        <div style="background:#1e293b; padding:35px; border-radius:25px; border:3px solid #f97316; width:85%; max-width:350px;">
            <h2 style="color:#f97316; margin-top:0; font-weight:900;">AFAD SAHA</h2>
            <input type="text" id="userName" placeholder="AD SOYAD" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:none; text-align:center; font-weight:bold;">
            <button onclick="sistemiAc()" style="width:100%; padding:15px; background:#f97316; color:white; border:none; border-radius:10px; font-weight:900;">GİRİŞ YAP</button>
        </div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri"><div id="tarih-ust"></div><div id="saat-ust"></div></div>
        <div id="ana-baslik">OSMANİYE AFAD</div>
        <div class="durum-satiri"><div id="personelEtiket">PERSONEL: ...</div><div class="sistem-aktif">● SİSTEM AKTİF</div></div>
    </div>

    <div class="vaka-alani">
        <div class="ana-vaka-kutusu">
            <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
            <div class="durum-butonlar" id="vakaButonlar">
                <button class="btn-durum yoldayim" onclick="durumGuncelle('YOLDAYIM')">Yoldayım</button>
                <button class="btn-durum olayeri" onclick="durumGuncelle('OLAY YERİNDE')">Olay Yeri</button>
                <button class="btn-durum tamamla" onclick="gorevTamamla()">GÖREVİ TAMAMLA</button>
            </div>
        </div>
        <div class="gecmis-baslik">Görev Geçmişi</div>
        <div id="vakaGecmis"></div>
        <button class="btn-acil" id="acilDestekBtn">🆘 ACİL DESTEK (3 SN)</button>
    </div>

    <div class="alt-panel">
        <div onclick="localStorage.clear(); location.reload();" style="color:#ef4444; font-weight:bold; font-size:0.7rem; cursor:pointer;">🚪 ÇIKIŞ</div>
        <div class="btn-mandal" id="mandalBtn">🎤</div>
        <div style="width:50px;"></div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem('afadUser') || "";
        const vakaSes = document.getElementById('vakaSes');
        let vakaListesi = JSON.parse(localStorage.getItem('vakaGecmis')) || [];
        let mediaRecorder, audioChunks = [], currentStream = null;
        let userLat = 0, userLon = 0, vakaDinleyiciBaslatildi = false;

        // PWA İÇİN EN SAĞLAM SERVICE WORKER KAYDI
        if ('serviceWorker' in navigator) {
            const swCode = "self.addEventListener('fetch', function(event) {});";
            const blob = new Blob([swCode], {type: 'text/javascript'});
            const url = URL.createObjectURL(blob);
            navigator.serviceWorker.register(url);
        }

        window.sistemiAc = async () => {
            const name = document.getElementById('userName').value.trim();
            if(name.length > 2) {
                try {
                    const check = await navigator.mediaDevices.getUserMedia({ audio: true });
                    check.getTracks().forEach(t => t.stop()); 
                    localStorage.setItem('afadUser', name);
                    location.reload();
                } catch(e) { alert("Mikrofon izni şart!"); }
            }
        };

        window.onload = () => {
            if(currentUser) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('personelEtiket').innerText = "PERSONEL: " + currentUser.toUpperCase();
                gecmisGuncelle();
                telsizHazirla();
                konumTakip();
                vakaTakibiniBaslat();
                
                const r = ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_"));
                onDisconnect(r).remove(); 
                setInterval(() => {
                    update(r, {
                        isim: currentUser, timestamp: Date.now(),
                        enlem: userLat, boylam: userLon,
                        sonSinyal: new Date().toLocaleTimeString()
                    });
                }, 3000);
            }
        };

        function vakaTakibiniBaslat() {
            if(vakaDinleyiciBaslatildi) return;
            vakaDinleyiciBaslatildi = true;
            let sonVaka = "";
            onValue(ref(db, 'ortakKanal'), (s) => {
                const d = s.val();
                if(d && d.metin && d.metin !== sonVaka) {
                    sonVaka = d.metin;
                    if(!d.metin.includes("BEKLENİYOR")) {
                        document.getElementById('vakaMetin').innerText = d.metin;
                        document.getElementById('vakaButonlar').style.display = 'grid';
                        vakaSes.loop = true; vakaSes.play();
                        setTimeout(() => { vakaSes.loop = false; vakaSes.pause(); }, 6000);
                        if(navigator.vibrate) navigator.vibrate([500,200,500]);
                    }
                }
            });
        }

        window.durumGuncelle = (dur) => {
            update(ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_")), { durum: dur });
            if(navigator.vibrate) navigator.vibrate(50);
        };

        window.gorevTamamla = () => {
            const suankiVaka = document.getElementById('vakaMetin').innerText;
            if(suankiVaka && !suankiVaka.includes("BEKLENİYOR")) {
                vakaListesi.unshift(`${new Date().toLocaleTimeString().slice(0,5)} - ${suankiVaka}`);
                if(vakaListesi.length > 5) vakaListesi.pop();
                localStorage.setItem('vakaGecmis', JSON.stringify(vakaListesi));
                gecmisGuncelle();
                document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
                document.getElementById('vakaButonlar').style.display = 'none';
                durumGuncelle("HAZIR / BOŞTA");
                vakaSes.loop = false; vakaSes.pause();
            }
        };

        function gecmisGuncelle() {
            document.getElementById('vakaGecmis').innerHTML = vakaListesi.map(v => `<div class="gecmis-vaka">${v}</div>`).join('');
        }

        function konumTakip() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((p) => {
                    userLat = p.coords.latitude; userLon = p.coords.longitude;
                }, null, { enableHighAccuracy: true });
            }
        }

        setInterval(() => {
            const d = new Date();
            document.getElementById('tarih-ust').innerText = d.toLocaleDateString('tr-TR', {weekday:'long', day:'2-digit', month:'2-digit'});
            document.getElementById('saat-ust').innerText = d.toLocaleTimeString('tr-TR');
        }, 1000);

        async function telsizHazirla() {
            const mBtn = document.getElementById('mandalBtn');
            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';

            mBtn.addEventListener('touchstart', async (e) => {
                e.preventDefault();
                try {
                    audioChunks = [];
                    currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(currentStream, { mimeType });
                    mediaRecorder.ondataavailable = (ev) => audioChunks.push(ev.data);
                    mediaRecorder.onstop = () => {
                        const reader = new FileReader();
                        reader.readAsDataURL(new Blob(audioChunks, { type: mimeType }));
                        reader.onloadend = () => {
                            push(ref(db, 'telsizMesajlari'), { ses: reader.result, ekip: currentUser, zaman: new Date().toLocaleTimeString() });
                            document.getElementById('sesBildirim').style.display = 'block';
                            setTimeout(() => document.getElementById('sesBildirim').style.display = 'none', 2000);
                        };
                        currentStream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    mBtn.style.background = "#ea580c";
                    if(navigator.vibrate) navigator.vibrate(30);
                } catch(err) { console.error(err); }
            });

            mBtn.addEventListener('touchend', () => {
                if(mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                    mBtn.style.background = "#f97316";
                }
            });
        }

        let acilZ;
        const acilBtn = document.getElementById('acilDestekBtn');
        acilBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); acilBtn.innerText = "GÖNDERİLİYOR...";
            acilZ = setTimeout(() => {
                update(ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_")), { acilDurum: true, durum: "🆘 SOS!" });
                document.body.classList.add('destek-mod'); acilBtn.innerText = "SİNYAL İLETİLDİ!";
            }, 3000);
        });
        acilBtn.addEventListener('touchend', () => { clearTimeout(acilZ); if(!document.body.classList.contains('destek-mod')) acilBtn.innerText = "🆘 ACİL DESTEK (3 SN)"; });
    </script>
</body>
</html>
