<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/tr/e/ee/Afet_ve_Acil_Durum_Y%C3%B6netimi_Ba%C5%9Fanl%C4%B1%C4%9F%C4%B1_logosu.png">
    <title>AFAD VAKA SİSTEMİ</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        .ust { background: #1e293b; padding: 20px; border-bottom: 4px solid #f97316; }
        #saat { font-size: 3.5rem; color: #f97316; font-weight: bold; }
        .vaka-alan { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .kutu { background: #1e293b; padding: 35px; border-radius: 20px; border-left: 10px solid #f97316; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.6); text-align: left; }
        #vakaMetin { font-size: 1.8rem; font-weight: bold; }
        #kilit { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn { padding: 22px 45px; background: #f97316; color: white; border: none; border-radius: 50px; font-size: 1.4rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="kilit">
        <img src="https://upload.wikimedia.org/wikipedia/tr/e/ee/Afet_ve_Acil_Durum_Y%C3%B6netimi_Ba%C5%9Fanl%C4%B1%C4%9F%C4%B1_logosu.png" width="120">
        <h2 style="margin: 25px 0;">AFAD UÇ BİRİM</h2>
        <button class="btn" id="btnBaslat">SİSTEMİ BAŞLAT</button>
        <p style="color:#64748b; margin-top:20px;">Uygulama Modu ve Ses İçin Basın</p>
    </div>

    <div class="ust"><div id="saat">00:00:00</div></div>
    <div class="vaka-alan"><div class="kutu"><div id="vakaMetin">BEKLENİYOR...</div></div></div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ses = document.getElementById('vakaSes');

        // PWA Kurulum Tetikleyici
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        document.getElementById('btnBaslat').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
            document.getElementById('kilit').style.display = 'none';
            if ("Notification" in window) { Notification.requestPermission(); }
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => console.log("SW Hazır"));
        }

        setInterval(() => { document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR'); }, 1000);

        let ilk = true;
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                document.getElementById('vakaMetin').innerText = data.metin;
                if (!ilk && data.metin !== "BEKLENİYOR...") {
                    ses.play().catch(() => {});
                }
                ilk = false;
            }
        });
    </script>
</body>
</html>
