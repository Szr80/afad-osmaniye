<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AFAD KESİNTİSİZ</title>
    
    <script>
        // SERVICE WORKER - ARKA PLANDA PUŞ BİLDİRİMİ ZORLA
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('push', e => {
                    self.registration.showNotification('🚨 AFAD ACİL', {
                        body: 'Yeni vaka geldi, hemen aç!',
                        vibrate: [500, 200, 500],
                        requireInteraction: true
                    });
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>

    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .ust { background: #1e293b; padding: 20px; border-bottom: 4px solid #f97316; text-align: center; }
        .vaka-kutu { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #vakaMetin { font-size: 1.5rem; font-weight: 900; text-align: center; color: #94a3b8; border: 2px dashed #334155; padding: 30px; border-radius: 20px; width: 100%; }
        .vaka-geldi { background: #450a0a !important; color: white !important; border: 4px solid #ef4444 !important; animation: salla 0.5s infinite; }
        @keyframes salla { 0% {transform: rotate(0)} 25% {transform: rotate(2deg)} 75% {transform: rotate(-2deg)} 100% {transform: rotate(0)} }
        .mandal { width: 120px; height: 120px; background: #f97316; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 20px auto; border: 10px solid #1e293b; touch-action: none; }
        /* Görünmez Video Alanı */
        #dummy-video { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body>

    <div class="ust">
        <h2 style="margin:0; color:#f97316;">OSMANİYE AFAD</h2>
        <small id="personelAd">BAĞLANTI BEKLENİYOR...</small>
    </div>

    <div class="vaka-kutu">
        <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
    </div>

    <video id="dummy-video" loop playsinline muted>
        <source src="https://raw.githubusercontent.com/anars/blank-audio/master/250-milliseconds-of-silence.mp3" type="audio/mp3">
    </video>

    <div class="mandal" id="mandal">🎤</div>

    <audio id="alarm" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" loop></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let isim = localStorage.getItem('afadUser');
        if(!isim) {
            isim = prompt("Lütfen Personel Adınızı Girin:");
            localStorage.setItem('afadUser', isim);
        }
        document.getElementById('personelAd').innerText = "PERSONEL: " + isim.toUpperCase();

        const vakaMetin = document.getElementById('vakaMetin');
        const alarm = document.getElementById('alarm');
        const dummyVideo = document.getElementById('dummy-video');

        // 🔥 WHATSAPP MODU: EKRANA DOKUNUNCA SİSTEMİ KİLİTLE
        window.onclick = () => {
            dummyVideo.play(); // Görünmez video başlar, Android/iOS interneti kesemez.
            alarm.play(); alarm.pause(); // Ses motorunu hazırla
            if(navigator.wakeLock) navigator.wakeLock.request('screen');
        };

        // KONUM TAKİBİ
        navigator.geolocation.watchPosition(p => {
            update(ref(db, 'aktifKullanicilar/' + isim), { lat: p.coords.latitude, lng: p.coords.longitude, ts: Date.now() });
        }, null, { enableHighAccuracy: true });

        // VAKA DİNLEME
        let sonZaman = 0;
        onValue(ref(db, 'ortakKanal'), s => {
            const d = s.val();
            if(d && d.zaman !== sonZaman && !d.metin.includes("BEKLENİYOR")) {
                vakaMetin.innerText = d.metin;
                vakaMetin.classList.add('vaka-geldi');
                alarm.play();
                if(navigator.vibrate) navigator.vibrate([500, 500, 500, 500, 500]);
                sonZaman = d.zaman;
            }
        });

        // TELSİZ
        const mandal = document.getElementById('mandal');
        let recorder;
        mandal.ontouchstart = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recorder = new MediaRecorder(stream);
            let chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => push(ref(db, 'telsizMesajlari'), { isim, ses: reader.result, ts: Date.now() });
            };
            recorder.start();
            mandal.style.background = "red";
        };
        mandal.ontouchend = () => { recorder.stop(); mandal.style.background = "#f97316"; };
    </script>
</body>
</html>
