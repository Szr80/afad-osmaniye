<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>OSMANİYE AFAD</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        
        /* ÜST PANEL YENİ DÜZEN */
        .ust-panel { background: #1e293b; padding: 15px 10px; border-bottom: 4px solid #f97316; position: relative; }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 15px; color: #94a3b8; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
        #ana-baslik { font-size: 1.6rem; color: #f97316; font-weight: 900; letter-spacing: 1px; margin: 5px 0; }
        
        .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.7rem; font-weight: bold; margin-top: 8px; color: #64748b; }
        #statusDot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }

        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 15px; gap: 12px; overflow-y: auto; }
        .kutu { background: #1e293b; padding: 20px; border-radius: 12px; border-left: 8px solid #f97316; width: 92%; text-align: left; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        #vakaMetin { font-size: 1.4rem; font-weight: bold; line-height: 1.3; margin-top: 8px; }
        #vakaSayac { font-size: 0.65rem; color: #94a3b8; }

        .btn-onay { display: none; padding: 18px; background: #22c55e; color: white; border: none; border-radius: 12px; font-size: 1.4rem; font-weight: bold; width: 92%; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); }
        
        .gecmis-panel { width: 92%; text-align: left; margin-top: 10px; border-top: 1px solid #334155; padding-top: 10px; padding-bottom: 60px; }
        .gecmis-baslik { color: #64748b; font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .gecmis-item { background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 6px; font-size: 0.8rem; border-left: 4px solid #475569; color: #cbd5e1; }
        
        .yapimci { position: fixed; bottom: 8px; width: 100%; font-size: 0.6rem; color: #334155; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; }
        
        #overlay { position: fixed; inset: 0; background: #0f172a; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-baslat { padding: 18px 40px; background: #f97316; color: white; border: none; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="letter-spacing: 2px;">OSMANİYE AFAD UÇ BİRİM SİSTEMİ</h1>
        <button class="btn-baslat" id="baslatBtn">SİSTEMİ BAŞLAT</button>
        <div style="margin-top: 25px; color: #334155; font-size: 0.65rem;">YAZILIM: SEZER ÇALT</div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri">
            <div id="tarih-ust">--/--/----</div>
            <div id="saat-ust">00:00:00</div>
        </div>
        <div id="ana-baslik">OSMANİYE AFAD UÇ BİRİM</div>
        <div class="status-bar">
            <div id="statusDot"></div>
            <span id="statusText">SİSTEM ÇEVRİMİÇİ</span>
        </div>
    </div>

    <div class="vaka-alani">
        <div class="kutu">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="color:#f97316; font-size:0.65rem; font-weight:800;">● AKTİF VAKA</div>
                <div id="vakaSayac"></div>
            </div>
            <div id="vakaMetin">KOMUTA BEKLENİYOR...</div>
        </div>

        <button id="onayBtn" class="btn-onay">VAKA ALINDI ✓</button>

        <div class="gecmis-panel">
            <div class="gecmis-baslik">Vaka Geçmişi</div>
            <div id="gecmisListe"></div>
        </div>
    </div>

    <div class="yapimci">YAZILIM: SEZER ÇALT</div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const ses = document.getElementById('vakaSes');
        const onayBtn = document.getElementById('onayBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let vakaGecmisi = [];
        let sonGelenMesaj = "";
        let ilkAtlama = true;
        let alarmSuresi;
        let vakaGelisZamani = null;
        let wakeLock = null;

        const requestWakeLock = async () => {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        document.getElementById('baslatBtn').onclick = () => {
            document.getElementById('overlay').style.display = 'none';
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
            requestWakeLock();
            if (Notification.permission !== "granted") Notification.requestPermission();
        };

        setInterval(() => {
            const simdi = new Date();
            document.getElementById('saat-ust').innerText = simdi.toLocaleTimeString('tr-TR');
            document.getElementById('tarih-ust').innerText = simdi.toLocaleDateString('tr-TR');
            if (vakaGelisZamani) {
                const fark = Math.floor((new Date() - vakaGelisZamani) / 60000);
                document.getElementById('vakaSayac').innerText = fark > 0 ? fark + " dk önce" : "Az önce";
            }
        }, 1000);

        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                const yeniMetin = data.metin.trim();
                const ekrandakiMetin = document.getElementById('vakaMetin').innerText;
                const gercekVakaMi = !yeniMetin.includes("BEKLENİYOR") && yeniMetin !== "";

                if (!ilkAtlama && yeniMetin !== sonGelenMesaj && gercekVakaMi) {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification('🚨 AFAD VAKASI!', { body: yeniMetin, requireInteraction: true });
                    });

                    if (!ekrandakiMetin.includes("BEKLENİYOR") && ekrandakiMetin !== "") {
                        vakaGecmisi.unshift({ metin: ekrandakiMetin, saat: new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}) });
                        if(vakaGecmisi.length > 5) vakaGecmisi.pop();
                        document.getElementById('gecmisListe').innerHTML = vakaGecmisi.map(v => `<div class="gecmis-item">${v.metin} <small style="float:right; color:#64748b">${v.saat}</small></div>`).join('');
                    }

                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    vakaGelisZamani = new Date();
                    ses.currentTime = 0; ses.loop = true; ses.play().catch(() => {});
                    onayBtn.style.display = 'block';
                    if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
                    clearTimeout(alarmSuresi);
                    alarmSuresi = setTimeout(() => { ses.loop = false; ses.pause(); }, 6000);
                } else if (!gercekVakaMi) {
                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    onayBtn.style.display = 'none';
                    ses.pause();
                }
                sonGelenMesaj = yeniMetin;
                ilkAtlama = false;
            }
        });

        onayBtn.onclick = () => {
            clearTimeout(alarmSuresi);
            ses.loop = false; ses.pause();
            set(ref(db, 'vakaDurum'), { durum: "OK", zaman: new Date().toLocaleTimeString() });
            onayBtn.style.display = 'none';
        };
    </script>
</body>
</html>
