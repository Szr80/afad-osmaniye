<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>AFAD VAKA UÇ BİRİM</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; height: 100vh; display: flex; flex-direction: column; margin: 0; overflow: hidden; }
        .ust-header { background: #1e293b; padding: 15px; border-bottom: 3px solid #f97316; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #saat { font-size: 3.5rem; color: #f97316; font-weight: bold; }
        .ana-icerik { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
        .vaka-karti { background: #1e293b; width: 100%; padding: 30px; border-radius: 25px; border-left: 12px solid #f97316; box-sizing: border-box; box-shadow: 0 15px 50px rgba(0,0,0,0.6); }
        #vakaIcerik { font-size: 1.8rem; color: white; font-weight: bold; text-align: left; line-height: 1.4; }
        #aktivasyon { position: fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        .btn-baslat { padding: 25px 50px; background:#f97316; color:white; border:none; border-radius:60px; font-size:1.6rem; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body onclick="sistemiBaslat()">

    <div id="aktivasyon">
        <img src="https://upload.wikimedia.org/wikipedia/tr/e/ee/Afet_ve_Acil_Durum_Y%C3%B6netimi_Ba%C5%9Fanl%C4%B1%C4%9F%C4%B1_logosu.png" width="130">
        <h1 style="margin:25px 0;">OSMANİYE AFAD</h1>
        <button class="btn-baslat">SİSTEMİ BAŞLAT</button>
        <p style="color:#94a3b8; margin-top:20px;">Sesli Uyarıyı Aktif Etmek İçin Dokunun</p>
    </div>

    <div class="ust-header">
        <div id="saat">00:00:00</div>
        <div style="color: #38bdf8; font-weight: bold; letter-spacing: 1px;">AFAD VAKA UÇ BİRİM SİSTEMİ</div>
    </div>

    <div class="ana-icerik">
        <div class="vaka-karti">
            <div style="color:#f97316; font-size:0.9rem; font-weight:800; margin-bottom:15px; letter-spacing:2px;">● MERKEZDEN GELEN VAKA</div>
            <div id="vakaIcerik">VAKA BEKLENİYOR...</div>
        </div>
    </div>

    <audio id="uyariSes" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ses = document.getElementById('uyariSes');

        setInterval(() => { document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR'); }, 1000);

        window.sistemiBaslat = () => {
            document.getElementById('aktivasyon').style.display = 'none';
            if ("Notification" in window) { Notification.requestPermission(); }
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
        };

        let ilkAtla = true;
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                document.getElementById('vakaIcerik').innerText = data.metin;
                if (!ilkAtla) {
                    ses.play().catch(e => console.log(e));
                    if (navigator.vibrate) navigator.vibrate([600, 200, 600, 200, 600]);
                }
                ilkAtla = false;
            }
        });

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
    </script>
</body>
</html>
