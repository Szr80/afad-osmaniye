// Bu kısmı index.html dosyanın en altındaki <script type="module"> kısmına, 
// Firebase initializeApp satırından hemen sonra ekle:

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('AFAD Motoru Hazır');
        }).catch(err => console.log('Hata:', err));
    });
}

let wakeLock = null;
async function ekranıUyanıkTut() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
}

function konumTakibi(user) {
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
            const path = 'aktifKullanicilar/' + user.replace(/\s/g, "_");
            update(ref(db, path), {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                sonGuncelleme: serverTimestamp()
            });
        }, null, { enableHighAccuracy: true, maximumAge: 0 });
    }
}

// Senin sistemiAc fonksiyonun içine bunları ekledim:
window.sistemiAc = () => {
    const user = document.getElementById('adSoyad').value.trim();
    if(!user) return;
    localStorage.setItem('afadUser', user);
    Notification.requestPermission();
    ekranıUyanıkTut();
    konumTakibi(user);
    
    // Senin orijinal ekran geçiş kodların...
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
};
