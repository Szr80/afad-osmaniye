<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <title>Osmaniye AFAD</title>
    
    <script>
        // PWA Manifest Ayarları
        const myManifest = {
            "name": "Osmaniye AFAD",
            "short_name": "AFAD",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#f97316",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/564/564619.png","sizes": "512x512","type": "image/png","purpose": "any"}]
        };
        const blob = new Blob([JSON.stringify(myManifest)], {type: 'application/json'});
        const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(blob); document.head.appendChild(link);

        // SERVICE WORKER - UYGULAMA KAPALIYKEN BİLE ÇALIŞAN KISIM
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                // Eğer sw.js dosyası yoksa inline olarak register et
                navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                    self.addEventListener('push', function(event) {
                        const options = {
                            body: '🚨 ACİL VAKA: Kontrol Ediniz!',
                            icon: 'https://cdn-icons-png.flaticon.com/512/564/564619.png',
                            badge: 'https://cdn-icons-png.flaticon.com/512/564/564619.png',
                            vibrate: [500, 200, 500, 200, 500],
                            data: { dateOfArrival: Date.now() },
                            actions: [{action: 'open', title: 'Uygulamayı Aç'}]
                        };
                        event.waitUntil(self.registration.showNotification('Osmaniye AFAD', options));
                    });
                `));
            });
        }
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 5px solid #f97316; padding-top: calc(15px + env(safe-area-inset-top)); }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; }
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; }
        .ana-vaka-kutusu { background: #1e293b; padding: 20px; border-radius: 20px; border-left: 12px solid #f97316; text-align: left; }
        .vaka-var { background: #450a0a; border-left-color: #ef4444; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .alt-panel { background: #1e293b; padding: 15px; border-top: 3px solid #334155; position: relative; padding-bottom: calc(45px + env(safe-area-inset-bottom)); }
        .btn-mandal { width: 85px; height: 85px; border-radius: 50%; background: #f97316; border: 8px solid #450a0a; color: white; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; margin-top: -45px; z-index: 10; touch-action: none; }
        .cikis-kapsayici { position: absolute; left: 15px; bottom: calc(25px + env(safe-area-inset-bottom)); }
        .btn-cikis-yuvarlak { width: 50px; height: 50px; border-radius: 50%; background: #1e293b; color: #ef4444; border: 2px solid #ef4444; display: flex; align-items: center; justify-content: center; }
        .sezer-imza { position: absolute; bottom: calc(5px + env(safe-area-inset-bottom)); font-size: 0.55rem; color: #475569; font-weight: bold; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <div id="loginOverlay" style="position:fixed; inset:0; background:#0f172a; z-index:20000; display:flex; align-items:center; justify-content:center;">
        <div style="background:#1e293b; padding:35px; border-radius:25px; border:3px solid #f97316; width:85%; max-width:350px;">
            <input type="text" id="userName" placeholder="PERSONEL ADI" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; text-align:center; font-weight:bold;">
            <button onclick="sistemiAc()" style="width:100%; padding:15px; background:#f97316; color:white; border:none; border-radius:10px; font-weight:900;">SİSTEME BAĞLAN</button>
        </div>
    </div>

    <div class="ust-panel">
        <div id="ana-baslik">Osmaniye AFAD</div>
        <div id="pAd" style="font-size:0.8rem; font-weight:900; color:#22c55e;">SİSTEM BAĞLI</div>
    </div>

    <div class="vaka-alani">
        <div class="ana-vaka-kutusu" id="vakaKutu">
            <div id="vakaMetin" style="font-weight:900; font-size:1.1rem;">GÖREV BEKLENİYOR...</div>
        </div>
        <button id="acilDestekBtn" style="background:#dc2626; color:white; padding:20px; border-radius:18px; font-weight:900; width:100%; margin-top:auto;">🆘 ACİL DESTEK (3 SN)</button>
    </div>

    <div class="alt-panel">
        <div class="cikis-kapsayici"><button class="btn-cikis-yuvarlak" onclick="window.cikisYap()">🚪</button></div>
        <div style="display:flex; justify-content:center;"><div class="btn-mandal" id="mandalBtn">🎤</div></div>
        <div class="sezer-imza">Sistem Yazılım & Geliştirme: Sezer ÇALT</div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto" loop></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentUser = localStorage.getItem('afadUser') || "";
        let sonVakaID = ""; 
        const vakaSes = document.getElementById('vakaSes');

        window.sistemiAc = () => {
            const name = document.getElementById('userName').value.trim();
            if(name) { 
                localStorage.setItem('afadUser', name); 
                Notification.requestPermission();
                location.reload(); 
            }
        };

        if(currentUser) {
            document.getElementById('loginOverlay').style.display = 'none';
            const userKey = currentUser.replace(/\s/g, "_");
            const userRef = ref(db, 'aktifKullanicilar/' + userKey);
            onDisconnect(userRef).remove();

            // SÜREKLİ KONUM (Arka plan için yüksek öncelik)
            navigator.geolocation.watchPosition((p) => {
                update(userRef, { lat: p.coords.latitude, lng: p.coords.longitude, timestamp: Date.now(), isim: currentUser });
            }, null, { enableHighAccuracy: true, maximumAge: 0 });

            // VAKA DİNLEME
            onValue(ref(db, 'ortakKanal'), (s) => {
                const d = s.val();
                if(d?.metin && !d.metin.includes("BEKLENİYOR") && d.zaman !== sonVakaID) {
                    // Bildirim Tetikle
                    if (Notification.permission === "granted") {
                        new Notification("🚨 AFAD ACİL VAKA", { body: d.metin, icon: 'https://cdn-icons-png.flaticon.com/512/564/564619.png' });
                    }
                    document.getElementById('vakaMetin').innerText = d.metin;
                    document.getElementById('vakaKutu').classList.add('vaka-var');
                    vakaSes.play().catch(() => {});
                    sonVakaID = d.zaman;
                }
            });

            // Bas-Konuş Sistemi
            const mandal = document.getElementById('mandalBtn');
            let mediaRecorder, chunks = [], stream;
            mandal.addEventListener('touchstart', async (e) => {
                e.preventDefault();
                mandal.style.background = "#dc2626";
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const r = new FileReader(); r.readAsDataURL(blob);
                    r.onloadend = () => push(ref(db, 'telsizMesajlari'), { ekip: currentUser, ses: r.result, zaman: Date.now() });
                    chunks = []; stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
            });
            mandal.addEventListener('touchend', () => { mandal.style.background = "#f97316"; if(mediaRecorder) mediaRecorder.stop(); });
        }

        window.cikisYap = () => { localStorage.clear(); location.reload(); };
    </script>
</body>
</html>
