<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AFAD SAHA</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            background: #0f172a; color: white; font-family: sans-serif; text-align: center; 
            height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; 
            padding-top: env(safe-area-inset-top);
        }
        
        /* GİRİŞ EKRANI - SENİN ORİJİNAL TASARIMIN */
        #loginOverlay { position:fixed; inset:0; background:#0f172a; z-index:20000; display:flex; align-items:center; justify-content:center; }
        .login-box { background:#1e293b; padding:35px; border-radius:25px; border:3px solid #f97316; width:85%; max-width:350px; }
        
        .ust-panel { background: #1e293b; padding: 12px; border-bottom: 5px solid #f97316; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 10px; color: #94a3b8; font-size: 0.7rem; font-weight: 900; }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; margin: 5px 0; }

        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        .ana-vaka-kutusu { background: #1e293b; padding: 25px; border-radius: 20px; border-left: 12px solid #f97316; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #vakaMetin { font-size: 1.3rem; font-weight: 900; color: #ffffff; }

        /* SOS BUTONU */
        .btn-acil { background: #dc2626; border: 5px solid #450a0a; color: white; padding: 20px; border-radius: 18px; font-weight: 900; width: 100%; margin-top: auto; box-shadow: 0 6px 0 #7f1d1d; }
        .destek-mod { background: #7f1d1d !important; animation: s-flash 0.5s infinite; }
        @keyframes s-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .alt-panel { background: #1e293b; padding: 15px; border-top: 3px solid #334155; display: flex; align-items: center; justify-content: space-between; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .btn-mandal { width: 85px; height: 85px; border-radius: 50%; background: #f97316; border: 8px solid #450a0a; color: white; font-size: 2.3rem; display: flex; align-items: center; justify-content: center; touch-action: none; }
        
        #bildirimKutusu { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 10px 25px; border-radius: 50px; font-weight: 900; display: none; z-index: 30000; }
    </style>
</head>
<body id="govde">
    <div id="bildirimKutusu">✅ SES İLETİLDİ</div>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color:#f97316; margin-bottom:20px; font-weight:900;">AFAD SAHA</h2>
            <input type="text" id="userName" placeholder="AD SOYAD" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:none; text-align:center; font-weight:bold; font-size:1.1rem;">
            <button onclick="sistemiAc()" style="width:100%; padding:15px; background:#f97316; color:white; border:none; border-radius:10px; font-weight:900;">GİRİŞ YAP</button>
        </div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri"><div id="tarih-ust"></div><div id="saat-ust"></div></div>
        <div id="ana-baslik">OSMANİYE AFAD</div>
        <div id="personelEtiket" style="font-size:0.7rem; font-weight:bold;"></div>
    </div>

    <div class="vaka-alani">
        <div class="ana-vaka-kutusu">
            <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
            <div id="vakaButonlar" style="display:none; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
                <button onclick="durumGuncelle('YOLDAYIM')" style="background:#3b82f6; color:white; border:none; padding:10px; border-radius:8px; font-weight:bold;">YOLDAYIM</button>
                <button onclick="durumGuncelle('OLAY YERİNDE')" style="background:#eab308; color:black; border:none; padding:10px; border-radius:8px; font-weight:bold;">OLAY YERİ</button>
                <button onclick="gorevTamamla()" style="grid-column:span 2; background:#22c55e; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; margin-top:5px;">GÖREVİ TAMAMLA</button>
            </div>
        </div>
        <button class="btn-acil" id="acilDestekBtn">🆘 ACİL DESTEK (3 SN)</button>
    </div>

    <div class="alt-panel">
        <div onclick="localStorage.clear(); location.reload();" style="color:#ef4444; font-weight:bold; font-size:0.7rem;">🚪 ÇIKIŞ</div>
        <div class="btn-mandal" id="mandalBtn">🎤</div>
        <div style="width:50px;"></div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem('afadUser') || "";
        let mediaRecorder, audioChunks = [];

        window.sistemiAc = () => {
            const name = document.getElementById('userName').value.trim();
            if(name.length > 2) { localStorage.setItem('afadUser', name); location.reload(); }
        };

        if(currentUser) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('personelEtiket').innerText = "PERSONEL: " + currentUser.toUpperCase();
            
            // SOS SİSTEMİ (3 SANİYE / 3 TİTREŞİM)
            const acilBtn = document.getElementById('acilDestekBtn');
            let sosTimer, vInterval, vCount = 0;

            acilBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                vCount = 0;
                vInterval = setInterval(() => {
                    if(navigator.vibrate) navigator.vibrate(400);
                    vCount++;
                    if(vCount >= 3) clearInterval(vInterval);
                }, 1000);

                sosTimer = setTimeout(() => {
                    update(ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_")), { acilDurum: true, durum: "🚨 YARDIM İSTİYOR" });
                    document.getElementById('govde').classList.add('destek-mod');
                }, 3000);
            });

            acilBtn.addEventListener('touchend', () => { clearTimeout(sosTimer); clearInterval(vInterval); });

            // VAKA DİNLEME
            onValue(ref(db, 'ortakKanal'), (s) => {
                const d = s.val();
                if(d?.metin && !d.metin.includes("BEKLENİYOR")) {
                    document.getElementById('vakaMetin').innerText = d.metin;
                    document.getElementById('vakaButonlar').style.display = 'grid';
                    const vSes = document.getElementById('vakaSes');
                    vSes.loop = true; vSes.play();
                    setTimeout(() => { vSes.loop = false; }, 6000);
                    if(navigator.vibrate) navigator.vibrate([500,200,500,200,500]);
                }
            });

            // TELSİZ
            const mBtn = document.getElementById('mandalBtn');
            mBtn.addEventListener('touchstart', async (e) => {
                e.preventDefault(); audioChunks = [];
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (ev) => audioChunks.push(ev.data);
                mediaRecorder.onstop = () => {
                    const r = new FileReader();
                    r.readAsDataURL(new Blob(audioChunks));
                    r.onloadend = () => {
                        push(ref(db, 'telsizMesajlari'), { ses: r.result, ekip: currentUser, zaman: new Date().toLocaleTimeString() });
                        document.getElementById('bildirimKutusu').style.display='block';
                        setTimeout(()=>document.getElementById('bildirimKutusu').style.display='none', 2000);
                    };
                };
                mediaRecorder.start(); mBtn.style.background = "#ea580c";
            });
            mBtn.addEventListener('touchend', () => { if(mediaRecorder?.state === "recording") { mediaRecorder.stop(); mBtn.style.background = "#f97316"; } });
        }

        window.durumGuncelle = (dur) => update(ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_")), { durum: dur });
        window.gorevTamamla = () => {
            document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
            document.getElementById('vakaButonlar').style.display = 'none';
            document.getElementById('vakaSes').pause();
            durumGuncelle("AKTİF");
        };

        setInterval(() => {
            document.getElementById('tarih-ust').innerText = new Date().toLocaleDateString('tr-TR', {weekday:'long', day:'2-digit', month:'2-digit'});
            document.getElementById('saat-ust').innerText = new Date().toLocaleTimeString('tr-TR');
        }, 1000);
    </script>
</body>
</html>
