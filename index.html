<div id="vakaButonlar" style="display: none; margin-top: 10px;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button onclick="durumGuncelle('YOLDA')" style="background:#334155; color:white; border:1px solid #475569; padding:12px; border-radius:12px; font-weight:900; font-size:0.8rem;">🚜 YOLDA</button>
        <button onclick="durumGuncelle('OLAY YERİ')" style="background:#334155; color:white; border:1px solid #475569; padding:12px; border-radius:12px; font-weight:900; font-size:0.8rem;">📍 OLAY YERİ</button>
        <button onclick="durumGuncelle('DÖNÜŞTE')" style="background:#334155; color:white; border:1px solid #475569; padding:12px; border-radius:12px; font-weight:900; font-size:0.8rem;">🏠 DÖNÜŞTE</button>
        <button onclick="durumGuncelle('HAZIR')" style="background:#334155; color:white; border:1px solid #475569; padding:12px; border-radius:12px; font-weight:900; font-size:0.8rem;">✅ HAZIR</button>
        
        <input type="file" id="fotoInput" accept="image/*" capture="camera" style="display: none;">
        <button onclick="document.getElementById('fotoInput').click()" style="grid-column: span 2; background:#f59e0b; color:white; border:none; padding:12px; border-radius:12px; font-weight:900; font-size:0.9rem; margin-top:5px;">📸 OLAY YERİ FOTOĞRAFI GÖNDER</button>
        
        <button onclick="gorevTamamla()" style="grid-column: span 2; background:#22c55e; color:white; border:none; padding:15px; border-radius:15px; font-weight:900; margin-top:5px;">GÖREVİ TAMAMLA VE ARŞİVLE</button>
    </div>
</div>

<script type="module">
    // ... Mevcut Firebase ve diğer kodların en altına ekle ...

    document.getElementById('fotoInput').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const base64Image = event.target.result;
            // Mevcut currentUser değişkenini kullanarak Firebase'e yazar
            const path = 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_");
            update(ref(db, path), {
                olayFoto: base64Image,
                fotoZaman: new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'})
            }).then(() => alert("Fotoğraf Merkeze İletildi!"));
        };
        // Boyutu optimize etmek için resmi oku
        reader.readAsDataURL(file);
    };

    // Görev tamamlandığında fotoğrafı temizleme (gorevTamamla fonksiyonunun içine ekle)
    const eskiGorevTamamla = window.gorevTamamla;
    window.gorevTamamla = () => {
        update(ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_")), { olayFoto: null });
        eskiGorevTamamla();
    };
</script>
