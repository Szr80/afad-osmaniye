<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>OSMANİYE AFAD</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 4px solid #f97316; }
        #saat { font-size: 3rem; color: #f97316; font-weight: bold; }
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 15px; overflow-y: auto; }
        .kutu { background: #1e293b; padding: 25px; border-radius: 15px; border-left: 8px solid #f97316; width: 90%; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #vakaMetin { font-size: 1.6rem; font-weight: bold; line-height: 1.3; }
        .btn-onay { display: none; padding: 18px; background: #22c55e; color: white; border: none; border-radius: 12px; font-size: 1.4rem; font-weight: bold; cursor: pointer; width: 90%; margin-top: 10px; }
        .gecmis-panel { width: 90%; text-align: left; margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px; }
        .gecmis-baslik { color: #64748b; font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .gecmis-item { background: #1e293b; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; font-size: 0.95rem; border-left: 4px solid #475569; color: #cbd5e1; }
        #overlay { position: fixed; inset: 0; background: #0f172a; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-baslat { padding: 20px 40px; background: #f97316; color: white; border: none; border-radius: 50px; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>OSMANİYE AFAD</h1>
        <button class="btn-baslat" id="baslatBtn">SİSTEMİ BAŞLAT</button>
    </div>

    <div class="ust-panel">
        <div id="saat">00:00:00</div>
        <div style="color:#38bdf8; font-weight:bold; font-size: 0.9rem;">UÇ BİRİM SİSTEMİ</div>
    </div>

    <div class="vaka-alani">
        <div class="kutu">
            <div style="color:#f97316; font-size:0.7rem; font-weight:800; margin-bottom:8px;">● AKTİF VAKA</div>
            <div id="vakaMetin">KOMUTA BEKLENİYOR...</div>
        </div>

        <button id="onayBtn" class="btn-onay">VAKA ALINDI ✓</button>

        <div class="gecmis-panel">
            <div class="gecmis-baslik">Son Vakalar</div>
            <div id="gecmisListe"></div>
        </div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ses = document.getElementById('vakaSes');
        const onayBtn = document.getElementById('onayBtn');
        const gecmisListe = document.getElementById('gecmisListe');

        let vakaGecmisi = [];
        let sonGelenMesaj = "";

        document.getElementById('baslatBtn').onclick = () => {
            document.getElementById('overlay').style.display = 'none';
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
        };

        setInterval(() => { document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR'); }, 1000);

        let ilkAtlama = true;
        let alarmSuresi;

        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                const yeniMetin = data.metin.trim();
                const ekrandakiMetin = document.getElementById('vakaMetin').innerText;

                // 1. ŞART: İlk açılış değilse
                // 2. ŞART: Mesaj gerçekten değişmişse
                // 3. ŞART: Mesaj "BEKLENİYOR" veya boş değilse
                const vakaVarMi = !yeniMetin.includes("BEKLENİYOR") && yeniMetin !== "";

                if (!ilkAtlama && yeniMetin !== sonGelenMesaj && vakaVarMi) {
                    
                    // Eski vaka mesajını (eğer vaka ise) geçmişe at
                    if (ekrandakiMetin !== "KOMUTA BEKLENİYOR..." && ekrandakiMetin !== "") {
                        vakaGecmisi.unshift(ekrandakiMetin);
                        if(vakaGecmisi.length > 3) vakaGecmisi.pop();
                        gecmisListe.innerHTML = vakaGecmisi.map(m => `<div class="gecmis-item">${m}</div>`).join('');
                    }

                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    
                    // Alarm Çal
                    ses.loop = true;
                    ses.play().catch(e => console.log("Ses hatası:", e));
                    onayBtn.style.display = 'block';

                    if (navigator.vibrate) navigator.vibrate([500, 200, 500]);

                    clearTimeout(alarmSuresi);
                    alarmSuresi = setTimeout(() => { ses.loop = false; ses.pause(); }, 6000);
                } else {
                    // Sadece metni güncelle, alarm çalma
                    document.getElementById('vakaMetin').innerText = yeniMetin;
                }
                
                sonGelenMesaj = yeniMetin;
                ilkAtlama = false;
            }
        });

        onayBtn.onclick = () => {
            ses.loop = false;
            ses.pause();
            ses.currentTime = 0;
            set(ref(db, 'vakaDurum'), { durum: "OK", zaman: new Date().toLocaleTimeString() });
            onayBtn.style.display = 'none';
        };
    </script>
</body>
</html>
