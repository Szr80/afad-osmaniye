<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <title>Osmaniye AFAD</title>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        /* Senin mevcut CSS kodların buraya devam edecek */
    </style>
</head>
<body>
    <div id="login-screen">...</div>
    <div id="main-app" style="display:none;">...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, serverTimestamp, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Ayarlarını buraya kendi bilgilerini yapıştır
        const firebaseConfig = { /* KENDİ BİLGİLERİN */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- ARKA PLAN VE BİLDİRİM ZIRHI ---
        
        // 1. Service Worker Kaydı
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => console.log("AFAD Hazır."));
        }

        // 2. Ekranı Uyanık Tut (Wake Lock)
        let wakeLock = null;
        async function uyanikKal() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        // 3. Kesintisiz Konum Takibi
        function konumBaslat(user) {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const path = 'aktifKullanicilar/' + user.replace(/\s/g, "_");
                    update(ref(db, path), {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        sonGuncelleme: serverTimestamp()
                    });
                }, null, { enableHighAccuracy: true, maximumAge: 0 });
            }
        }

        // 4. Kritik Bildirim Tetikleyici
        function bildirimGonder(mesaj) {
            if (Notification.permission === "granted") {
                const n = new Notification("🚨 AFAD ACİL DURUM", {
                    body: mesaj,
                    icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png",
                    requireInteraction: true,
                    vibrate: [500, 200, 500, 200, 500]
                });
                n.onclick = () => { window.focus(); n.close(); };
            }
        }

        // Giriş Butonuna Bağlı Fonksiyon (Tasarımı bozmadan yetkileri alır)
        window.sistemiAc = () => {
            const adSoyad = document.getElementById('adSoyad').value.trim();
            if(!adSoyad) return;
            
            localStorage.setItem('afadUser', adSoyad);
            Notification.requestPermission();
            uyanikKal();
            konumBaslat(adSoyad);
            
            // Buradan sonrası senin orijinal login/ekran geçiş mantığın
        };

        // Firebase Vaka Dinleyici
        onValue(ref(db, 'vaka'), (snapshot) => {
            const data = snapshot.val();
            if(data && data.durum === "VAR") {
                bildirimGonder(data.metin);
                // Senin orijinal ses çalma/titreşim kodların buraya
            }
        });

        // Diğer orijinal fonksiyonların (cikisYap, gecmisListele vs.) buraya gelecek
    </script>
</body>
</html>
