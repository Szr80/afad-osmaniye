<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>OSMANİYE AFAD</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 4px solid #f97316; position: relative; }
        #saat { font-size: 3rem; color: #f97316; font-weight: bold; }
        
        /* Bağlantı Durumu Işığı */
        .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.75rem; font-weight: bold; margin-top: 5px; }
        #statusDot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .offline #statusDot { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 15px; overflow-y: auto; }
        .kutu { background: #1e293b; padding: 25px; border-radius: 15px; border-left: 8px solid #f97316; width: 90%; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        #vakaMetin { font-size: 1.6rem; font-weight: bold; line-height: 1.3; margin-top: 10px; }
        
        /* Vaka Süresi Sayacı */
        #vakaSayac { font-size: 0.7rem; color: #94a3b8; font-weight: normal; }

        .btn-onay { display: none; padding: 18px; background: #22c55e; color: white; border: none; border-radius: 12px; font-size: 1.4rem; font-weight: bold; cursor: pointer; width: 90%; margin-top: 10px; }
        .gecmis-panel { width: 90%; text-align: left; margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px; padding-bottom: 50px; }
        .gecmis-baslik { color: #64748b; font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .gecmis-item { background: #1e293b; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; border-left: 4px solid #475569; color: #cbd5e1; display: flex; justify-content: space-between; }
        
        .yapimci { position: fixed; bottom: 8px; width: 100%; font-size: 0.65rem; color: #334155; letter-spacing: 1.5px; font-weight: bold; pointer-events: none; text-transform: uppercase; }
        
        #overlay { position: fixed; inset: 0; background: #0f172a; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-baslat { padding: 20px 40px; background: #f97316; color: white; border: none; border-radius: 50px; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body id="bodyTag">

    <div id="overlay">
        <h1 style="letter-spacing: 2px;">OSMANİYE AFAD</h1>
        <button class="btn-baslat" id="baslatBtn">SİSTEMİ BAŞLAT</button>
        <div style="margin-top: 20px; color: #334155; font-size: 0.7rem;">YAZILIM: SEZER ÇALT</div>
    </div>

    <div class="ust-panel">
        <div id="saat">00:00:00</div>
        <div class="status-bar">
            <div id="statusDot"></div>
            <span id="statusText">SİSTEM ÇEVRİMİÇİ</span>
        </div>
    </div>

    <div class="vaka-alani">
        <div class="kutu">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="color:#f97316; font-size:0.7rem; font-weight:800;">● AKTİF VAKA</div>
                <div id="vakaSayac"></div>
            </div>
            <div id="vakaMetin">KOMUTA BEKLENİYOR...</div>
        </div>

        <button id="onayBtn" class="btn-onay">VAKA ALINDI ✓</button>

        <div class="gecmis-panel">
            <div class="gecmis-baslik">Vaka Geçmişi</div>
            <div id="gecmisListe"></div>
        </div>
    </div>

    <div class="yapimci">Yazılım: Sezer ÇALT</div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ses = document.getElementById('vakaSes');
        const onayBtn = document.getElementById('onayBtn');
        const gecmisListe = document.getElementById('gecmisListe');
        const vakaSayac = document.getElementById('vakaSayac');

        let vakaGecmisi = [];
        let sonGelenMesaj = "";
        let ilkAtlama = true;
        let alarmSuresi;
        let vakaGelisZamani = null;

        document.getElementById('baslatBtn').onclick = () => {
            document.getElementById('overlay').style.display = 'none';
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
        };

        // Saat ve Bağlantı Kontrolü
        setInterval(() => { 
            document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR');
            
            // İnternet Kontrolü
            if(navigator.onLine) {
                document.getElementById('bodyTag').classList.remove('offline');
                document.getElementById('statusText').innerText = "SİSTEM ÇEVRİMİÇİ";
            } else {
                document.getElementById('bodyTag').classList.add('offline');
                document.getElementById('statusText').innerText = "BAĞLANTI KESİLDİ!";
            }

            // Vaka Süresi Güncelleme
            if (vakaGelisZamani) {
                const fark = Math.floor((new Date() - vakaGelisZamani) / 60000);
                vakaSayac.innerText = fark > 0 ? fark + " dk önce" : "Az önce";
            }
        }, 1000);

        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                const yeniMetin = data.metin.trim();
                const ekrandakiMetin = document.getElementById('vakaMetin').innerText;
                const gercekVakaMi = !yeniMetin.includes("BEKLENİYOR") && yeniMetin !== "";

                if (!ilkAtlama && yeniMetin !== sonGelenMesaj && gercekVakaMi) {
                    
                    if (!ekrandakiMetin.includes("BEKLENİYOR") && ekrandakiMetin !== "") {
                        vakaGecmisi.unshift({metin: ekrandakiMetin, saat: new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'})});
                        if(vakaGecmisi.length > 3) vakaGecmisi.pop();
                        gecmisListe.innerHTML = vakaGecmisi.map(v => `<div class="gecmis-item"><span>${v.metin}</span> <span style="color:#64748b">${v.saat}</span></div>`).join('');
                    }

                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    vakaGelisZamani = new Date(); // Süre sayacını başlat
                    
                    ses.loop = true;
                    ses.play().catch(e => console.log(e));
                    onayBtn.style.display = 'block';

                    if (navigator.vibrate) navigator.vibrate([500, 200, 500]);

                    clearTimeout(alarmSuresi);
                    alarmSuresi = setTimeout(() => { ses.loop = false; ses.pause(); }, 6000);
                } else {
                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    if (!gercekVakaMi) {
                        onayBtn.style.display = 'none';
                        vakaGelisZamani = null;
                        vakaSayac.innerText = "";
                    }
                }
                
                sonGelenMesaj = yeniMetin;
                ilkAtlama = false;
            }
        });

        onayBtn.onclick = () => {
            ses.loop = false;
            ses.pause();
            ses.currentTime = 0;
            set(ref(db, 'vakaDurum'), { durum: "OK", zaman: new Date().toLocaleTimeString() });
            onayBtn.style.display = 'none';
        };
    </script>
</body>
</html>
