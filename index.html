<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <title>Osmaniye AFAD</title>
    
    <script>
        const myManifest = {
            "name": "Osmaniye AFAD",
            "short_name": "AFAD",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#f97316",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/564/564619.png","sizes": "512x512","type": "image/png","purpose": "any maskable"}]
        };
        const blob = new Blob([JSON.stringify(myManifest)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
    </script>

    <style>
        /* TASARIM KODLARI - MİLİM DOKUNULMADI SADECE ALT BOŞLUK EKLENDİ */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f172a; color: white; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #girisEkrani { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .giris-kart { background: #1e293b; padding: 30px; border-radius: 25px; width: 100%; max-width: 400px; border: 2px solid #f97316; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; }
        .logo-alan { width: 80px; height: 80px; background: #f97316; border-radius: 20px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 0 20px rgba(249,115,22,0.4); }
        .giris-kart h2 { margin: 0 0 10px; color: #f97316; font-weight: 900; letter-spacing: -1px; }
        .giris-kart p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        .giris-kart input { width: 100%; padding: 15px; margin-bottom: 15px; background: #0f172a; border: 2px solid #334155; border-radius: 15px; color: white; font-size: 1rem; text-align: center; }
        .btn-giris { width: 100%; padding: 15px; background: #f97316; border: none; border-radius: 15px; color: white; font-weight: 900; font-size: 1rem; cursor: pointer; }

        .header { background: #1e293b; padding: env(safe-area-inset-top) 20px 15px; border-bottom: 2px solid #f97316; display: flex; justify-content: space-between; align-items: center; }
        .header-bilgi h1 { margin: 0; font-size: 1.2rem; font-weight: 900; color: #f97316; }
        #txtSaat { font-size: 1.4rem; font-weight: 900; color: #f97316; display: block; line-height: 1; }

        .vaka-kapsayici { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .vaka-kutu { background: #1e293b; border-radius: 25px; padding: 25px; border: 2px solid #334155; transition: 0.4s; position: relative; }
        .vaka-kutu.vaka-var { border-color: #ef4444; background: #450a0a; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 70% { box-shadow: 0 0 0 20px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
        
        .vaka-butonlar { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-aksiyon { padding: 15px; border: none; border-radius: 15px; font-weight: 900; font-size: 0.8rem; cursor: pointer; color: white; }
        .btn-yola { background: #3b82f6; }
        .btn-vardi { background: #eab308; }
        .btn-tamam { background: #22c55e; grid-column: span 2; }

        .telsiz-alan { display: flex; justify-content: center; padding: 10px; }
        .btn-mikrofon { width: 70px; height: 70px; background: #334155; border-radius: 50%; border: 4px solid #1e293b; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-mikrofon.kayit-var { background: #ef4444; animation: pulse 1s infinite; transform: scale(1.1); }

        /* NAVİGASYON TUŞLARI İÇİN GÜVENLİ ALT ALAN (SAFE AREA) */
        .durum-bar { 
            background: #1e293b; 
            padding: 15px 20px calc(15px + env(safe-area-inset-bottom)); /* Alt tuşlar için ekstra boşluk */
            border-top: 1px solid #334155; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 10px; 
        }
        .sos-btn { width: 50px; height: 50px; background: #ef4444; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: none; color: white; cursor: pointer; }
        .cikis-btn { width: 50px; height: 50px; background: #334155; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: none; color: white; cursor: pointer; }
        
        #acilEkran { position: fixed; inset: 0; background: #ef4444; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" preload="auto"></audio>

    <div id="girisEkrani">
        <div class="giris-kart">
            <div class="logo-alan">A</div>
            <h2>OSMANİYE AFAD</h2>
            <p>Saha Personel Girişi</p>
            <input type="text" id="ekipKod" placeholder="Ekip İsmi (Örn: AFAD-01)" autocomplete="off">
            <button class="btn-giris" onclick="girisYap()">SİSTEME BAĞLAN</button>
        </div>
    </div>

    <div id="acilEkran">
        <h2 style="font-size: 3rem; font-weight: 900;">SOS</h2>
        <p>ACİL DURUM SİNYALİ GÖNDERİLDİ</p>
    </div>

    <div class="header">
        <div class="header-bilgi">
            <h1>AFAD SAHA</h1>
            <span id="txtEkipAd">...</span>
        </div>
        <div class="saat-kutu">
            <span id="txtSaat">00:00</span>
        </div>
    </div>

    <div class="vaka-kapsayici">
        <div class="vaka-kutu" id="vakaKutu">
            <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
            <div class="vaka-butonlar" id="vakaButonlar">
                <button class="btn-aksiyon btn-yola" onclick="durumGuncelle('VAKAYA GİDİYOR')">YOLA ÇIKTIK</button>
                <button class="btn-aksiyon btn-vardi" onclick="durumGuncelle('OLAY YERİNDE')">VAKAYA VARDIK</button>
                <button class="btn-aksiyon btn-tamam" onclick="vakaKapat()">VAKAYI TAMAMLA</button>
            </div>
        </div>

        <div class="telsiz-alan">
            <button class="btn-mikrofon" id="btnMikrofon">🎤</button>
        </div>

        <div id="vakaGecmisAlani"></div>
    </div>

    <div class="durum-bar">
        <div id="txtEkipDurum" style="font-weight: 900; color: #22c55e;">HAZIR / BEKLEMEDE</div>
        <div style="display:flex; gap:10px;">
            <button class="cikis-btn" onclick="cikisYap()" title="Güvenli Çıkış">🚪</button>
            <button class="sos-btn" onclick="sosTetikle()">🆘</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, onDisconnect, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/", storageBucket: "ana-uygulama-f22cb.appspot.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        let ekipID = localStorage.getItem('ekipID');

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGU9Pnt9KTs=');
        async function bildirimIzni() { if ("Notification" in window) await Notification.requestPermission(); }

        window.girisYap = () => {
            const kod = document.getElementById('ekipKod').value.trim().toUpperCase();
            if(kod) { localStorage.setItem('ekipID', kod); bildirimIzni(); location.reload(); }
        };

        if(ekipID) {
            document.getElementById('girisEkrani').style.display = 'none';
            document.getElementById('txtEkipAd').innerText = ekipID;
            
            const userRef = ref(db, 'aktifKullanicilar/' + ekipID);
            navigator.geolocation.watchPosition(pos => {
                update(userRef, { lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: Date.now(), isim: ekipID });
            }, null, { enableHighAccuracy: true });
            onDisconnect(userRef).remove();

            let ilkYukleme = true;
            onValue(ref(db, 'ortakKanal'), (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    const txt = data.metin;
                    document.getElementById('vakaMetin').innerText = txt;
                    if(!txt.includes("GÖREV BEKLENİYOR")) {
                        document.getElementById('vakaKutu').classList.add('vaka-var');
                        document.getElementById('vakaButonlar').style.display = 'grid';
                        
                        const audio = document.getElementById('vakaSes');
                        audio.play().catch(() => {});
                        setTimeout(() => { audio.pause(); audio.currentTime = 0; }, 6000);

                        if (!ilkYukleme && document.visibilityState !== 'visible') {
                            new Notification("🚨 YENİ GÖREV!", { body: txt });
                        }
                    } else {
                        document.getElementById('vakaKutu').classList.remove('vaka-var');
                        document.getElementById('vakaButonlar').style.display = 'none';
                    }
                }
                ilkYukleme = false;
            });

            // TELSİZ
            let mediaRecorder;
            let audioChunks = [];
            const btnMikrofon = document.getElementById('btnMikrofon');

            btnMikrofon.addEventListener('touchstart', async (e) => {
                e.preventDefault();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const fileRef = sRef(storage, `telsiz/${Date.now()}.webm`);
                    await uploadBytes(fileRef, audioBlob);
                    const url = await getDownloadURL(fileRef);
                    push(ref(db, 'telsizMesajlari'), { ekip: ekipID, ses: url, zaman: new Date().toLocaleTimeString() });
                    audioChunks = [];
                };
                mediaRecorder.start();
                btnMikrofon.classList.add('kayit-var');
            });

            btnMikrofon.addEventListener('touchend', () => { if(mediaRecorder) mediaRecorder.stop(); btnMikrofon.classList.remove('kayit-var'); });
        }

        window.durumGuncelle = (durum) => {
            update(ref(db, 'aktifKullanicilar/' + ekipID), { durum: durum });
            document.getElementById('txtEkipDurum').innerText = durum;
        };

        window.sosTetikle = () => {
            update(ref(db, 'aktifKullanicilar/' + ekipID), { acilDurum: true, durum: "🆘 SOS!" });
            document.getElementById('acilEkran').style.display = 'flex';
        };

        window.vakaKapat = () => {
            document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
            document.getElementById('vakaKutu').classList.remove('vaka-var');
            document.getElementById('vakaButonlar').style.display = 'none';
            durumGuncelle('HAZIR / BEKLEMEDE');
        };

        window.cikisYap = () => {
            if(confirm("Sistemden çıkış yapmak istiyor musunuz?")) {
                localStorage.removeItem('ekipID');
                location.reload();
            }
        };

        setInterval(() => {
            document.getElementById('txtSaat').innerText = new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'});
        }, 1000);
    </script>
</body>
</html>
