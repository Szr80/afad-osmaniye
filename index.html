<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AFAD | SAHA EKİP SİSTEMİ</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ÜST BAR */
        .ust-bar { background: #1e293b; padding: 15px; text-align: center; border-bottom: 3px solid #f97316; font-weight: 900; letter-spacing: 1px; }
        
        .ana-alan { flex-grow: 1; padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }

        /* VAKA KARTI */
        .vaka-kart { background: #1e293b; padding: 20px; border-radius: 15px; border-left: 8px solid #f97316; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #vakaMetin { font-size: 1.3rem; font-weight: bold; color: #f1f5f9; line-height: 1.4; display: block; margin-bottom: 10px; }

        /* DURUM BUTONLARI */
        .durum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 18px; border: none; border-radius: 12px; font-weight: 900; color: white; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; }
        .btn-yol { background: #3b82f6; }
        .btn-olay { background: #eab308; color: #000; }
        .btn-aktif { background: #22c55e; grid-column: span 2; }
        .btn-sos { background: #dc2626; grid-column: span 2; padding: 20px; font-size: 1.2rem; }

        /* TELSİZ ALANI */
        .telsiz-alt { background: #1e293b; padding: 20px; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px; border-top: 2px solid #334155; align-items: center; }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; background: #f97316; border: 6px solid #334155; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
        .mic-btn.active { background: #dc2626; transform: scale(0.95); box-shadow: 0 0 30px #dc2626; }
    </style>
</head>
<body>

    <div class="ust-bar" id="ekipBaslik">OSMANİYE AFAD SİSTEMİ</div>

    <div class="ana-alan">
        <div class="vaka-kart">
            <small style="color: #f97316; font-weight: bold;">MERKEZDEN GELEN EMİR:</small>
            <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
            <div id="vakaZaman" style="font-size: 0.7rem; color: #94a3b8;">--:--</div>
        </div>

        <div class="durum-grid">
            <button class="btn btn-yol" onclick="durumGuncelle('YOLDAYIM')">YOLDAYIM</button>
            <button class="btn btn-olay" onclick="durumGuncelle('OLAY YERİNDE')">OLAY YERİNDE</button>
            <button class="btn btn-aktif" onclick="durumGuncelle('AKTİF')">GÖREV TAMAMLANDI</button>
            <button class="btn btn-sos" onclick="acilDurumGonder()">🆘 SOS</button>
        </div>
    </div>

    <div class="telsiz-alt">
        <div style="font-weight:bold; color:#94a3b8; font-size:0.8rem;">BAS-KONUŞ</div>
        <button class="mic-btn" id="micBtn">🎤</button>
    </div>

    <audio id="vakaSes" src="https://www.soundjay.com/buttons/beep-07.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem('afad_isim') || prompt("EKİP İSMİ GİRİN:");
        if(currentUser) localStorage.setItem('afad_isim', currentUser);
        document.getElementById('ekipBaslik').innerText = currentUser.toUpperCase();

        const userKey = currentUser.replace(/\s/g, "_");
        let lat = 0, lon = 0;

        navigator.geolocation.watchPosition(p => {
            lat = p.coords.latitude;
            lon = p.coords.longitude;
        }, null, { enableHighAccuracy: true });

        window.durumGuncelle = (d) => {
            update(ref(db, 'aktifKullanicilar/' + userKey), { durum: d, acilDurum: false });
        };

        window.acilDurumGonder = () => {
            update(ref(db, 'aktifKullanicilar/' + userKey), { acilDurum: true, durum: "🆘 SOS!" });
        };

        let sonVaka = "";
        onValue(ref(db, 'ortakKanal'), (s) => {
            const v = s.val();
            if(v && v.metin !== sonVaka) {
                document.getElementById('vakaMetin').innerText = v.metin;
                document.getElementById('vakaZaman').innerText = v.zaman;
                if(sonVaka !== "") {
                    if ("vibrate" in navigator) navigator.vibrate([500, 200, 500]);
                    const audio = document.getElementById('vakaSes');
                    audio.play();
                    setTimeout(() => { audio.pause(); audio.currentTime = 0; }, 6000);
                }
                sonVaka = v.metin;
            }
        });

        // 3 SANİYEDE BİR SİNYAL (Admin 5sn içinde silmesi için)
        setInterval(() => {
            update(ref(db, 'aktifKullanicilar/' + userKey), {
                isim: currentUser,
                timestamp: Date.now(),
                enlem: lat,
                boylam: lon,
                sonSinyal: new Date().toLocaleTimeString('tr-TR')
            });
        }, 3000);

        // TELSİZ
        let mediaRecorder;
        const micBtn = document.getElementById('micBtn');

        micBtn.onpointerdown = async (e) => {
            e.preventDefault();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                let chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        push(ref(db, 'telsizMesajlari'), {
                            ekip: currentUser,
                            ses: reader.result,
                            zaman: new Date().toLocaleTimeString()
                        });
                    };
                };
                mediaRecorder.start();
                micBtn.classList.add('active');
            } catch(e) { alert("Mikrofon izni gerekli!"); }
        };

        micBtn.onpointerup = () => {
            if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
            micBtn.classList.remove('active');
        };
    </script>
</body>
</html>
