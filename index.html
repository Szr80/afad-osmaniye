<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
    <title>OSMANİYE AFAD UÇ BİRİM</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; transition: 0.5s; }
        
        /* ÜST PANEL */
        .ust-panel { background: #1e293b; padding: 15px 10px; border-bottom: 4px solid #f97316; position: relative; z-index: 10; }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 15px; color: #94a3b8; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        #ana-baslik { font-size: 1.6rem; color: #f97316; font-weight: 900; letter-spacing: 1px; margin: 5px 0; }
        
        .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.7rem; font-weight: bold; margin-top: 8px; color: #64748b; }
        #statusDot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }

        /* VAKA ALANI */
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 15px; gap: 12px; overflow-y: auto; }
        .kutu { background: #1e293b; padding: 20px; border-radius: 12px; border-left: 8px solid #f97316; width: 92%; text-align: left; box-shadow: 0 8px 25px rgba(0,0,0,0.5); transition: 0.3s; box-sizing: border-box; }
        #vakaMetin { font-size: 1.4rem; font-weight: bold; line-height: 1.3; margin-top: 8px; }

        /* KRİTİK VAKA FLAŞÖR EFEKTİ */
        .kritik-mod { background: #450a0a !important; animation: acil-flash 1.2s infinite; }
        @keyframes acil-flash { 0% {background: #0f172a;} 50% {background: #7f1d1d;} 100% {background: #0f172a;} }

        /* GERİ BİLDİRİM BUTONLARI */
        .btn-grup { display: none; flex-direction: column; gap: 10px; width: 92%; margin-top: 5px; }
        .btn { padding: 16px; border-radius: 12px; border: none; font-weight: bold; color: white; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn-mavi { background: #0284c7; }
        .btn-sari { background: #eab308; color: black; }
        .btn-mor { background: #4f46e5; }
        .btn-yesil { background: #22c55e; }
        
        .yapimci { position: fixed; bottom: 8px; width: 100%; font-size: 0.6rem; color: #334155; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; }
        
        #overlay { position: fixed; inset: 0; background: #0f172a; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-baslat { padding: 18px 40px; background: #f97316; color: white; border: none; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body id="anaGövde">

    <div id="overlay">
        <h1 style="letter-spacing: 2px;">OSMANİYE AFAD</h1>
        <button class="btn-baslat" onclick="sistemiBaslat()">SİSTEMİ BAŞLAT</button>
        <div style="margin-top: 25px; color: #334155; font-size: 0.65rem;">YAZILIM: SEZER ÇALT</div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri">
            <div id="tarih-ust">--/--/---- -------</div>
            <div id="saat-ust">00:00:00</div>
        </div>
        <div id="ana-baslik">OSMANİYE AFAD UÇ BİRİM</div>
        <div class="status-bar"><div id="statusDot"></div><span id="statusText">SİSTEM ÇEVRİMİÇİ</span></div>
    </div>

    <div class="vaka-alani">
        <div class="kutu" id="vakaKutusu">
            <div id="vakaDurumEtiket" style="color:#f97316; font-size:0.65rem; font-weight:800;">● KOMUTA BEKLENİYOR</div>
            <div id="vakaMetin">SİSTEM AKTİF, VAKA BEKLENİYOR...</div>
        </div>

        <div id="islemButonlari" class="btn-grup">
            <button class="btn btn-mavi" onclick="durumGuncelle('YOLDAYIZ', '#0284c7')">✚ EKİP YOLDAYIZ</button>
            <button class="btn btn-sari" onclick="durumGuncelle('OLAY YERİNE VARILDI', '#eab308')">📍 OLAY YERİNE VARILDI</button>
            <button class="btn btn-mor" onclick="durumGuncelle('DÖNÜŞE GEÇİLDİ', '#4f46e5')">🔄 DÖNÜŞE GEÇİLDİ</button>
            <button class="btn btn-yesil" onclick="durumGuncelle('GÖREV TAMAMLANDI', '#22c55e', true)">✓ GÖREV TAMAMLANDI</button>
        </div>
    </div>

    <div class="yapimci">YAZILIM: SEZER ÇALT</div>
    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const ses = document.getElementById('vakaSes');
        const anaGövde = document.getElementById('anaGövde');
        let alarmZamanlayici;
        let wakeLock = null;

        // EKRANI AÇIK TUTMA (WAKE LOCK)
        const requestWakeLock = async () => {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        };

        window.sistemiBaslat = () => {
            document.getElementById('overlay').style.display = 'none';
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
            requestWakeLock();
            if (Notification.permission !== "granted") Notification.requestPermission();
        };

        // SAAT VE GÜNLÜ TARİH GÜNCELLEME
        setInterval(() => {
            const simdi = new Date();
            document.getElementById('saat-ust').innerText = simdi.toLocaleTimeString('tr-TR');
            const tarihSecenekleri = { day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'long' };
            document.getElementById('tarih-ust').innerText = simdi.toLocaleDateString('tr-TR', tarihSecenekleri);
        }, 1000);

        // DURUM GÜNCELLEME (ADMİNE BİLGİ GÖNDERİR)
        window.durumGuncelle = (mesaj, renk, bitis = false) => {
            set(ref(db, 'ekipDurum'), { durum: mesaj, renk: renk, zaman: new Date().toLocaleTimeString('tr-TR') });
            if(bitis) {
                document.getElementById('islemButonlari').style.display = 'none';
                anaGövde.classList.remove('kritik-mod');
                clearTimeout(alarmZamanlayici);
                ses.pause(); ses.loop = false;
                document.getElementById('vakaDurumEtiket').innerText = "● GÖREV TAMAMLANDI";
            }
        };

        // VAKA DİNLEME VE ALARM MEKANİZMASI
        let sonGelenMesaj = "";
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                const yeniMetin = data.metin.trim();
                const gercekVakaMi = !yeniMetin.includes("BEKLENİYOR") && yeniMetin !== "";

                if (gercekVakaMi && yeniMetin !== sonGelenMesaj) {
                    // Alarmı Başlat ve 6 Saniyeye Ayarla
                    ses.currentTime = 0; ses.loop = true; ses.play().catch(() => {});
                    clearTimeout(alarmZamanlayici);
                    alarmZamanlayici = setTimeout(() => {
                        ses.loop = false;
                        ses.pause();
                    }, 6000);

                    // Arayüzü Güncelle
                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    document.getElementById('islemButonlari').style.display = 'flex';
                    document.getElementById('vakaDurumEtiket').innerText = "● AKTİF VAKA";

                    // Kritik Flaşör Kontrolü
                    if(data.oncelik === 'kritik') anaGövde.classList.add('kritik-mod');
                    else anaGövde.classList.remove('kritik-mod');

                    if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
                } else if (!gercekVakaMi) {
                    // Vaka Silindiğinde veya Bekleme Modunda
                    document.getElementById('vakaMetin').innerText = yeniMetin;
                    document.getElementById('islemButonlari').style.display = 'none';
                    anaGövde.classList.remove('kritik-mod');
                    clearTimeout(alarmZamanlayici);
                    ses.pause();
                    document.getElementById('vakaDurumEtiket').innerText = "● KOMUTA BEKLENİYOR";
                }
                sonGelenMesaj = yeniMetin;
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });
    </script>
</body>
</html>
