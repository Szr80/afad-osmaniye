<!-- Head kısmında manifest linkinin ./ olduğundan emin ol -->
<link rel="manifest" href="./manifest.json">

<script type="module">
    // 1. SERVİS KAYDI
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                console.log('AFAD Motoru Hazır');
            });
        });
    }

    // 2. EKRAN VE ARKA PLAN ZIRHI (Wake Lock)
    let wakeLock = null;
    const uyanikKal = async () => {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) { console.log("WakeLock aktif edilemedi"); }
    };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') uyanikKal(); });

    // 3. HEM ÖN PLAN HEM ARKA PLAN BİLDİRİM FONKSİYONU
    function vakaBildirimiGonder(mesaj) {
        if (!("Notification" in window)) return;

        if (Notification.permission === "granted") {
            // Tarayıcılar uygulama açıkken bazen bildirim göstermez, bu zorla gösterir:
            new Notification("🚨 YENİ VAKA: AFAD", {
                body: mesaj,
                icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png",
                requireInteraction: true,
                vibrate: [500, 200, 500]
            });
        }
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, update, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    // Firebase Config (Eksiksiz apiKey, projectId vs. eklediğinden emin ol!)
    const firebaseConfig = { 
        databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // ... senin mevcut değişkenlerin ...

    // VAKA TAKİBİ (Burayı güncelledim)
    if(currentUser) {
        onValue(ref(db, 'ortakKanal'), (s) => {
            const d = s.val();
            if(d?.metin && !d.metin.includes("BEKLENİYOR") && d.zaman !== sonVakaID) {
                // Bildirimi her koşulda tetikle:
                vakaBildirimiGonder(d.metin);

                // Senin orijinal UI işlemlerin (ses, kutu rengi vs.)
                document.getElementById('vakaMetin').innerText = d.metin;
                document.getElementById('vakaKutu').classList.add('vaka-var');
                document.getElementById('vakaButonlar').style.display = 'grid';
                vakaSes.loop = true; vakaSes.play().catch(()=>{});
                setTimeout(() => { vakaSes.loop = false; vakaSes.pause(); }, 6000);
                if(navigator.vibrate) navigator.vibrate([300, 200, 300, 200, 300]);
                sonVakaID = d.zaman;
            }
        });
    }

    // Sistemi Aç fonksiyonuna yetki almayı ekledim:
    window.sistemiAc = () => {
        const name = document.getElementById('userName').value.trim();
        if(name) { 
            localStorage.setItem('afadUser', name); 
            Notification.requestPermission(); // İZİN İSTE
            uyanikKal(); // EKRANI KİLİTLE
            location.reload(); 
        }
    };
    
    // ... senin diğer fonksiyonların aynen devam eder ...
</script>
