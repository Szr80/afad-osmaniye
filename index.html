<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>OSMANİYE AFAD | SAHA</title>
    <style>
        /* ANA TASARIM */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            background: #0f172a; color: white; font-family: sans-serif; 
            text-align: center; height: 100vh; margin: 0; 
            display: flex; flex-direction: column; overflow: hidden; 
        }
        
        /* ÜST BİLDİRİM PANELİ (YENİ/GERİ GELDİ) */
        #ustBildirimPanel {
            position: fixed; top: -100px; left: 0; width: 100%;
            background: #f97316; color: white; padding: 20px;
            font-weight: 900; font-size: 1.1rem; z-index: 50000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: 0.5s ease-in-out; border-bottom: 4px solid #fff;
        }
        #ustBildirimPanel.aktif { top: 0; }

        .ust-panel { 
            background: #1e293b; padding: 15px; 
            border-bottom: 5px solid #f97316; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 10px; color: #94a3b8; font-size: 0.75rem; font-weight: 900; }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; margin: 5px 0; letter-spacing: 1px; }
        
        .durum-satiri { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 5px; }
        #personelEtiket { font-size: 0.8rem; color: #f1f5f9; font-weight: bold; text-transform: uppercase; }
        .sistem-aktif { color: #22c55e; font-size: 0.75rem; font-weight: 900; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        .ana-vaka-kutusu { 
            background: #1e293b; padding: 25px; border-radius: 20px; 
            border-left: 12px solid #f97316; text-align: left; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-height: 110px; display: flex; align-items: center;
        }
        #vakaMetin { font-size: 1.3rem; font-weight: 900; line-height: 1.4; color: #ffffff; width: 100%; }

        .gecmis-baslik { color: #64748b; font-size: 0.7rem; font-weight: 900; text-align: left; margin-left: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        #vakaGecmis { display: flex; flex-direction: column; gap: 8px; }
        .gecmis-vaka { 
            background: rgba(30, 41, 59, 0.6); padding: 10px; border-radius: 10px; 
            border-left: 4px solid #475569; text-align: left; font-size: 0.85rem; color: #cbd5e1;
        }

        #sesBildirim {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(34, 197, 94, 0.95); color: white; padding: 15px 30px;
            border-radius: 50px; font-weight: 900; font-size: 1rem; z-index: 10000;
            display: none; border: 2px solid #ffffff;
        }

        .btn-acil { 
            background: #dc2626; border: 5px solid #450a0a; color: white; 
            padding: 20px; border-radius: 18px; font-weight: 900; 
            width: 100%; cursor: pointer; touch-action: none; font-size: 1.1rem;
            box-shadow: 0 6px 0 #7f1d1d; transition: 0.1s; margin-top: auto;
        }

        .alt-panel { 
            background: #1e293b; padding: 15px; border-top: 3px solid #334155; 
            display: flex; align-items: center; justify-content: space-between;
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); 
        }
        
        .btn-mandal { 
            width: 85px; height: 85px; border-radius: 50%; background: #f97316; 
            border: 8px solid #450a0a; color: white; font-size: 2.3rem; 
            display: flex; align-items: center; justify-content: center; touch-action: none;
        }

        .btn-cikis-yeni { 
            display: flex; flex-direction: column; align-items: center; 
            background: #0f172a; border: 2px solid #ef4444; padding: 8px;
            border-radius: 12px; min-width: 65px; cursor: pointer;
        }
        .btn-cikis-yeni span { color: #ef4444; font-weight: 900; font-size: 0.6rem; margin-top: 2px; }
        .btn-cikis-yeni i { font-size: 1.3rem; font-style: normal; }
        .bosluk { width: 65px; }

        .destek-mod { background: #7f1d1d !important; animation: s-flash 0.5s infinite; }
        @keyframes s-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>

    <div id="ustBildirimPanel">⚠️ YENİ VAKA GELDİ!</div>
    <div id="sesBildirim">✅ SES İLETİLDİ</div>

    <div id="loginOverlay" style="position:fixed; inset:0; background:#0f172a; z-index:20000; display:flex; align-items:center; justify-content:center;">
        <div style="background:#1e293b; padding:35px; border-radius:25px; border:3px solid #f97316; width:85%; max-width:350px;">
            <h2 style="color:#f97316; margin-top:0; font-weight:900;">AFAD SAHA</h2>
            <input type="text" id="userName" placeholder="AD SOYAD" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:none; text-align:center; font-weight:bold;">
            <button onclick="sistemiAc()" style="width:100%; padding:15px; background:#f97316; color:white; border:none; border-radius:10px; font-weight:900;">GİRİŞ YAP</button>
        </div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri">
            <div id="tarih-ust">--/--/---- ---</div>
            <div id="saat-ust">00:00:00</div>
        </div>
        <div id="ana-baslik">OSMANİYE AFAD</div>
        <div class="durum-satiri">
            <div id="personelEtiket">PERSONEL: ...</div>
            <div class="sistem-aktif">● SİSTEM AKTİF</div>
        </div>
    </div>

    <div class="vaka-alani">
        <div class="ana-vaka-kutusu">
            <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
        </div>
        <div class="gecmis-baslik">Gelen Son Vakalar</div>
        <div id="vakaGecmis"></div>
        <button class="btn-acil" id="acilDestekBtn">🆘 ACİL DESTEK (3 SN)</button>
    </div>

    <div class="alt-panel">
        <div class="btn-cikis-yeni" onclick="guvenliCikis()">
            <i>🚪</i><span>ÇIKIŞ</span>
        </div>
        <div class="btn-mandal" id="mandalBtn">🎤</div>
        <div class="bosluk"></div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem('afadUser') || "";
        const vakaSes = document.getElementById('vakaSes');
        const ustPanel = document.getElementById('ustBildirimPanel');
        let vakaListesi = [];
        let mediaRecorder, audioChunks = [];

        window.sistemiAc = async () => {
            const name = document.getElementById('userName').value.trim();
            if(name.length > 2) { 
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    localStorage.setItem('afadUser', name);
                    location.reload();
                } catch(e) { alert("Mikrofon izni gerekli!"); }
            }
        };

        window.onload = () => {
            if(currentUser) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('personelEtiket').innerText = "PERSONEL: " + currentUser.toUpperCase();
                aktifKaydet();
                telsizHazirla();
            }
        };

        window.guvenliCikis = () => { if(confirm("Çıkış yapılsın mı?")) { localStorage.removeItem('afadUser'); location.reload(); } };

        const aktifKaydet = () => {
            const r = ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_"));
            set(r, { isim: currentUser, giris: new Date().toLocaleTimeString() });
            onDisconnect(r).remove();
        };

        // ZAMAN
        setInterval(() => {
            const d = new Date();
            const tarihSecenekleri = { day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'long' };
            document.getElementById('tarih-ust').innerText = d.toLocaleDateString('tr-TR', tarihSecenekleri);
            document.getElementById('saat-ust').innerText = d.toLocaleTimeString('tr-TR');
        }, 1000);

        // VAKA ALARMI (6 SANİYE + ÜST PANEL)
        function vakaAlarmiBaslat(metin) {
            // Üst Bildirim Panelini Göster
            ustPanel.innerText = "⚠️ YENİ VAKA: " + metin;
            ustPanel.classList.add('aktif');
            
            // Sesi Başlat ve 6 Saniye Döngüye Sok
            vakaSes.currentTime = 0;
            vakaSes.loop = true;
            vakaSes.play().catch(() => {});
            
            if(navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);

            // 6 Saniye Sonra Durdur
            setTimeout(() => {
                vakaSes.loop = false;
                vakaSes.pause();
                ustPanel.classList.remove('aktif');
            }, 6000);
        }

        // TELSİZ
        async function telsizHazirla() {
            const mandal = document.getElementById('mandalBtn');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(audioChunks));
                    reader.onloadend = () => {
                        push(ref(db, 'telsizMesajlari'), { ses: reader.result, ekip: currentUser, zaman: new Date().toLocaleTimeString() });
                    };
                    audioChunks = [];
                    const sb = document.getElementById('sesBildirim');
                    sb.style.display = 'block';
                    setTimeout(() => sb.style.display = 'none', 2000);
                };
                mandal.addEventListener('touchstart', (e) => { e.preventDefault(); if(mediaRecorder.state === "inactive") { audioChunks = []; mediaRecorder.start(); } });
                mandal.addEventListener('touchend', () => { if(mediaRecorder.state === "recording") mediaRecorder.stop(); });
            } catch (err) {}
        }

        // VAKA TAKİP
        onValue(ref(db, 'ortakKanal'), (s) => {
            const d = s.val();
            if(d && d.metin) {
                const anaMetin = document.getElementById('vakaMetin');
                if(anaMetin.innerText !== d.metin) {
                    if(!anaMetin.innerText.includes("BEKLENİYOR") && !anaMetin.innerText.includes("✅")) {
                        vakaListesi.unshift(anaMetin.innerText);
                        if(vakaListesi.length > 5) vakaListesi.pop();
                        document.getElementById('vakaGecmis').innerHTML = vakaListesi.map(v => `<div class="gecmis-vaka">${v}</div>`).join('');
                    }
                    anaMetin.innerText = d.metin;
                    if(!d.metin.includes("BEKLENİYOR")) {
                        vakaAlarmiBaslat(d.metin);
                    }
                }
            }
        });

        // SOS SİSTEMİ
        let acilZaman;
        const acilBtn = document.getElementById('acilDestekBtn');
        acilBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            acilBtn.innerText = "GÖNDERİLİYOR...";
            acilZaman = setTimeout(() => {
                set(ref(db, 'ekipDurum'), { acil: true, isim: currentUser, zaman: new Date().toLocaleTimeString() });
                document.body.classList.add('destek-mod');
                acilBtn.innerText = "SİNYAL İLETİLDİ!";
            }, 3000);
        });
        acilBtn.addEventListener('touchend', () => {
            clearTimeout(acilZaman);
            if(!document.body.classList.contains('destek-mod')) acilBtn.innerText = "🆘 ACİL DESTEK (3 SN)";
        });

        onValue(ref(db, 'ekipDurum'), (s) => {
            const d = s.val();
            if(d && d.acil === false) document.body.classList.remove('destek-mod');
        });
    </script>
</body>
</html>
