<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSMANİYE AFAD | SAHA</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; touch-action: manipulation; }
        body { background: #0f172a; color: white; margin: 0; padding: 15px; text-align: center; overflow-x: hidden; }
        
        .header { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-bottom: 4px solid #f97316; }
        #vakaMetin { font-size: 1.2rem; font-weight: bold; color: #f8fafc; margin: 10px 0; min-height: 50px; }

        .durum-paneli { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-durum { padding: 15px; border: none; border-radius: 10px; font-weight: 900; color: white; cursor: pointer; }
        .yol { background: #3b82f6; } 
        .olay { background: #eab308; }
        .bitti { background: #22c55e; grid-column: span 2; }

        .telsiz-alan { margin: 20px 0; position: relative; }
        #telsizBtn { 
            width: 200px; height: 200px; border-radius: 50%; border: 12px solid #334155;
            background: radial-gradient(#ef4444, #991b1b); color: white;
            font-weight: 900; font-size: 1.3rem; cursor: pointer;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4); transition: 0.1s;
            -webkit-user-select: none; user-select: none;
        }
        #telsizBtn:active { transform: scale(0.92); border-color: #f97316; box-shadow: 0 0 50px #f97316; }

        /* Acil Durum Uyarı Görseli */
        .acil-mod { background: #450a0a !important; animation: pulse-bg 1s infinite !important; }
        @keyframes pulse-bg { 0% { background: #0f172a; } 50% { background: #7f1d1d; } 100% { background: #0f172a; } }

        #altBilgi { font-size: 0.8rem; color: #64748b; margin-top: 30px; border-top: 1px solid #1e293b; padding-top: 10px; }
    </style>
</head>
<body id="anaGövde">

    <div class="header">
        <small style="color: #f97316; font-weight: bold;">GÜNCEL GÖREV</small>
        <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
    </div>

    <div id="vakaButonlar" class="durum-paneli">
        <button class="btn-durum yol" onclick="durumGuncelle('YOLDAYIM')">YOLDAYIM</button>
        <button class="btn-durum olay" onclick="durumGuncelle('OLAY YERİNDE')">OLAY YERİNDE</button>
        <button class="btn-durum bitti" onclick="gorevTamamla()">GÖREV BİTTİ</button>
    </div>

    <div class="telsiz-alan">
        <button id="telsizBtn">BAS KONUŞ<br><small style="font-size:0.6rem; opacity:0.7;">(YARDIM İÇİN 3sn BAS)</small></button>
        <p id="telsizDurum" style="margin-top:15px; font-weight:bold; color:#94a3b8;">Telsiz Hazır</p>
    </div>

    <div id="altBilgi">
        <span id="kullaniciAdi">...</span> | <span id="sinyalZamani">--:--</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem('afadIsim') || prompt("İsim Soyisim:");
        if(currentUser) localStorage.setItem('afadIsim', currentUser);
        document.getElementById('kullaniciAdi').innerText = currentUser;
        const userKey = currentUser.replace(/\s/g, "_");

        const vakaSes = new Audio('https://top-snms.com/alarm.mp3');
        let mediaRecorder, audioChunks = [];
        let acilTimer, baslamaZamani, yardimAktif = false;

        // 1. VAKA VE ALARM TAKİBİ
        onValue(ref(db, 'ortakKanal'), (s) => {
            const v = s.val();
            if (v && v.metin !== "GÖREV BEKLENİYOR...") {
                document.getElementById('vakaMetin').innerText = v.metin;
                document.getElementById('vakaButonlar').style.display = "grid";
                vakaSes.loop = true; vakaSes.play();
                setTimeout(() => { vakaSes.pause(); vakaSes.loop = false; }, 6000);
                if(navigator.vibrate) navigator.vibrate([500, 200, 500]);
            } else {
                document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
                document.getElementById('vakaButonlar').style.display = "none";
            }
        });

        // 2. TELSİZ VE ACİL DESTEK (3 SANİYE KURALI)
        const btn = document.getElementById('telsizBtn');
        
        btn.onpointerdown = async (e) => {
            e.preventDefault();
            baslamaZamani = Date.now();
            
            // Acil durum sayacı
            acilTimer = setInterval(() => {
                let sure = Date.now() - baslamaZamani;
                if (sure >= 3000 && !yardimAktif) {
                    yardimAktif = true;
                    if(navigator.vibrate) navigator.vibrate(200);
                    update(ref(db, 'aktifKullanicilar/' + userKey), { durum: "YARDIM İSTİYOR", acilDurum: true });
                    document.getElementById('anaGövde').classList.add('acil-mod');
                    document.getElementById('telsizDurum').innerText = "🆘 YARDIM SİNYALİ GÖNDERİLDİ!";
                    document.getElementById('telsizDurum').style.color = "#ef4444";
                } else if (yardimAktif) {
                    if(navigator.vibrate) navigator.vibrate(100); // Her sn titret
                }
            }, 1000);

            // Telsiz Kaydı Başlat
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = x => audioChunks.push(x.data);
                mediaRecorder.start();
                if(!yardimAktif) document.getElementById('telsizDurum').innerText = "🎤 KAYDEDİLİYOR...";
            } catch (err) { console.log("Mikrofon hatası"); }
        };

        btn.onpointerup = () => {
            clearInterval(acilTimer);
            let toplamSure = Date.now() - baslamaZamani;

            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                if (toplamSure < 3000) {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const r = new FileReader();
                        r.readAsDataURL(blob);
                        r.onloadend = () => {
                            push(ref(db, 'telsizMesajlari'), { ekip: currentUser, ses: r.result, zaman: new Date().toLocaleTimeString() });
                        };
                        document.getElementById('telsizDurum').innerText = "✅ MESAJ GÖNDERİLDİ";
                    };
                }
            }
        };

        // 3. ADMİN ONAYINI DİNLE (NORMALE DÖNÜŞ)
        onValue(ref(db, 'aktifKullanicilar/' + userKey + '/acilDurum'), (s) => {
            if (s.val() === false && yardimAktif) {
                yardimAktif = false;
                document.getElementById('anaGövde').classList.remove('acil-mod');
                document.getElementById('telsizDurum').innerText = "✅ YARDIM ALINDI - NORMAL";
                document.getElementById('telsizDurum').style.color = "#94a3b8";
                if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
            }
        });

        // 4. KONUM VE DURUM GÜNCELLEME
        window.durumGuncelle = (d) => {
            update(ref(db, 'aktifKullanicilar/' + userKey), { durum: d, sonSinyal: new Date().toLocaleTimeString() });
        };

        window.gorevTamamla = () => {
            vakaSes.pause(); durumGuncelle("AKTİF");
        };

        function konumSinyali() {
            navigator.geolocation.getCurrentPosition(p => {
                update(ref(db, 'aktifKullanicilar/' + userKey), {
                    isim: currentUser, enlem: p.coords.latitude, boylam: p.coords.longitude,
                    timestamp: Date.now(), sonSinyal: new Date().toLocaleTimeString()
                });
                document.getElementById('sinyalZamani').innerText = new Date().toLocaleTimeString();
            }, null, { enableHighAccuracy: true });
        }
        setInterval(konumSinyali, 10000); konumSinyali();
    </script>
</body>
</html>
