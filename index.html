<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <title>Osmaniye AFAD</title>
    
    <style>
        /* Senin mevcut CSS kodların buraya gelecek - Değişiklik yok */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        /* ... diğer stiller ... */
    </style>
</head>
<body>
    <div id="login-screen">...</div>
    <div id="main-app" style="display:none;">...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase yapılandırman (Mevcut olanı kullan)
        const firebaseConfig = { /* SENİN BİLGİLERİN */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- YENİ EKLENEN ARKA PLAN VE BİLDİRİM ZIRHI ---
        
        // 1. Service Worker Kaydı
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                console.log("AFAD Servisi Aktif");
            });
        }

        // 2. Ekranı Her Koşulda Açık Tut (Wake Lock)
        let wakeLock = null;
        async function ekranıUyanıkTut() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log("WakeLock Hatası"); }
        }
        document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') ekranıUyanıkTut(); });

        // 3. Kesintisiz Konum Takibi
        function konumTakibiBaslat(user) {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    update(ref(db, 'aktifKullanicilar/' + user.replace(/\s/g, "_")), {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        sonGuncelleme: serverTimestamp()
                    });
                }, null, { enableHighAccuracy: true, maximumAge: 0 });
            }
        }

        // 4. Kritik Bildirim Fonksiyonu
        function vakaBildirimiYap(mesaj) {
            if (Notification.permission === "granted") {
                const n = new Notification("🚨 YENİ VAKA: AFAD", {
                    body: mesaj,
                    icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png",
                    requireInteraction: true, // Kullanıcı kapatana kadar ekranda kalır
                    vibrate: [500, 200, 500, 200, 500]
                });
                n.onclick = () => { window.focus(); n.close(); };
            }
        }

        // Giriş yapıldığında zırhları devreye sok
        window.sistemiAc = () => {
            const user = document.getElementById('adSoyad').value.trim();
            if(!user) return;
            localStorage.setItem('afadUser', user);
            ekranıUyanıkTut();
            konumTakibiBaslat(user);
            Notification.requestPermission();
            // Mevcut login mantığın...
        };

        // Firebase Dinleyici (Vaka Geldiğinde)
        onValue(ref(db, 'vaka'), (s) => {
            const d = s.val();
            if(d && d.durum === "VAR") {
                vakaBildirimiYap(d.metin);
                // Senin mevcut ses ve titreşim kodların buraya gelecek
            }
        });
        
        // --- DİĞER MEVCUT FONKSİYONLARIN (DOKUNULMADI) ---
    </script>
</body>
</html>
