<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <title>Osmaniye AFAD</title>
    
    <script>
        // PWA Manifest
        const myManifest = {
            "name": "Osmaniye AFAD",
            "short_name": "AFAD",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#f97316",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/564/564619.png","sizes": "512x512","type": "image/png","purpose": "any maskable"}]
        };
        const blob = new Blob([JSON.stringify(myManifest)], {type: 'application/json'});
        const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(blob); document.head.appendChild(link);

        // Service Worker: Arka Plan Bildirimi İçin Zorunlu
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                self.addEventListener('push', function(event) {
                    const options = { 
                        body: 'ACİL VAKA GELDİ!', 
                        icon: 'https://cdn-icons-png.flaticon.com/512/564/564619.png',
                        vibrate: [500, 200, 500],
                        requireInteraction: true 
                    };
                    event.waitUntil(self.registration.showNotification('Osmaniye AFAD', options));
                });
            `));
        }
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; transition: background 0.4s ease; }
        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 5px solid #f97316; padding-top: calc(15px + env(safe-area-inset-top)); }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 10px; color: #94a3b8; font-size: 0.75rem; font-weight: 900; }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; margin: 5px 0; }
        .konum-ikon-alani { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .canak { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; position: relative; }
        .canak::after { content: ''; position: absolute; inset: -4px; border: 2px solid #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        .ana-vaka-kutusu { background: #1e293b; padding: 20px; border-radius: 20px; border-left: 12px solid #f97316; text-align: left; }
        .vaka-var { background: #450a0a; border-left-color: #ef4444; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .durum-butonlar { display: none; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-durum { padding: 12px; border-radius: 10px; border: none; font-weight: 900; color: white; }
        .btn-yolda { background: #3b82f6; } .btn-tamam { background: #22c55e; }
        .alt-panel { background: #1e293b; padding: 15px; border-top: 3px solid #334155; position: relative; padding-bottom: calc(45px + env(safe-area-inset-bottom)); }
        .btn-mandal { width: 85px; height: 85px; border-radius: 50%; background: #f97316; border: 8px solid #450a0a; color: white; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; margin-top: -45px; z-index: 10; }
        .cikis-kapsayici { position: absolute; left: 15px; bottom: calc(25px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; }
        .btn-cikis-yuvarlak { width: 50px; height: 50px; border-radius: 50%; background: #1e293b; color: #ef4444; border: 2px solid #ef4444; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .sezer-imza { position: absolute; bottom: calc(5px + env(safe-area-inset-bottom)); font-size: 0.55rem; color: #475569; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loginOverlay" style="position:fixed; inset:0; background:#0f172a; z-index:20000; display:flex; align-items:center; justify-content:center;">
        <div style="background:#1e293b; padding:35px; border-radius:25px; border:3px solid #f97316; width:85%; max-width:350px;">
            <input type="text" id="userName" placeholder="PERSONEL ADI" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; text-align:center; font-weight:bold;">
            <button onclick="sistemiAc()" style="width:100%; padding:15px; background:#f97316; color:white; border:none; border-radius:10px; font-weight:900;">SİSTEME BAĞLAN</button>
        </div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri"><div id="tarih-ust">...</div><div id="saat-ust">...</div></div>
        <div id="ana-baslik">Osmaniye AFAD</div>
        <div class="konum-ikon-alani">
            <div class="canak"></div>
            <span id="pAd">...</span> | <span style="color:#22c55e; font-size:0.6rem; font-weight:900;">CANLI TAKİP AKTİF</span>
        </div>
    </div>

    <div class="vaka-alani">
        <div class="ana-vaka-kutusu" id="vakaKutu">
            <div id="vakaMetin" style="font-weight:900; font-size:1.1rem;">GÖREV BEKLENİYOR...</div>
            <div class="durum-butonlar" id="vakaButonlar">
                <button class="btn-durum btn-yolda" onclick="durumGuncelle('YOLDAYIM')">YOLDAYIM</button>
                <button class="btn-durum btn-tamam" onclick="vakaKapat()">TAMAMLANDI</button>
            </div>
        </div>
        <button id="acilDestekBtn" style="background:#dc2626; color:white; padding:20px; border-radius:18px; font-weight:900; width:100%; margin-top:auto;">🆘 ACİL DESTEK (3 SN)</button>
    </div>

    <div class="alt-panel">
        <div class="cikis-kapsayici"><button class="btn-cikis-yuvarlak" onclick="window.cikisYap()">🚪</button></div>
        <div style="display:flex; justify-content:center;"><div class="btn-mandal" id="mandalBtn">🎤</div></div>
        <div class="sezer-imza">Sistem Yazılım & Geliştirme: Sezer ÇALT</div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentUser = localStorage.getItem('afadUser') || "";
        let sonVakaID = ""; 
        const vakaSes = document.getElementById('vakaSes');

        // BİLDİRİM VE UYANIK TUTMA
        if ("Notification" in window) Notification.requestPermission();
        let wakeLock = null;
        const stayAwake = async () => { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} };
        stayAwake();
        document.addEventListener('visibilitychange', () => { if (wakeLock !== null && document.visibilityState === 'visible') stayAwake(); });

        window.sistemiAc = () => {
            const name = document.getElementById('userName').value.trim();
            if(name) { localStorage.setItem('afadUser', name); location.reload(); }
        };

        if(currentUser) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('pAd').innerText = currentUser.toUpperCase();
            const userKey = currentUser.replace(/\s/g, "_");
            const userRef = ref(db, 'aktifKullanicilar/' + userKey);
            onDisconnect(userRef).remove();

            // SÜREKLİ KONUM TAKİBİ (ARKA PLAN İÇİN)
            navigator.geolocation.watchPosition((p) => {
                update(userRef, { 
                    lat: p.coords.latitude, 
                    lng: p.coords.longitude, 
                    timestamp: Date.now(), 
                    isim: currentUser,
                    durum: "AKTİF"
                });
            }, (err) => console.log(err), { 
                enableHighAccuracy: true, 
                timeout: 5000, 
                maximumAge: 0 
            });

            // VAKA DİNLEME
            onValue(ref(db, 'ortakKanal'), (s) => {
                const d = s.val();
                if(d?.metin && !d.metin.includes("BEKLENİYOR") && d.zaman !== sonVakaID) {
                    if (document.hidden) {
                        new Notification("🚨 AFAD: YENİ GÖREV!", { body: d.metin, icon: 'https://cdn-icons-png.flaticon.com/512/564/564619.png', tag: 'vaka' });
                    }
                    document.getElementById('vakaMetin').innerText = d.metin;
                    document.getElementById('vakaKutu').classList.add('vaka-var');
                    document.getElementById('vakaButonlar').style.display = 'grid';
                    vakaSes.loop = true; vakaSes.play();
                    setTimeout(() => { vakaSes.loop = false; vakaSes.pause(); }, 6000);
                    sonVakaID = d.zaman;
                }
            });

            // BAS-KONUŞ (MİKROFON)
            const mandal = document.getElementById('mandalBtn');
            let mediaRecorder, chunks = [], stream;
            mandal.ontouchstart = async (e) => {
                e.preventDefault();
                mandal.style.background = "#dc2626";
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const r = new FileReader(); r.readAsDataURL(blob);
                    r.onloadend = () => { push(ref(db, 'telsizMesajlari'), { ekip: currentUser, ses: r.result, zaman: Date.now() }); };
                    chunks = []; stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
            };
            mandal.ontouchend = () => { mandal.style.background = "#f97316"; if(mediaRecorder) mediaRecorder.stop(); };
        }

        window.durumGuncelle = (durum) => { update(ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_")), { durum: durum }); };
        window.vakaKapat = () => {
            vakaSes.pause();
            document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
            document.getElementById('vakaKutu').classList.remove('vaka-var');
            document.getElementById('vakaButonlar').style.display = 'none';
            durumGuncelle('HAZIR');
        };
        window.cikisYap = () => { localStorage.clear(); location.reload(); };
        setInterval(() => {
            document.getElementById('tarih-ust').innerText = new Date().toLocaleDateString('tr-TR');
            document.getElementById('saat-ust').innerText = new Date().toLocaleTimeString('tr-TR');
        }, 1000);
    </script>
</body>
</html>
