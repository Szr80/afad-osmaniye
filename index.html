<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSMANİYE AFAD | SAHA</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        
        /* GİRİŞ EKRANI */
        #loginOverlay { position: fixed; inset: 0; background: #0f172a; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: #1e293b; padding: 30px 20px; border-radius: 20px; border: 2px solid #f97316; width: 85%; max-width: 350px; }
        .login-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 1rem; text-align: center; box-sizing: border-box; }
        
        /* ANA PANEL VE DİĞERLERİ */
        .ust-panel { background: #1e293b; padding: 10px; border-bottom: 5px solid #f97316; }
        .vaka-alani { flex-grow: 1; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .kutu { background: #1e293b; padding: 15px; border-radius: 15px; border-left: 8px solid #f97316; text-align: left; }
        .btn { padding: 15px; border-radius: 12px; border: none; font-weight: 900; color: white; text-transform: uppercase; cursor: pointer; width: 100%; margin-bottom: 5px; }
        .btn-acil { background: #dc2626; border: 4px solid #450a0a; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }
        .destek-mod { background: #7f1d1d !important; animation: acil-flash 0.5s infinite !important; }
        @keyframes acil-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .mandal-bolumu { background: #1e293b; padding: 10px; border-top: 1px solid #334155; display: flex; align-items: center; justify-content: space-around; }
        .btn-mandal { width: 60px; height: 60px; border-radius: 50%; background: #f97316; border: none; color: white; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h3 style="color:#f97316; margin-top:0;">PERSONEL GİRİŞİ</h3>
            <input type="text" id="userName" class="login-input" placeholder="Adınız Soyadınız">
            <input type="password" id="pinInput" class="login-input" placeholder="PIN Kodu (1234)">
            <button class="btn" style="background:#f97316; margin-top:10px;" onclick="sistemiAc()">GİRİŞ YAP</button>
        </div>
    </div>

    <div class="ust-panel">
        <div id="ana-baslik" style="font-weight:900; color:#f97316;">OSMANİYE AFAD</div>
        <div id="personelEtiket" style="font-size:0.75rem; color:#22c55e;">OTURUM AÇILMADI</div>
    </div>

    <div class="vaka-alani">
        <div class="kutu">
            <div id="vakaDurumEtiket" style="color:#f97316; font-size:0.7rem; font-weight:900;">● BEKLEMEDE</div>
            <div id="vakaMetin" style="font-weight:bold; font-size:1.1rem;">GÖREV BEKLENİYOR...</div>
        </div>

        <button class="btn btn-acil" id="acilDestekBtn">🆘 ACİL DESTEK (3 SN BASIN)</button>

        <div id="islemButonlari" style="display:none; flex-direction:column; gap:5px;">
            <button class="btn" style="background:#0284c7" onclick="durumGuncelle('YOLDAYIZ','#0284c7')">YOLDAYIZ</button>
            <button class="btn" style="background:#eab308; color:black;" onclick="durumGuncelle('VARILDI','#eab308')">VARILDI</button>
            <button class="btn" style="background:#22c55e" onclick="durumGuncelle('TAMAMLANDI','#22c55e', true)">TAMAMLANDI</button>
        </div>
        <div id="gecmisListe"></div>
    </div>

    <div class="mandal-bolumu">
        <div style="font-size:0.6rem; color:#94a3b8; font-weight:bold;">TELSİZ</div>
        <div class="btn-mandal" id="mandalBtn">🎤</div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = "";
        const ses = document.getElementById('vakaSes');

        window.sistemiAc = () => {
            const name = document.getElementById('userName').value.trim();
            const pin = document.getElementById('pinInput').value;
            
            if(name.length > 2 && pin === "1234") {
                currentUser = name;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('personelEtiket').innerText = "PERSONEL: " + currentUser.toUpperCase();
                
                // Aktif kullanıcıyı kaydet ve çıkınca sil
                const userRef = ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_"));
                set(userRef, { isim: currentUser, giris: new Date().toLocaleTimeString() });
                onDisconnect(userRef).remove();

                ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
            } else {
                alert("Lütfen isminizi girin ve PIN'i doğrulayın!");
            }
        };

        // ACİL DESTEK (İsimli Gönderim)
        let acilZamanlayici;
        const acilBtn = document.getElementById('acilDestekBtn');
        acilBtn.addEventListener('pointerdown', () => {
            acilZamanlayici = setTimeout(() => {
                set(ref(db, 'ekipDurum'), { 
                    durum: "!!! ACİL DESTEK !!!", 
                    isim: currentUser, // Butona basan kişinin ismi
                    renk: "#ff0000", 
                    zaman: new Date().toLocaleTimeString(), 
                    acil: true 
                });
                document.body.classList.add('destek-mod');
                if(navigator.vibrate) navigator.vibrate([100, 50, 500]);
            }, 3000);
        });
        acilBtn.addEventListener('pointerup', () => clearTimeout(acilZamanlayici));

        // DURUM GÜNCELLEME
        window.durumGuncelle = (durum, renk, bitis = false) => {
            set(ref(db, 'ekipDurum'), { durum, isim: currentUser, renk, zaman: new Date().toLocaleTimeString(), acil: false });
            if(bitis) {
                document.getElementById('islemButonlari').style.display = 'none';
                document.body.classList.remove('destek-mod');
            }
        };

        // VAKA DİNLEME (Aynı mantık korunuyor)
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if(data && !data.metin.includes("BEKLENİYOR")) {
                document.getElementById('vakaMetin').innerText = data.metin;
                document.getElementById('islemButonlari').style.display = 'flex';
                ses.play();
            }
        });

        // ADMIN ACİL DURUMU KAPATIRSA
        onValue(ref(db, 'ekipDurum'), (snapshot) => {
            const data = snapshot.val();
            if(data && data.acil === false) document.body.classList.remove('destek-mod');
        });
    </script>
</body>
</html>
