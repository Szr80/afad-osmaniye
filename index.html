<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>OSMANİYE AFAD | SAHA TERMİNALİ</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; transition: 0.5s; }
        
        /* GİRİŞ EKRANI */
        #loginOverlay { position: fixed; inset: 0; background: #0f172a; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 20px; border: 2px solid #f97316; width: 85%; max-width: 350px; box-shadow: 0 0 30px rgba(249, 115, 22, 0.2); }
        .login-input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 1rem; text-align: center; box-sizing: border-box; }
        
        /* ANA PANEL */
        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 5px solid #f97316; }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 10px; color: #94a3b8; font-size: 0.8rem; font-weight: bold; }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; margin: 5px 0; }
        
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        .kutu { background: #1e293b; padding: 20px; border-radius: 15px; border-left: 10px solid #f97316; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        #vakaMetin { font-size: 1.3rem; font-weight: bold; line-height: 1.3; margin-top: 8px; }
        
        /* ACİL DESTEK (SOS) */
        .btn-acil { background: #dc2626; border: 4px solid #450a0a; animation: pulse 1.5s infinite; color: white; padding: 18px; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; touch-action: none; -webkit-user-select: none; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }
        .destek-mod { background: #7f1d1d !important; animation: acil-flash 0.5s infinite !important; }
        @keyframes acil-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* TELSİZ MANDALI */
        .mandal-bolumu { background: #1e293b; padding: 15px; border-top: 2px solid #334155; display: flex; align-items: center; justify-content: space-around; }
        .btn-mandal { width: 75px; height: 75px; border-radius: 50%; background: #f97316; border: 6px solid #450a0a; color: white; font-size: 2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; touch-action: none; }
        .btn-mandal:active { background: #dc2626; transform: scale(0.9); }

        /* BUTONLAR */
        .btn-grup { display: none; flex-direction: column; gap: 10px; width: 100%; }
        .btn { padding: 16px; border-radius: 12px; border: none; font-weight: 900; color: white; font-size: 1.1rem; text-transform: uppercase; cursor: pointer; }
        
        .gecmis-item { background: rgba(30, 41, 59, 0.5); padding: 12px; border-radius: 10px; border-left: 4px solid #475569; text-align: left; font-size: 0.85rem; }
        .kritik-mod { background: #450a0a !important; animation: flash 1.2s infinite; }
        @keyframes flash { 0%, 100% {background: #0f172a;} 50% {background: #7f1d1d;} }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color:#f97316; margin:0;">AFAD PERSONEL</h2>
            <p style="font-size:0.8rem; color:#94a3b8; margin:10px 0;">İSİM VE PIN GİRİNİZ</p>
            <input type="text" id="userName" class="login-input" placeholder="Adınız Soyadınız">
            <input type="password" id="pinInput" class="login-input" placeholder="****" maxlength="4" inputmode="numeric">
            <button class="btn" style="background:#f97316; width:100%;" onclick="sistemiAc()">OTURUM AÇ</button>
        </div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri">
            <div id="tarih-ust">--/--/---- -------</div>
            <div id="saat-ust">00:00:00</div>
        </div>
        <div id="ana-baslik">OSMANİYE AFAD UÇ BİRİM</div>
        <div id="personelEtiket" style="font-size:0.75rem; color:#22c55e; font-weight:bold;">BAĞLANTI BEKLENİYOR...</div>
    </div>

    <div class="vaka-alani">
        <div class="kutu" id="vakaKutusu">
            <div id="vakaDurumEtiket" style="color:#f97316; font-size:0.75rem; font-weight:900;">● SİSTEM AKTİF</div>
            <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
        </div>

        <button class="btn-acil" id="acilDestekBtn">🆘 ACİL DESTEK (3 SN BASIN)</button>

        <div id="islemButonlari" class="btn-grup">
            <button class="btn" style="background:#0284c7" onclick="durumGuncelle('YOLDAYIZ','#0284c7')">✚ YOLDAYIZ</button>
            <button class="btn" style="background:#eab308; color:black;" onclick="durumGuncelle('VARILDI','#eab308')">📍 VARILDI</button>
            <button class="btn" style="background:#22c55e" onclick="durumGuncelle('TAMAMLANDI','#22c55e', true)">✓ TAMAMLANDI</button>
        </div>

        <div id="gecmisListe"></div>
    </div>

    <div class="mandal-bolumu">
        <div id="mandalDurum" style="font-size:0.7rem; color:#94a3b8; font-weight:bold; line-height:1.2;">TELSİZ<br>BAS-KONUŞ</div>
        <div class="btn-mandal" id="mandalBtn">🎤</div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = "";
        const ses = document.getElementById('vakaSes');
        let alarmZamanlayici, acilZamanlayici, vakaGecmisi = [];

        // 1. SİSTEM GİRİŞİ VE AKTİF KULLANICI KAYDI
        window.sistemiAc = () => {
            const name = document.getElementById('userName').value.trim();
            const pin = document.getElementById('pinInput').value;
            
            if(name.length > 2 && pin === "1234") {
                currentUser = name;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('personelEtiket').innerText = "PERSONEL: " + currentUser.toUpperCase();
                
                // Firebase'e aktif kullanıcıyı ekle ve kopunca sil
                const userRef = ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_"));
                set(userRef, { isim: currentUser, giris: new Date().toLocaleTimeString() });
                onDisconnect(userRef).remove();

                ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
            } else { alert("Geçerli bir isim girin ve PIN'i (1234) doğrulayın!"); }
        };

        // 2. CANLI SAAT VE TARİH
        setInterval(() => {
            const simdi = new Date();
            document.getElementById('saat-ust').innerText = simdi.toLocaleTimeString('tr-TR');
            document.getElementById('tarih-ust').innerText = simdi.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'long' });
        }, 1000);

        // 3. ACİL DESTEK (3 SN BASILI TUTMA)
        const acilBtn = document.getElementById('acilDestekBtn');
        acilBtn.addEventListener('pointerdown', () => {
            acilBtn.innerText = "GÖNDERİLİYOR...";
            acilZamanlayici = setTimeout(() => {
                set(ref(db, 'ekipDurum'), { 
                    durum: "!!! ACİL DESTEK !!!", 
                    isim: currentUser, 
                    renk: "#ff0000", 
                    zaman: new Date().toLocaleTimeString(), 
                    acil: true 
                });
                document.body.classList.add('destek-mod');
                acilBtn.innerText = "SİNYAL İLETİLDİ";
                if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 500]);
            }, 3000);
        });
        acilBtn.addEventListener('pointerup', () => {
            clearTimeout(acilZamanlayici);
            if(!document.body.classList.contains('destek-mod')) acilBtn.innerText = "🆘 ACİL DESTEK (3 SN BASIN)";
        });

        // 4. TELSİZ MANDALI (BAS-KONUŞ)
        let mediaRecorder, audioChunks = [];
        const mandalBtn = document.getElementById('mandalBtn');
        mandalBtn.addEventListener('pointerdown', async (e) => {
            e.preventDefault();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);
                mediaRecorder.onstop = () => {
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                    reader.onloadend = () => {
                        push(ref(db, 'telsizMesajlari'), { ses: reader.result, ekip: currentUser, zaman: new Date().toLocaleTimeString() });
                    };
                };
                mediaRecorder.start();
                document.getElementById('mandalDurum').innerText = "KAYITTA...";
                if(navigator.vibrate) navigator.vibrate(50);
            } catch (err) { alert("Mikrofon izni gerekli!"); }
        });
        mandalBtn.addEventListener('pointerup', () => {
            if(mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                document.getElementById('mandalDurum').innerText = "TELSİZ\nBAS-KONUŞ";
            }
        });

        // 5. DURUM GÜNCELLEME
        window.durumGuncelle = (durum, renk, bitis = false) => {
            set(ref(db, 'ekipDurum'), { durum, isim: currentUser, renk, zaman: new Date().toLocaleTimeString(), acil: false });
            if(bitis) {
                document.getElementById('islemButonlari').style.display = 'none';
                document.body.classList.remove('kritik-mod', 'destek-mod');
                ses.pause();
            }
        };

        // 6. VAKA DİNLEME VE GEÇMİŞ
        let sonMesaj = "";
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if(data && data.metin && data.metin !== sonMesaj) {
                const vakaVar = !data.metin.includes("BEKLENİYOR");
                if(vakaVar) {
                    ses.currentTime = 0; ses.loop = true; ses.play().catch(()=>{});
                    clearTimeout(alarmZamanlayici);
                    alarmZamanlayici = setTimeout(() => { ses.loop = false; ses.pause(); }, 6000);
                    
                    document.getElementById('vakaMetin').innerText = data.metin;
                    document.getElementById('islemButonlari').style.display = 'flex';
                    if(data.oncelik === 'kritik') document.body.classList.add('kritik-mod');

                    vakaGecmisi.unshift({ metin: data.metin, saat: new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}) });
                    document.getElementById('gecmisListe').innerHTML = vakaGecmisi.slice(0,5).map(v => `
                        <div class="gecmis-item"><b>🕒 ${v.saat}</b> - ${v.metin}</div>
                    `).join('');
                } else {
                    document.body.classList.remove('kritik-mod', 'destek-mod');
                    document.getElementById('islemButonlari').style.display = 'none';
                    document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
                }
                sonMesaj = data.metin;
            }
        });

        // 7. ADMİN ACİL DURUMU KAPATIRSA
        onValue(ref(db, 'ekipDurum'), snapshot => {
            const data = snapshot.val();
            if(data && data.acil === false) {
                document.body.classList.remove('destek-mod');
                acilBtn.innerText = "🆘 ACİL DESTEK (3 SN BASIN)";
            }
        });
    </script>
</body>
</html>
