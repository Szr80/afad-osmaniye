<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSMANİYE AFAD | SAHA</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; touch-action: manipulation; }
        body { background: #0f172a; color: white; margin: 0; padding: 15px; text-align: center; }
        
        /* Ana Başlık ve Vaka Alanı */
        .ust-panel { background: #1e293b; padding: 20px; border-radius: 10px; border-bottom: 4px solid #f97316; margin-bottom: 15px; }
        #vakaMetin { font-size: 1.4rem; font-weight: bold; color: #f97316; margin-bottom: 5px; }
        #vakaDetay { font-size: 0.9rem; color: #94a3b8; font-weight: bold; }

        /* Durum Butonları */
        .vaka-aksiyon { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { padding: 15px; border: none; border-radius: 8px; font-weight: bold; color: white; font-size: 1rem; }
        .btn-yol { background: #3b82f6; }
        .btn-olay { background: #eab308; }
        .btn-tamam { background: #22c55e; grid-column: span 2; margin-top: 5px; }

        /* Telsiz Butonu */
        .telsiz-kapsayici { margin: 30px 0; }
        #telsizBtn { 
            width: 220px; height: 220px; border-radius: 50%; border: 10px solid #334155;
            background: radial-gradient(#dc2626, #7f1d1d); color: white;
            font-weight: 900; font-size: 1.5rem; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #telsizBtn:active { transform: scale(0.95); border-color: #f97316; }

        /* Vaka Geçmişi (Eski Stil) */
        .gecmis-liste { margin-top: 30px; text-align: left; }
        .gecmis-item { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #64748b; }
        .gecmis-zaman { font-size: 0.75rem; color: #f97316; font-weight: bold; margin-bottom: 3px; }
        .gecmis-metin { font-size: 0.9rem; color: #e2e8f0; }

        /* Acil Durum Efekti */
        .acil-uyari { animation: flash 0.5s infinite; }
        @keyframes flash { 0% { background: #0f172a; } 50% { background: #b91c1c; } 100% { background: #0f172a; } }
    </style>
</head>
<body id="anaEkran">

    <div class="ust-panel">
        <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
        <div id="vakaDetay">--:-- | --/--/----</div>
        
        <div id="vakaButonlari" class="vaka-aksiyon">
            <button class="btn btn-yol" onclick="durumGonder('YOLDAYIM')">YOLDAYIM</button>
            <button class="btn btn-olay" onclick="durumGonder('OLAY YERİNDE')">OLAY YERİNDE</button>
            <button class="btn btn-tamam" onclick="vakaKapat()">GÖREV TAMAMLANDI</button>
        </div>
    </div>

    <div class="telsiz-kapsayici">
        <button id="telsizBtn">BAS KONUŞ</button>
        <p id="durumYazi" style="margin-top:15px; font-weight:bold; color:#64748b;">SİSTEM AKTİF</p>
    </div>

    <div class="gecmis-liste">
        <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:10px; font-weight:bold;">SON 5 VAKA KAYDI</div>
        <div id="gecmisIcerik"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let isim = localStorage.getItem('afadIsim') || prompt("İsim Soyisim:");
        if(isim) localStorage.setItem('afadIsim', isim);
        const userKey = isim.replace(/\s/g, "_");

        const alarm = new Audio('https://top-snms.com/alarm.mp3');
        let recorder, chunks = [], acilTimer, basBaslama, acilMod = false;
        let vakaGecmisi = JSON.parse(localStorage.getItem('afadGecmis')) || [];

        // 1. VAKA VE GEÇMİŞ YÖNETİMİ
        onValue(ref(db, 'ortakKanal'), (s) => {
            const v = s.val();
            if (v && v.metin !== "GÖREV BEKLENİYOR...") {
                document.getElementById('vakaMetin').innerText = v.metin;
                document.getElementById('vakaDetay').innerText = (v.zaman || "--:--") + " | " + new Date().toLocaleDateString('tr-TR');
                document.getElementById('vakaButonlari').style.display = "grid";
                
                alarm.loop = true; alarm.play();
                if(navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
                setTimeout(() => { alarm.pause(); }, 6000);

                const yeniVaka = { metin: v.metin, zaman: v.zaman, tarih: new Date().toLocaleDateString('tr-TR') };
                if(vakaGecmisi.length === 0 || vakaGecmisi[0].metin !== yeniVaka.metin) {
                    vakaGecmisi.unshift(yeniVaka);
                    if(vakaGecmisi.length > 5) vakaGecmisi.pop();
                    localStorage.setItem('afadGecmis', JSON.stringify(vakaGecmisi));
                    listele();
                }
            } else {
                document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
                document.getElementById('vakaButonlari').style.display = "none";
            }
        });

        // 2. TELSİZ VE 3 SANİYE ACİL DESTEK
        const tBtn = document.getElementById('telsizBtn');
        tBtn.onpointerdown = async (e) => {
            e.preventDefault();
            basBaslama = Date.now();
            acilTimer = setInterval(() => {
                let gecen = Date.now() - basBaslama;
                if (gecen >= 3000 && !acilMod) {
                    acilMod = true;
                    update(ref(db, 'aktifKullanicilar/' + userKey), { durum: "YARDIM İSTİYOR", acilDurum: true });
                    document.getElementById('anaEkran').classList.add('acil-uyari');
                    document.getElementById('durumYazi').innerText = "🆘 YARDIM ÇAĞRISI GÖNDERİLDİ!";
                    document.getElementById('durumYazi').style.color = "#ef4444";
                }
                if (acilMod && navigator.vibrate) navigator.vibrate(100);
            }, 1000);

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recorder = new MediaRecorder(stream);
            chunks = [];
            recorder.ondataavailable = x => chunks.push(x.data);
            recorder.start();
            if(!acilMod) document.getElementById('durumYazi').innerText = "🎤 KAYIT YAPILIYOR...";
        };

        tBtn.onpointerup = () => {
            clearInterval(acilTimer);
            if (recorder && recorder.state !== "inactive") {
                recorder.stop();
                if ((Date.now() - basBaslama) < 3000) {
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const r = new FileReader();
                        r.readAsDataURL(blob);
                        r.onloadend = () => {
                            push(ref(db, 'telsizMesajlari'), { ekip: isim, ses: r.result, zaman: new Date().toLocaleTimeString() });
                        };
                        document.getElementById('durumYazi').innerText = "✅ MESAJ GİTTİ";
                    };
                }
            }
        };

        // 3. ADMİN ONAYI
        onValue(ref(db, 'aktifKullanicilar/' + userKey + '/acilDurum'), (s) => {
            if (s.val() === false && acilMod) {
                acilMod = false;
                document.getElementById('anaEkran').classList.remove('acil-uyari');
                document.getElementById('durumYazi').innerText = "✅ YARDIM ONAYLANDI";
                document.getElementById('durumYazi').style.color = "#64748b";
            }
        });

        // 4. DİĞER FONKSİYONLAR
        function listele() {
            document.getElementById('gecmisIcerik').innerHTML = vakaGecmisi.map(v => `
                <div class="gecmis-item">
                    <div class="gecmis-zaman">${v.tarih} - ${v.zaman}</div>
                    <div class="gecmis-metin">${v.metin}</div>
                </div>`).join('');
        }
        listele();

        window.durumGonder = (d) => {
            update(ref(db, 'aktifKullanicilar/' + userKey), { durum: d, sonSinyal: new Date().toLocaleTimeString() });
        };

        window.vakaKapat = () => {
            alarm.pause(); durumGonder("AKTİF");
        };

        function sinyal() {
            navigator.geolocation.getCurrentPosition(p => {
                update(ref(db, 'aktifKullanicilar/' + userKey), {
                    isim: isim, enlem: p.coords.latitude, boylam: p.coords.longitude,
                    timestamp: Date.now(), sonSinyal: new Date().toLocaleTimeString()
                });
            }, null, { enableHighAccuracy: true });
        }
        setInterval(sinyal, 10000); sinyal();
    </script>
</body>
</html>
