<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>AFAD UÇ BİRİM</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; display: flex; flex-direction: column; margin: 0; }
        #saat { font-size: 3.5rem; color: #f97316; font-weight: bold; margin-top: 20px; }
        .vaka-karti { margin: 20px; padding: 30px; border-radius: 20px; background: #1e293b; border-left: 12px solid #f97316; box-shadow: 0 15px 50px rgba(0,0,0,0.6); flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        #vakaMetin { font-size: 1.8rem; font-weight: bold; line-height: 1.4; }
        #aktivasyon { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .btn-baslat { padding: 25px 50px; background: #f97316; color: white; border: none; border-radius: 60px; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body onclick="sistemiBaslat()">

    <div id="aktivasyon">
        <img src="https://upload.wikimedia.org/wikipedia/tr/e/ee/Afet_ve_Acil_Durum_Y%C3%B6netimi_Ba%C5%9Fanl%C4%B1%C4%9F%C4%B1_logosu.png" width="120">
        <h1 style="margin:20px 0;">AFAD UÇ BİRİM</h1>
        <button class="btn-baslat">SİSTEMİ AKTİF ET</button>
        <p style="color:#94a3b8; margin-top:20px;">Arka Plan Bildirimleri İçin Dokunun</p>
    </div>

    <div id="saat">00:00:00</div>
    <div class="vaka-karti">
        <div style="color:#f97316; font-size:0.8rem; letter-spacing:2px; margin-bottom:10px;">● AKTİF VAKA</div>
        <div id="vakaMetin">VAKA BEKLENİYOR...</div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ses = document.getElementById('vakaSes');

        setInterval(() => { document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR'); }, 1000);

        // Service Worker Kaydı (Arka plan için şart)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                console.log("Arka plan bekçisi aktif.");
            });
        }

        window.sistemiBaslat = () => {
            document.getElementById('aktivasyon').style.display = 'none';
            if ("Notification" in window) { 
                Notification.requestPermission(); 
            }
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
        };

        let ilk = true;
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                document.getElementById('vakaMetin').innerText = data.metin;
                if (!ilk && data.metin !== "VAKA BEKLENİYOR...") {
                    ses.play().catch(() => {});
                    if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
                }
                ilk = false;
            }
        });
    </script>
</body>
</html>
