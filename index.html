<!-- Mevcut head ve style kısımların aynen kalıyor, sadece script kısmına şu eklemeleri yapıyoruz -->

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let wakeLock = null;

    // 1. EKRANIN VE UYGULAMANIN UYUMASINI ENGELLE (Wake Lock)
    async function hayattaKal() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log("Saha Modu: Uygulama uyutulmayacak.");
            }
        } catch (err) {
            console.log("WakeLock Hatası: ", err);
        }
    }

    // 2. SERVICE WORKER KAYDI (Arka plan bildirimleri için)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
            console.log("Arka plan servisi aktif.");
        });
    }

    let currentUser = localStorage.getItem('afadUser') || "";
    
    if(currentUser) {
        document.getElementById('loginOverlay').style.display = 'none';
        const userKey = currentUser.replace(/\s/g, "_");
        const userRef = ref(db, 'aktifKullanicilar/' + userKey);

        // Uygulama açılır açılmaz hayatta kalma modunu başlat
        hayattaKal();
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                hayattaKal();
            }
        });

        // 3. AGRESİF KONUM TAKİBİ (Yüksek Öncelikli)
        function konumuGonder(p) {
            const data = {
                lat: p.coords.latitude,
                lng: p.coords.longitude,
                timestamp: Date.now(),
                isim: currentUser,
                durum: localStorage.getItem('suankiDurum') || "AKTİF"
            };
            update(userRef, data);
        }

        const konumAyarlar = {
            enableHighAccuracy: true,
            timeout: 5000,
            maximumAge: 0
        };

        // Hem izle hem de her 10 saniyede bir zorla güncelle (Fallback)
        navigator.geolocation.watchPosition(konumuGonder, (err) => console.error(err), konumAyarlar);
        
        setInterval(() => {
            navigator.geolocation.getCurrentPosition(konumuGonder, null, konumAyarlar);
        }, 10000);

        // 4. BİLDİRİM DİNLEME (Uygulama açıkken veya arkadayken)
        onValue(ref(db, 'ortakKanal'), (s) => {
            const d = s.val();
            if(d?.metin && !d.metin.includes("BEKLENİYOR")) {
                // Bildirim gönder
                if (Notification.permission === "granted") {
                    new Notification("OSMANİYE AFAD 🚨", {
                        body: d.metin,
                        icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png"
                    });
                }
                // Ses ve titreşim kodların burada çalışmaya devam eder...
            }
        });
    }

    // Çıkış yapınca her şeyi durdur
    window.cikisYap = () => {
        if(wakeLock) wakeLock.release();
        localStorage.clear(); 
        location.reload(); 
    };

    // Diğer fonksiyonların (durumGuncelle, vakaKapat vb.) aynen kalıyor...
</script>
