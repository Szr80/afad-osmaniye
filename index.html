<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <title>Osmaniye AFAD</title>
    
    <script>
        const myManifest = {
            "name": "Osmaniye AFAD",
            "short_name": "AFAD",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#f97316",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/564/564619.png","sizes": "512x512","type": "image/png","purpose": "any maskable"}]
        };
        const blob = new Blob([JSON.stringify(myManifest)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f172a; color: white; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #girisEkrani { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .giris-kart { background: #1e293b; padding: 30px; border-radius: 25px; width: 100%; max-width: 400px; border: 2px solid #f97316; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; }
        .logo-alan { width: 80px; height: 80px; background: #f97316; border-radius: 20px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 0 20px rgba(249,115,22,0.4); }
        .giris-kart h2 { margin: 0 0 10px; color: #f97316; font-weight: 900; letter-spacing: -1px; }
        .giris-kart p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        .giris-kart input { width: 100%; padding: 15px; margin-bottom: 15px; background: #0f172a; border: 2px solid #334155; border-radius: 15px; color: white; font-size: 1rem; text-align: center; transition: 0.3s; }
        .giris-kart input:focus { border-color: #f97316; outline: none; }
        .btn-giris { width: 100%; padding: 15px; background: #f97316; border: none; border-radius: 15px; color: white; font-weight: 900; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(249,115,22,0.3); }

        .header { background: #1e293b; padding: env(safe-area-inset-top) 20px 15px; border-bottom: 2px solid #f97316; display: flex; justify-content: space-between; align-items: center; }
        .header-bilgi h1 { margin: 0; font-size: 1.2rem; font-weight: 900; color: #f97316; }
        .header-bilgi span { font-size: 0.75rem; color: #94a3b8; font-weight: bold; }
        .saat-kutu { text-align: right; }
        #txtSaat { font-size: 1.4rem; font-weight: 900; color: #f97316; display: block; line-height: 1; }
        #txtTarih { font-size: 0.65rem; color: #64748b; font-weight: 900; }

        .vaka-kapsayici { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .vaka-kutu { background: #1e293b; border-radius: 25px; padding: 25px; border: 2px solid #334155; transition: 0.4s; position: relative; }
        .vaka-kutu.vaka-var { border-color: #ef4444; background: #450a0a; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 70% { box-shadow: 0 0 0 20px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
        
        .vaka-etiket { position: absolute; top: -12px; left: 25px; background: #334155; padding: 4px 12px; border-radius: 10px; font-size: 0.7rem; font-weight: 900; color: #94a3b8; }
        .vaka-var .vaka-etiket { background: #ef4444; color: white; }
        
        #vakaMetin { font-size: 1.3rem; font-weight: 800; line-height: 1.4; color: #e2e8f0; margin: 10px 0; }
        .vaka-butonlar { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-aksiyon { padding: 15px; border: none; border-radius: 15px; font-weight: 900; font-size: 0.8rem; cursor: pointer; color: white; }
        .btn-yola { background: #3b82f6; }
        .btn-vardi { background: #eab308; }
        .btn-tamam { background: #22c55e; grid-column: span 2; }

        .durum-bar { background: #1e293b; padding: 15px 20px; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .ekip-bilgi { display: flex; align-items: center; gap: 12px; }
        .ekip-icon { width: 40px; height: 40px; background: #0f172a; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #f97316; font-weight: 900; border: 1px solid #334155; }
        #txtEkipDurum { font-size: 0.85rem; font-weight: 900; color: #22c55e; }
        
        .sos-btn { width: 50px; height: 50px; background: #ef4444; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 5px 15px rgba(239,68,68,0.3); border: none; color: white; cursor: pointer; }
        
        .gecmis-panel { margin-top: 10px; }
        .gecmis-baslik { font-size: 0.75rem; font-weight: 900; color: #475569; letter-spacing: 1px; margin-bottom: 10px; padding-left: 5px; }
        .gecmis-vaka { background: #1e293b; padding: 15px; border-radius: 18px; margin-bottom: 8px; border-left: 4px solid #334155; font-size: 0.85rem; color: #94a3b8; }
        .gecmis-zaman { display: block; font-size: 0.65rem; color: #475569; margin-bottom: 4px; font-weight: 900; }
        
        #acilEkran { position: fixed; inset: 0; background: #ef4444; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #acilEkran h2 { font-size: 3rem; font-weight: 900; margin: 0; animation: flash 0.5s infinite alternate; }
        @keyframes flash { from { opacity: 1; transform: scale(1); } to { opacity: 0.5; transform: scale(0.9); } }
    </style>
</head>
<body>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" preload="auto" loop></audio>

    <div id="girisEkrani">
        <div class="giris-kart">
            <div class="logo-alan">A</div>
            <h2>OSMANİYE AFAD</h2>
            <p>Saha Personel Girişi</p>
            <input type="text" id="ekipKod" placeholder="Ekip İsmi (Örn: AFAD-01)" autocomplete="off">
            <button class="btn-giris" onclick="girisYap()">SİSTEME BAĞLAN</button>
            <div style="font-size:0.6rem; color:#475569; margin-top:20px; letter-spacing:2px;">SİSTEM YAZILIM: SEZER ÇALT</div>
        </div>
    </div>

    <div id="acilEkran">
        <h2>SOS</h2>
        <p style="font-weight: 900; font-size: 1.2rem;">ACİL DURUM SİNYALİ GÖNDERİLDİ</p>
        <p>Merkez ile konumunuz paylaşılıyor...</p>
    </div>

    <div class="header">
        <div class="header-bilgi">
            <h1>AFAD SAHA</h1>
            <span id="txtEkipAd">EKİP BAĞLI DEĞİL</span>
        </div>
        <div class="saat-kutu">
            <span id="txtSaat">00:00</span>
            <span id="txtTarih">01.01.2026 PAZARTESİ</span>
        </div>
    </div>

    <div class="vaka-kapsayici">
        <div class="vaka-kutu" id="vakaKutu">
            <div class="vaka-etiket">GÜNCEL GÖREV BİLGİSİ</div>
            <div id="vakaMetin">GÖREV BEKLENİYOR...</div>
            <div class="vaka-butonlar" id="vakaButonlar">
                <button class="btn-aksiyon btn-yola" onclick="durumGuncelle('VAKAYA GİDİYOR')">YOLA ÇIKTIK</button>
                <button class="btn-aksiyon btn-vardi" onclick="durumGuncelle('OLAY YERİNDE')">VAKAYA VARDIK</button>
                <button class="btn-aksiyon btn-tamam" onclick="vakaKapat()">VAKAYI TAMAMLA</button>
            </div>
        </div>

        <div class="gecmis-panel">
            <div class="gecmis-baslik">SON TAMAMLANAN GÖREVLER</div>
            <div id="vakaGecmisAlani"></div>
        </div>
    </div>

    <div class="durum-bar">
        <div class="ekip-bilgi">
            <div class="ekip-icon" onclick="cikisYap()">A</div>
            <div>
                <div style="font-size: 0.6rem; color: #475569; font-weight: 900;">DURUMUNUZ</div>
                <div id="txtEkipDurum">HAZIR / BEKLEMEDE</div>
            </div>
        </div>
        <button class="sos-btn" onclick="sosTetikle()">🆘</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let ekipID = localStorage.getItem('ekipID');
        let vakaGecmis = JSON.parse(localStorage.getItem('vakaGecmis')) || [];

        // ARKA PLAN MOTORU (Milim dokunulmadan eklendi)
        async function bildirimIste() { if ("Notification" in window) await Notification.requestPermission(); }
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGU9Pnt9KTs=');

        window.girisYap = () => {
            const kod = document.getElementById('ekipKod').value.trim().toUpperCase();
            if(kod) {
                localStorage.setItem('ekipID', kod);
                bildirimIste();
                location.reload();
            }
        };

        if(ekipID) {
            document.getElementById('girisEkrani').style.display = 'none';
            document.getElementById('txtEkipAd').innerText = ekipID;
            
            const userRef = ref(db, 'aktifKullanicilar/' + ekipID);
            
            navigator.geolocation.watchPosition(pos => {
                update(userRef, { lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: Date.now(), isim: ekipID });
            }, null, { enableHighAccuracy: true });

            onDisconnect(userRef).remove();

            let ilkYukleme = true;
            onValue(ref(db, 'ortakKanal'), (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    const txt = data.metin;
                    document.getElementById('vakaMetin').innerText = txt;
                    if(txt.includes("GÖREV BEKLENİYOR")) {
                        document.getElementById('vakaKutu').classList.remove('vaka-var');
                        document.getElementById('vakaButonlar').style.display = 'none';
                        document.getElementById('vakaSes').pause();
                    } else {
                        document.getElementById('vakaKutu').classList.add('vaka-var');
                        document.getElementById('vakaButonlar').style.display = 'grid';
                        document.getElementById('vakaSes').play().catch(() => {});
                        // ARKA PLAN BİLDİRİMİ
                        if (!ilkYukleme && document.visibilityState !== 'visible') {
                            new Notification("🚨 YENİ GÖREV!", { body: txt, icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png" });
                            if('vibrate' in navigator) navigator.vibrate([500, 200, 500]);
                        }
                    }
                }
                ilkYukleme = false;
            });

            onValue(ref(db, 'aktifKullanicilar/' + ekipID + '/onay'), (s) => {
                if(s.val() === true) {
                    update(userRef, { acilDurum: false, onay: false, durum: "HAZIR / BEKLEMEDE" });
                    document.getElementById('acilEkran').style.display = 'none';
                }
            });
        }

        window.durumGuncelle = (durum) => {
            update(ref(db, 'aktifKullanicilar/' + ekipID), { durum: durum });
            document.getElementById('txtEkipDurum').innerText = durum;
            if(durum === 'VAKAYA GİDİYOR') document.getElementById('txtEkipDurum').style.color = '#3b82f6';
            if(durum === 'OLAY YERİNDE') document.getElementById('txtEkipDurum').style.color = '#eab308';
            if(durum === 'HAZIR / BEKLEMEDE') document.getElementById('txtEkipDurum').style.color = '#22c55e';
        };

        window.sosTetikle = () => {
            update(ref(db, 'aktifKullanicilar/' + ekipID), { acilDurum: true, durum: "🆘 ACİL DURUM!" });
            document.getElementById('acilEkran').style.display = 'flex';
        };

        window.vakaKapat = () => {
            const txt = document.getElementById('vakaMetin').innerText;
            vakaGecmis.unshift({ metin: txt, tarih: new Date().toLocaleDateString('tr-TR'), saat: new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}) });
            vakaGecmis = vakaGecmis.slice(0, 5);
            localStorage.setItem('vakaGecmis', JSON.stringify(vakaGecmis));
            gecmisListele();
            document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
            document.getElementById('vakaKutu').classList.remove('vaka-var');
            document.getElementById('vakaButonlar').style.display = 'none';
            durumGuncelle('HAZIR / BEKLEMEDE');
        };

        function gecmisListele() {
            const alan = document.getElementById('vakaGecmisAlani');
            alan.innerHTML = "";
            vakaGecmis.forEach(v => {
                alan.innerHTML += `<div class="gecmis-vaka"><span class="gecmis-zaman">${v.tarih} | ${v.saat}</span>${v.metin}</div>`;
            });
        }
        gecmisListele();
        window.cikisYap = () => { if(confirm("Çıkış yapılsın mı?")) { localStorage.clear(); location.reload(); } };
        
        setInterval(() => {
            const simdi = new Date();
            const gunler = ["PAZAR", "PAZARTESİ", "SALI", "ÇARŞAMBA", "PERŞEMBE", "CUMA", "CUMARTESİ"];
            document.getElementById('txtSaat').innerText = simdi.toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'});
            document.getElementById('txtTarih').innerText = `${simdi.toLocaleDateString('tr-TR')} ${gunler[simdi.getDay()]}`;
        }, 1000);
    </script>
</body>
</html>
