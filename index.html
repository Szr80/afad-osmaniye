<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <title>Osmaniye AFAD</title>
    
    <script>
        // PWA Manifest Tanımı
        const myManifest = {
            "name": "Osmaniye AFAD",
            "short_name": "AFAD",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#f97316",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/564/564619.png","sizes": "512x512","type": "image/png"}]
        };
        const blob = new Blob([JSON.stringify(myManifest)], {type: 'application/json'});
        const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(blob); document.head.appendChild(link);
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; transition: background 0.4s ease; }
        body.acil-mod { background: #7f1d1d !important; }
        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 5px solid #f97316; padding-top: calc(15px + env(safe-area-inset-top)); }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 10px; color: #94a3b8; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; margin: 5px 0; }
        .konum-ikon-alani { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
        .canak { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; position: relative; }
        .canak::after { content: ''; position: absolute; inset: -4px; border: 2px solid #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .sistem-aktif { color: #22c55e; font-size: 0.65rem; font-weight: 900; }
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        .ana-vaka-kutusu { background: #1e293b; padding: 20px; border-radius: 20px; border-left: 12px solid #f97316; text-align: left; }
        .vaka-var { border-left-color: #ef4444; background: #450a0a; animation: vakaFlash 1s infinite; }
        @keyframes vakaFlash { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .durum-butonlar { display: none; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-durum { padding: 12px; border-radius: 10px; border: none; font-weight: 900; font-size: 0.7rem; color: white; cursor: pointer; text-transform: uppercase; }
        .btn-yolda { background: #3b82f6; border-bottom: 4px solid #1e40af; }
        .btn-olay { background: #eab308; border-bottom: 4px solid #a16207; }
        .btn-donus { background: #a855f7; border-bottom: 4px solid #7e22ce; }
        .btn-tamam { background: #22c55e; border-bottom: 4px solid #166534; }
        .btn-acil { background: #dc2626; border: 5px solid #450a0a; color: white; padding: 20px; border-radius: 18px; font-weight: 900; width: 100%; margin-top: auto; }
        .alt-panel { background: #1e293b; padding: 15px; border-top: 3px solid #334155; display: flex; align-items: center; justify-content: center; position: relative; padding-bottom: calc(45px + env(safe-area-inset-bottom)); }
        .btn-mandal { width: 85px; height: 85px; border-radius: 50%; background: #f97316; border: 8px solid #450a0a; color: white; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; touch-action: none; margin-top: -45px; z-index: 10; }
        .btn-mandal.active { background: #dc2626; transform: scale(0.95); }
        .cikis-kapsayici { position: absolute; left: 15px; bottom: calc(25px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 100; }
        .btn-cikis-yuvarlak { width: 50px; height: 50px; border-radius: 50%; background: #1e293b; color: #ef4444; border: 2px solid #ef4444; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
        .sezer-imza { position: absolute; bottom: calc(5px + env(safe-area-inset-bottom)); font-size: 0.55rem; color: #475569; letter-spacing: 1px; font-weight: bold; text-transform: uppercase; pointer-events: none; }
    </style>
</head>
<body>
    <div id="loginOverlay" style="position:fixed; inset:0; background:#0f172a; z-index:20000; display:flex; align-items:center; justify-content:center;">
        <div style="background:#1e293b; padding:35px; border-radius:25px; border:3px solid #f97316; width:85%; max-width:350px;">
            <input type="text" id="userName" placeholder="PERSONEL ADI" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:none; text-align:center; font-weight:bold; background:#0f172a; color:white;">
            <button onclick="sistemiAc()" style="width:100%; padding:15px; background:#f97316; color:white; border:none; border-radius:10px; font-weight:900;">SİSTEME BAĞLAN</button>
        </div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri"><div id="tarih-ust">...</div><div id="saat-ust">...</div></div>
        <div id="ana-baslik">Osmaniye AFAD</div>
        <div class="konum-ikon-alani">
            <div class="canak"></div>
            <span id="pAd">...</span> | <span class="sistem-aktif">SİSTEM ÇEVRİMİÇİ</span>
        </div>
    </div>

    <div class="vaka-alani">
        <div class="ana-vaka-kutusu" id="vakaKutu">
            <div id="vakaMetin" style="font-weight:900; font-size:1.1rem;">GÖREV BEKLENİYOR...</div>
            <div class="durum-butonlar" id="vakaButonlar">
                <button class="btn-durum btn-yolda" onclick="durumGuncelle('YOLDAYIM')">YOLDAYIM</button>
                <button class="btn-durum btn-olay" onclick="durumGuncelle('OLAY YERİNDE')">OLAY YERİ</button>
                <button class="btn-durum btn-donus" onclick="durumGuncelle('DÖNÜŞTE')">DÖNÜŞTE</button>
                <button class="btn-durum btn-tamam" onclick="vakaKapat()">TAMAMLANDI</button>
            </div>
        </div>
        <div id="vakaGecmisAlani"></div>
        <button class="btn-acil" id="acilDestekBtn">🆘 ACİL DESTEK (3 SN)</button>
    </div>

    <div class="alt-panel">
        <div class="cikis-kapsayici"><button class="btn-cikis-yuvarlak" onclick="window.cikisYap()">🚪</button></div>
        <div class="btn-mandal" id="mandalBtn">🎤</div>
        <div class="sezer-imza">Sistem Yazılım & Geliştirme: Sezer ÇALT</div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        
        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            // 1. Service Worker Kaydı (Hata Yönetimli)
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').then(reg => console.log("Servis Aktif")).catch(err => console.log("SW Hata:", err));
                });
            }

            // 2. Wake Lock (Ekranı Açık Tutma)
            let wakeLock = null;
            const keepAlive = async () => {
                try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            };
            keepAlive();
            document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') keepAlive(); });

            let currentUser = localStorage.getItem('afadUser') || "";
            let sonVakaID = "";
            const vakaSes = document.getElementById('vakaSes');

            window.sistemiAc = () => {
                const name = document.getElementById('userName').value.trim();
                if(name) { localStorage.setItem('afadUser', name); location.reload(); }
            };

            if(currentUser) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('pAd').innerText = currentUser.toUpperCase();
                const userRef = ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_"));

                update(userRef, { isim: currentUser, durum: "HAZIR", timestamp: Date.now() });
                onDisconnect(userRef).remove();

                // 3. Konum Takibi (Her 10 saniyede bir zorla gönderir)
                const sendPos = (p) => {
                    update(userRef, { lat: p.coords.latitude, lng: p.coords.longitude, timestamp: Date.now(), isim: currentUser });
                };
                navigator.geolocation.watchPosition(sendPos, null, { enableHighAccuracy: true });
                setInterval(() => navigator.geolocation.getCurrentPosition(sendPos, null, { enableHighAccuracy: true }), 10000);

                // 4. Vaka Dinleme & Bildirim
                onValue(ref(db, 'ortakKanal'), (s) => {
                    const d = s.val();
                    if(d?.metin && !d.metin.includes("BEKLENİYOR") && d.zaman !== sonVakaID) {
                        if (Notification.permission === "granted") {
                            new Notification("🚨 YENİ GÖREV", { body: d.metin, icon: 'https://cdn-icons-png.flaticon.com/512/564/564619.png' });
                        }
                        document.getElementById('vakaMetin').innerText = d.metin;
                        document.getElementById('vakaButonlar').style.display = 'grid';
                        document.getElementById('vakaKutu').classList.add('vaka-var');
                        vakaSes.loop = true; vakaSes.play().catch(()=>{});
                        sonVakaID = d.zaman;
                    }
                });

                // Mikrofon ve SOS (Orijinal Mantık)
                const mBtn = document.getElementById('mandalBtn');
                let mr, chunks = [];
                mBtn.ontouchstart = async (e) => {
                    e.preventDefault(); mBtn.classList.add('active');
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mr = new MediaRecorder(stream);
                    mr.ondataavailable = (e) => chunks.push(e.data);
                    mr.onstop = () => {
                        const r = new FileReader(); r.readAsDataURL(new Blob(chunks));
                        r.onloadend = () => push(ref(db, 'telsizMesajlari'), { ekip: currentUser, ses: r.result, zaman: new Date().toLocaleTimeString() });
                        chunks = []; stream.getTracks().forEach(t => t.stop());
                    };
                    mr.start();
                };
                mBtn.ontouchend = () => { mBtn.classList.remove('active'); if(mr) mr.stop(); };

                let sosT; const sosB = document.getElementById('acilDestekBtn');
                sosB.ontouchstart = (e) => {
                    e.preventDefault();
                    sosT = setTimeout(() => {
                        update(userRef, { acilDurum: true, durum: "🆘 SOS!", timestamp: Date.now() });
                        document.body.classList.add('acil-mod');
                    }, 3000);
                };
                sosB.ontouchend = () => clearTimeout(sosT);
            }

            window.durumGuncelle = (dur) => update(ref(db, 'aktifKullanicilar/' + currentUser.replace(/\s/g, "_")), { durum: dur, timestamp: Date.now() });
            window.vakaKapat = () => {
                vakaSes.pause(); vakaSes.currentTime = 0;
                document.getElementById('vakaKutu').classList.remove('vaka-var');
                document.getElementById('vakaButonlar').style.display = 'none';
                document.getElementById('vakaMetin').innerText = "GÖREV BEKLENİYOR...";
                window.durumGuncelle("HAZIR");
            };
            window.cikisYap = () => { localStorage.clear(); location.reload(); };

            setInterval(() => {
                document.getElementById('tarih-ust').innerText = new Date().toLocaleDateString('tr-TR');
                document.getElementById('saat-ust').innerText = new Date().toLocaleTimeString('tr-TR');
            }, 1000);

            if(Notification.permission !== "granted") Notification.requestPermission();

        } catch (err) {
            document.body.innerHTML = `<div style="padding:20px; color:white;">Sistem Hatası: ${err.message}<br><button onclick="location.reload()">Tekrar Dene</button></div>`;
        }
    </script>
</body>
</html>
