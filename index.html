<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>AFAD VAKA UÇ BİRİM</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; height: 100vh; display: flex; flex-direction: column; margin: 0; overflow: hidden; }
        .header { background: #1e293b; padding: 20px; border-bottom: 4px solid #f97316; }
        #saat { font-size: 3.5rem; color: #f97316; font-weight: bold; }
        .vaka-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .vaka-kutu { background: #1e293b; padding: 35px; border-radius: 25px; border-left: 12px solid #f97316; text-align: left; width: 100%; box-shadow: 0 15px 50px rgba(0,0,0,0.6); }
        #vakaMetin { font-size: 1.8rem; font-weight: bold; line-height: 1.4; }
        #overlay { position: fixed; inset: 0; background: #0f172a; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .btn-start { padding: 25px 50px; background: #f97316; color: white; border: none; border-radius: 60px; font-size: 1.5rem; font-weight: bold; cursor: pointer; box-shadow: 0 10px 30px rgba(249,115,22,0.4); }
    </style>
</head>
<body>

    <div id="overlay">
        <img src="https://upload.wikimedia.org/wikipedia/tr/e/ee/Afet_ve_Acil_Durum_Y%C3%B6netimi_Ba%C5%9Fanl%C4%B1%C4%9F%C4%B1_logosu.png" width="130">
        <h1 style="margin:25px 0;">AFAD UÇ BİRİM</h1>
        <button class="btn-start" id="baslatBtn">SİSTEMİ BAŞLAT</button>
        <p style="color:#64748b; margin-top:20px;">Uygulama Olarak Kullan ve Bildirimleri Aç</p>
    </div>

    <div class="header">
        <div id="saat">00:00:00</div>
        <div style="color:#38bdf8; font-weight:bold; margin-top:5px; letter-spacing:1px;">OSMANİYE AFAD</div>
    </div>

    <div class="vaka-container">
        <div class="vaka-kutu">
            <div style="color:#f97316; font-size:0.8rem; font-weight:800; margin-bottom:10px; letter-spacing:2px;">● MERKEZ İHBARI</div>
            <div id="vakaMetin">KOMUTA BEKLENİYOR...</div>
        </div>
    </div>

    <audio id="vakaSesi" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ses = document.getElementById('vakaSesi');

        // PWA Kurulum Yönetimi
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        document.getElementById('baslatBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
            document.getElementById('overlay').style.display = 'none';
            if ("Notification" in window) { Notification.requestPermission(); }
            ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => console.log("Uygulama Bekçisi Hazır"));
        }

        setInterval(() => { document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR'); }, 1000);

        let ilk = true;
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.metin) {
                document.getElementById('vakaMetin').innerText = data.metin;
                if (!ilk && data.metin !== "KOMUTA BEKLENİYOR...") {
                    ses.play().catch(() => {});
                    if (navigator.vibrate) navigator.vibrate([600, 200, 600]);
                }
                ilk = false;
            }
        });
    </script>
</body>
</html>
