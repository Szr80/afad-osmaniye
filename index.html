<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <title>Osmaniye AFAD</title>
    
    <style>
        /* SENİN TASARIMIN VE CSS KODLARIN - HİÇ DOKUNULMADI */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        /* Mevcut CSS kodlarını buraya yapıştırabilirsin... */
    </style>
</head>
<body>
    <div id="login-screen">
        </div>
    
    <div id="main-app" style="display:none;">
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // FIREBASE CONFIG BİLGİLERİNİ BURAYA EKSİKSİZ YAPIŞTIR
        const firebaseConfig = {
            apiKey: "...",
            authDomain: "...",
            databaseURL: "...",
            projectId: "...",
            storageBucket: "...",
            messagingSenderId: "...",
            appId: "..."
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- SİSTEM ZIRHLARI ---

        // 1. Service Worker Kaydı (Hata buradaydı, düzeltildi)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('AFAD Motoru Hazır');
                }).catch(err => console.error('Motor Hatası:', err));
            });
        }

        // 2. Ekran Kilidini Engelle
        let wakeLock = null;
        async function uyanikKal() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        // 3. Kesintisiz Konum Takibi
        function konumBaslat(user) {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const cleanUser = user.replace(/\s/g, "_");
                    update(ref(db, 'aktifKullanicilar/' + cleanUser), {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        sonGuncelleme: serverTimestamp()
                    });
                }, null, { enableHighAccuracy: true, maximumAge: 0 });
            }
        }

        // Giriş Fonksiyonu (Tasarımı bozmadan sistemi açar)
        window.sistemiAc = () => {
            const user = document.getElementById('adSoyad').value.trim();
            if(!user) return;
            
            localStorage.setItem('afadUser', user);
            Notification.requestPermission();
            uyanikKal();
            konumBaslat(user);
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        };

        // Vaka Dinleyicisi
        onValue(ref(db, 'vaka'), (snapshot) => {
            const data = snapshot.val();
            if(data && data.durum === "VAR") {
                if (Notification.permission === "granted") {
                    new Notification("🚨 YENİ VAKA", {
                        body: data.metin,
                        icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png",
                        requireInteraction: true
                    });
                }
                // Senin ses çalma kodların buraya...
            }
        });
    </script>
</body>
</html>
