<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AFAD | PERSONEL UÇ BİRİM</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 15px; overflow-x: hidden; }
        
        .header { text-align: center; padding: 15px; background: #1e293b; border-bottom: 4px solid #f97316; border-radius: 10px; margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 1.2rem; color: #f97316; }

        .vaka-kart { background: #1e293b; padding: 20px; border-radius: 15px; border: 2px solid #334155; text-align: center; margin-bottom: 15px; }
        .vaka-metin { font-size: 1.3rem; font-weight: 900; color: #f1f5f9; margin-bottom: 10px; min-height: 50px; }
        .vaka-zaman { font-size: 0.8rem; color: #94a3b8; }

        .durum-izgara { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn { padding: 18px; border: none; border-radius: 12px; font-weight: 900; color: white; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .btn-mavi { background: #3b82f6; }
        .btn-sari { background: #eab308; color: #000; }
        .btn-yesil { background: #22c55e; }
        .btn-sos { background: #dc2626; grid-column: span 2; font-size: 1.2rem; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); opacity: 0.8; } 100% { transform: scale(1); } }

        .telsiz-alan { background: #1e293b; padding: 20px; border-radius: 15px; text-align: center; }
        .btn-kayit { width: 100px; height: 100px; border-radius: 50%; border: 6px solid #334155; background: #475569; color: white; font-size: 2rem; transition: 0.3s; margin-bottom: 10px; }
        .kaydediyor { background: #dc2626; border-color: #ef4444; transform: scale(1.1); box-shadow: 0 0 20px rgba(220, 38, 38, 0.5); }
    </style>
</head>
<body>

    <div class="header">
        <h1>OSMANİYE AFAD SAHA</h1>
        <div id="personelIsim" style="font-size:0.8rem; margin-top:5px; color:#94a3b8;">Yükleniyor...</div>
    </div>

    <div class="vaka-kart">
        <div id="vakaGosterge" class="vaka-metin">GÖREV BEKLENİYOR...</div>
        <div id="vakaSaat" class="vaka-zaman">--:--</div>
    </div>

    <div class="durum-izgara">
        <button class="btn btn-mavi" onclick="durumGuncelle('YOLDAYIM')">🚛 YOLDAYIM</button>
        <button class="btn btn-sari" onclick="durumGuncelle('OLAY YERİNDE')">📍 OLAY YERİNDE</button>
        <button class="btn btn-yesil" onclick="durumGuncelle('AKTİF')">✅ TAMAMLANDI</button>
        <button class="btn btn-sos" onclick="acilDurum()">🚨 SOS / YARDIM</button>
    </div>

    <div class="telsiz-alan">
        <button id="recordBtn" class="btn-kayit">🎤</button>
        <p id="telsizDurum" style="font-size:0.8rem; color:#94a3b8;">Basılı Tut ve Konuş</p>
    </div>

    <audio id="bildirimSes" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = { 
            databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/",
            storageBucket: "ana-uygulama-f22cb.appspot.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        let kullanici = localStorage.getItem('afad_isim') || prompt("İsim Soyisim Giriniz:");
        if(kullanici) localStorage.setItem('afad_isim', kullanici);
        document.getElementById('personelIsim').innerText = "PERSONEL: " + kullanici.toUpperCase();

        // 6 SANİYE SESLİ VAKA BİLDİRİMİ
        let sonVaka = "";
        onValue(ref(db, 'ortakKanal'), (s) => {
            const d = s.val();
            if(d && d.metin !== sonVaka && d.metin !== "GÖREV BEKLENİYOR...") {
                sonVaka = d.metin;
                document.getElementById('vakaGosterge').innerText = d.metin;
                document.getElementById('vakaSaat').innerText = d.zaman;
                const ses = document.getElementById('bildirimSes');
                ses.play();
                if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
                setTimeout(() => { ses.pause(); ses.currentTime = 0; }, 6000);
            } else if (d && d.metin === "GÖREV BEKLENİYOR...") {
                document.getElementById('vakaGosterge').innerText = d.metin;
                document.getElementById('vakaSaat').innerText = "--:--";
            }
        });

        window.durumGuncelle = (durum) => {
            navigator.geolocation.getCurrentPosition((pos) => {
                const updates = {
                    isim: kullanici,
                    durum: durum,
                    enlem: pos.coords.latitude,
                    boylam: pos.coords.longitude,
                    timestamp: Date.now(),
                    sonSinyal: new Date().toLocaleTimeString('tr-TR'),
                    acilDurum: false
                };
                set(ref(db, 'aktifKullanicilar/' + kullanici.replace(/\s+/g, '_')), updates);
            });
        };

        // SOS: 3 SANİYE / 3 KEZ TİTREŞİM MEKANİZMASI
        window.acilDurum = () => {
            if(navigator.vibrate) {
                // 500ms titre, 500ms bekle (3 tekrar = toplam 3 saniye süreç)
                navigator.vibrate([500, 500, 500, 500, 500]);
            }
            update(ref(db, 'aktifKullanicilar/' + kullanici.replace(/\s+/g, '_')), { 
                acilDurum: true,
                durum: "🚨 ACİL DURUM",
                timestamp: Date.now()
            });
            alert("🚨 YARDIM ÇAĞRISI İLETİLDİ!");
        };

        let mediaRecorder;
        let audioChunks = [];
        const recordBtn = document.getElementById('recordBtn');

        recordBtn.onpointerdown = async (e) => {
            e.preventDefault();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const fileRef = sRef(storage, `telsiz/${Date.now()}.webm`);
                await uploadBytes(fileRef, blob);
                const url = await getDownloadURL(fileRef);
                push(ref(db, 'telsizMesajlari'), {
                    ekip: kullanici,
                    ses: url,
                    zaman: new Date().toLocaleTimeString('tr-TR')
                });
            };
            mediaRecorder.start();
            recordBtn.classList.add('kaydediyor');
        };

        recordBtn.onpointerup = () => {
            if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            recordBtn.classList.remove('kaydediyor');
        };
    </script>
</body>
</html>
