<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>OSMANİYE AFAD | SAHA</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; transition: 0.5s; }
        
        /* GİRİŞ EKRANI (PIN) */
        #loginOverlay { position: fixed; inset: 0; background: #0f172a; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: #1e293b; padding: 40px 20px; border-radius: 20px; border: 2px solid #f97316; width: 85%; max-width: 350px; box-shadow: 0 0 30px rgba(249, 115, 22, 0.2); }
        .pin-input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 2rem; text-align: center; letter-spacing: 10px; }
        
        /* ANA PANEL */
        .ust-panel { background: #1e293b; padding: 15px; border-bottom: 5px solid #f97316; }
        .zaman-satiri { display: flex; justify-content: space-between; padding: 0 10px; color: #94a3b8; font-size: 0.8rem; font-weight: bold; }
        #ana-baslik { font-size: 1.4rem; color: #f97316; font-weight: 900; margin: 5px 0; }
        
        .vaka-alani { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; overflow-y: auto; }
        .kutu { background: #1e293b; padding: 20px; border-radius: 15px; border-left: 10px solid #f97316; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        #vakaMetin { font-size: 1.4rem; font-weight: bold; line-height: 1.3; margin-top: 8px; }
        
        /* TELSİZ MANDALI SİSTEMİ */
        .mandal-bolumu { background: #1e293b; padding: 20px; border-top: 2px solid #334155; display: flex; align-items: center; justify-content: space-around; }
        .btn-mandal { width: 80px; height: 80px; border-radius: 50%; background: #f97316; border: 6px solid #450a0a; color: white; font-size: 2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; touch-action: none; -webkit-tap-highlight-color: transparent; }
        .btn-mandal:active { background: #dc2626; transform: scale(0.9); box-shadow: 0 0 30px #ef4444; }
        .mandal-yazi { font-size: 0.75rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; line-height: 1.5; }

        /* BUTONLAR */
        .btn-grup { display: none; flex-direction: column; gap: 10px; width: 100%; }
        .btn { padding: 18px; border-radius: 12px; border: none; font-weight: 900; color: white; font-size: 1.1rem; text-transform: uppercase; }
        
        /* GEÇMİŞ */
        .gecmis-item { background: rgba(30, 41, 59, 0.5); padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 4px solid #475569; text-align: left; }
        .gecmis-ust { display: flex; justify-content: space-between; font-size: 0.7rem; color: #f97316; font-weight: 800; margin-bottom: 4px; }

        .kritik-mod { background: #450a0a !important; animation: flash 1.2s infinite; }
        @keyframes flash { 0%, 100% {background: #0f172a;} 50% {background: #7f1d1d;} }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color:#f97316; margin:0;">AFAD GİRİŞ</h2>
            <p style="font-size:0.8rem; color:#94a3b8; margin-top:10px;">PERSONEL PIN KODUNU GİRİN</p>
            <input type="password" id="pinInput" class="pin-input" placeholder="****" maxlength="4" inputmode="numeric">
            <button class="btn" style="background:#f97316; width:100%;" onclick="sistemiAc()">SİSTEMİ AKTİF ET</button>
        </div>
    </div>

    <div class="ust-panel">
        <div class="zaman-satiri">
            <div id="tarih-ust">--/--/---- -------</div>
            <div id="saat-ust">00:00:00</div>
        </div>
        <div id="ana-baslik">OSMANİYE AFAD UÇ BİRİM</div>
        <div id="personelBilgi" style="font-size:0.7rem; color:#22c55e; font-weight:bold;">SİSTEM HAZIR</div>
    </div>

    <div class="vaka-alani">
        <div class="kutu" id="vakaKutusu">
            <div id="vakaDurumEtiket" style="color:#f97316; font-size:0.75rem; font-weight:900;">● SİSTEM AKTİF / GÖREV BEKLENİYOR</div>
            <div id="vakaMetin">KOMUTA MERKEZİ BEKLENİYOR...</div>
        </div>

        <div id="islemButonlari" class="btn-grup">
            <button class="btn" style="background:#0284c7" onclick="durumGuncelle('YOLDAYIZ','#0284c7')">✚ YOLDAYIZ</button>
            <button class="btn" style="background:#eab308; color:black;" onclick="durumGuncelle('VARILDI','#eab308')">📍 VARILDI</button>
            <button class="btn" style="background:#4f46e5" onclick="durumGuncelle('DÖNÜŞTE','#4f46e5')">🔄 DÖNÜŞTE</button>
            <button class="btn" style="background:#22c55e" onclick="durumGuncelle('TAMAMLANDI','#22c55e', true)">✓ TAMAMLANDI</button>
        </div>

        <div id="gecmisListe"></div>
    </div>

    <div class="mandal-bolumu">
        <div class="mandal-yazi" id="mandalDurum">TELSİZ MANDALI<br><span style="color:#64748b">BAS-KONUŞ</span></div>
        <div class="btn-mandal" id="mandalBtn">🎤</div>
    </div>

    <audio id="vakaSes" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ana-uygulama-f22cb-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ses = document.getElementById('vakaSes');
        let alarmZamanlayici;
        let vakaGecmisi = [];

        // 1. GİRİŞ VE SES AKTİVASYONU
        window.sistemiAc = () => {
            const pin = document.getElementById('pinInput').value;
            if(pin === "1234") { // Örnek PIN: 1234
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('personelBilgi').innerText = "BİRİM: EKİP-1 ÇEVRİMİÇİ";
                ses.play().then(() => { ses.pause(); ses.currentTime = 0; });
            } else { alert("Hatalı PIN!"); }
        };

        // 2. CANLI SAAT VE GÜN
        setInterval(() => {
            const simdi = new Date();
            document.getElementById('saat-ust').innerText = simdi.toLocaleTimeString('tr-TR');
            document.getElementById('tarih-ust').innerText = simdi.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'long' });
        }, 1000);

        // 3. TELSİZ MANDALI (BAS-KONUŞ)
        let mediaRecorder;
        let audioChunks = [];
        const mandalBtn = document.getElementById('mandalBtn');

        const kaydiBaslat = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        push(ref(db, 'telsizMesajlari'), {
                            ses: reader.result,
                            ekip: "EKİP-1",
                            zaman: new Date().toLocaleTimeString('tr-TR')
                        });
                    };
                };
                mediaRecorder.start();
                document.getElementById('mandalDurum').innerHTML = "TELSİZ AKTİF<br><span style='color:#ef4444'>KAYITTA...</span>";
                if(navigator.vibrate) navigator.vibrate(100);
            } catch (err) { console.error("Mikrofon erişimi reddedildi", err); }
        };

        mandalBtn.addEventListener('pointerdown', e => { e.preventDefault(); kaydiBaslat(); });
        mandalBtn.addEventListener('pointerup', () => {
            if(mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                document.getElementById('mandalDurum').innerHTML = "MESAJ GİTTİ<br><span style='color:#22c55e'>İLETİLDİ</span>";
                setTimeout(() => document.getElementById('mandalDurum').innerHTML = "TELSİZ MANDALI<br><span style='color:#64748b'>BAS-KONUŞ</span>", 1500);
            }
        });

        // 4. DURUM GÜNCELLEME
        window.durumGuncelle = (durum, renk, bitis = false) => {
            set(ref(db, 'ekipDurum'), { durum, renk, zaman: new Date().toLocaleTimeString('tr-TR') });
            if(bitis) {
                document.getElementById('islemButonlari').style.display = 'none';
                document.body.classList.remove('kritik-mod');
                ses.pause();
                document.getElementById('vakaDurumEtiket').innerText = "● GÖREV TAMAMLANDI";
            }
        };

        // 5. VAKA DİNLEME VE GEÇMİŞ
        let sonMesaj = "";
        onValue(ref(db, 'ortakKanal'), (snapshot) => {
            const data = snapshot.val();
            if(data && data.metin) {
                const metin = data.metin.trim();
                const vakaVarMi = !metin.includes("BEKLENİYOR") && metin !== "";

                if(vakaVarMi && metin !== sonMesaj) {
                    ses.currentTime = 0; ses.loop = true; ses.play().catch(()=>{});
                    clearTimeout(alarmZamanlayici);
                    alarmZamanlayici = setTimeout(() => { ses.loop = false; ses.pause(); }, 6000);

                    document.getElementById('vakaMetin').innerText = metin;
                    document.getElementById('islemButonlari').style.display = 'flex';
                    document.getElementById('vakaDurumEtiket').innerText = "● AKTİF VAKA";
                    
                    if(data.oncelik === 'kritik') document.body.classList.add('kritik-mod');
                    else document.body.classList.remove('kritik-mod');

                    // Geçmişe Ekle
                    const simdi = new Date();
                    vakaGecmisi.unshift({
                        metin: metin,
                        tarih: simdi.toLocaleDateString('tr-TR', {day:'2-digit', month:'2-digit'}),
                        gun: simdi.toLocaleDateString('tr-TR', {weekday:'long'}),
                        saat: simdi.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})
                    });
                    if(vakaGecmisi.length > 5) vakaGecmisi.pop();
                    
                    document.getElementById('gecmisListe').innerHTML = vakaGecmisi.map(v => `
                        <div class="gecmis-item">
                            <div class="gecmis-ust"><span>📅 ${v.tarih} ${v.gun}</span><span>🕒 ${v.saat}</span></div>
                            <div style="color:#cbd5e1; font-weight:500;">${v.metin}</div>
                        </div>
                    `).join('');

                    if(navigator.vibrate) navigator.vibrate([500, 200, 500]);
                } else if(!vakaVarMi) {
                    document.getElementById('vakaMetin').innerText = "KOMUTA MERKEZİ BEKLENİYOR...";
                    document.getElementById('islemButonlari').style.display = 'none';
                    document.body.classList.remove('kritik-mod');
                    ses.pause();
                    document.getElementById('vakaDurumEtiket').innerText = "● SİSTEM AKTİF / GÖREV BEKLENİYOR";
                }
                sonMesaj = metin;
            }
        });
    </script>
</body>
</html>
